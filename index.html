function renderMkt(){
  const m=getM();
  const cumSales  = M_NET_SALES.slice(0,m+1).reduce((a,b)=>a+b,0);
  const cumMkt    = M_MKT_COST.slice(0,m+1).reduce((a,b)=>a+b,0);
  const cumScmQty = BOOKS.reduce((a,b)=>a+(b.cumSalesQty||0),0);
  const mScmQty   = BOOKS.reduce((a,b)=>a+(Object.values(b.stores||{}).reduce((x,y)=>x+y,0)),0);
  const mMkt      = M_MKT_COST[m]||0;
  const mNet      = M_NET_SALES[m]||0;
  const mRoi      = mMkt?Math.round(mNet/mMkt*100):0;
  const mCpa      = mScmQty?Math.round(mMkt/mScmQty):0;
  const cumRoi    = cumMkt?Math.round(cumSales/cumMkt*100):0;

  // 도서별 마케팅 상세 (sortable)
  const rows=BOOKS.map(b=>{
    const scm=Object.values(b.stores||{}).reduce((a,v)=>a+v,0);
    const roi=b.cumMktCost?Math.round(b.cumSalesPub/b.cumMktCost*100):0;
    const cpa=scm?Math.round(b.cumMktCost/b.cumSalesQty):0;
    return {...b, scm, roi, cpa};
  });
  const sorted=sortRows(rows,'mkt',['cumSalesQty','cumMktCost','cumSalesPub','roi','cpa','scm']);

  // 서점별 월별 SCM 차트
  const scmSegs=SCM_STORES.map((s,i)=>({label:s,color:SCM_COLORS[i]}));
  const scmRows=M_SCM.slice(0,m+1).map((d,i)=>({
    label:MONTHS[i],
    vals:SCM_COLS.map(k=>d[k]||0)
  }));

  document.getElementById('tab-mkt').innerHTML=`
    <!-- 누적 KPI -->
    <div class="sec-label gap">누적 실적</div>
    <div class="g3">
      <div class="kpi"><div class="kpi-lbl">누적 판매 부수</div><div class="kpi-val">${cumScmQty.toLocaleString()}<span style="font-size:15px;font-weight:400">부</span></div><div class="kpi-sub">SCM 기준</div></div>
      <div class="kpi"><div class="kpi-lbl">누적 마케팅 비용</div><div class="kpi-val">${won(cumMkt)}</div><div class="kpi-sub">${m+1}개월 합산</div></div>
      <div class="kpi"><div class="kpi-lbl">누적 ROI</div><div class="kpi-val ${cumRoi>=150?'good':cumRoi>=100?'warn':'bad'}">${cumRoi}%</div><div class="kpi-sub">순매출 ÷ 마케팅비</div></div>
    </div>

    <!-- 당월 KPI -->
    <div class="sec-label gap2">당월 실적</div>
    <div class="g4">
      <div class="kpi"><div class="kpi-lbl">월 판매 부수</div><div class="kpi-val">${mScmQty.toLocaleString()}<span style="font-size:15px;font-weight:400">부</span></div><div class="kpi-sub">SCM 집계</div></div>
      <div class="kpi"><div class="kpi-lbl">월 마케팅 비용</div><div class="kpi-val">${won(mMkt)}</div>${cmpTag(M_MKT_COST,m,true)}<div class="kpi-sub">${MONTHS[m]} 집행</div></div>
      <div class="kpi"><div class="kpi-lbl">월 ROI</div><div class="kpi-val ${mRoi>=150?'good':mRoi>=100?'warn':'bad'}">${mRoi}%</div><div class="kpi-sub">순매출 ÷ 마케팅비</div></div>
      <div class="kpi"><div class="kpi-lbl">구매유치비 (평균)</div><div class="kpi-val ${mCpa<8000?'good':mCpa<12000?'warn':'bad'}">${mCpa.toLocaleString()}원</div><div class="kpi-sub">마케팅비 ÷ SCM</div></div>
    </div>

    <!-- 중단: 서점별 월단위 SCM -->
    <div class="sec-label gap2">서점별 월단위 판매 부수</div>
    <div class="card">
      <div class="card-title">채널별 판매 추이 <small>온라인·오프라인 비중</small></div>
      ${stackedBarChart(scmRows, scmSegs)}
    </div>

    <!-- 하단: 도서별 마케팅 상세 -->
    <div class="sec-label gap2">도서별 일별 판매 추이</div>
    <div class="card">
      <div class="card-title">최근 일별 판매 부수 <small>도서를 검색해 최대 5종까지 겹쳐 봅니다</small></div>
      ${renderDailyTrend()}
    </div>`;
  setTimeout(initWeeklyChartHover, 100);
}

/* ── 도서 일별 판매 추이 ──
   주차별 곡선은 이미 지나간 책의 모양이라 오늘 뭘 할지가 안 나온다.
   최근 N일 일별 판매를 겹쳐 보면 광고·제휴가 언제 먹혔는지 바로 보인다. */
const DTREND = { q:'', days:20, ma:false, ev:true, picked:[] };
const DT_COLORS = ['#3A5BD9', '#E5484D', '#3DBE8B', '#F0A020', '#8B5CF6'];

// 검색어를 칠 때마다 탭 전체를 다시 그리면 입력창이 새로 만들어져 한글 조합이 끊긴다.
// 그래서 입력창은 그대로 두고 후보 목록만 갈아끼운다.
function dtSearch(v){
  DTREND.q = String(v||'').trim();
  dtPaintHits();
}
function dtPaintHits(){
  const box = document.getElementById('dtHits');
  if (box) box.innerHTML = dtHitsHTML();
}
function dtDays(n){ DTREND.days = +n; renderMkt(); }
function dtMA(){ DTREND.ma = !DTREND.ma; renderMkt(); }
function dtEv(){ DTREND.ev = !DTREND.ev; renderMkt(); }
function dtToggle(t){
  const i = DTREND.picked.indexOf(t);
  if (i >= 0) DTREND.picked.splice(i, 1);
  else { if (DTREND.picked.length >= 5) DTREND.picked.shift(); DTREND.picked.push(t); }
  DTREND.q = '';          // 고르면 목록을 닫는다 — 차트를 가리지 않게
  renderMkt();
  setTimeout(() => { const el = document.getElementById('dtQ'); if (el) { el.value = ''; el.focus(); } }, 0);
}
function dtClear(){ DTREND.picked = []; renderMkt(); }

// 도서별 일자 합계 (서점 합산)
function dtSeries(title, dates){
  const m = DAY_SALES_STORE[title] || {};
  return dates.map(d => {
    const o = m[d];
    if (!o) return 0;
    return Object.values(o).reduce((a,b) => a + (+b||0), 0);
  });
}
function dtMovingAvg(v, w){
  return v.map((_,i) => {
    const s = Math.max(0, i-w+1), seg = v.slice(s, i+1);
    return seg.reduce((a,b)=>a+b,0) / seg.length;
  });
}

/* 곡선 위에 얹을 이벤트 — 급등이 어디서 왔는지 눈으로 잇는다.
   캠페인 시트의 액션과 채널 업로드를 날짜별로 모은다. */
function dtEvents(titles, dates){
  const from = dates[0], to = dates[dates.length-1];
  const byDay = {};
  const add = (d, kind, text) => {
    if (!d || d < from || d > to) return;
    (byDay[d] = byDay[d] || []).push({kind, text});
  };
  const keys = titles.map(t => royNorm(t));
  const hit = v => { const n = royNorm(v); return keys.some(k => k && (n.indexOf(k) >= 0 || k.indexOf(n) >= 0)); };

  // 1) 마케팅 캠페인 액션 (제휴·광고·서점)
  (MKT_BOOKS || []).forEach(b => {
    if (!hit(b.name || b.code)) return;
    (MKT_ACTIONS[b.code] || []).forEach(a => {
      if (!a.date) return;
      const lane = String(a.lane || '');
      const kind = /광고|퍼포|메타|구글/.test(lane) ? 'ad'
                 : (/서점|매대|팝업/.test(lane) ? 'store' : 'tieup');
      add(a.date, kind, (a.label || lane || '캠페인') + (a.cost ? ` · ${won(a.cost)}` : ''));
    });
  });

  // 2) 자사 채널 업로드 — 같은 날 여러 건이면 묶는다
  const upCnt = {};
  (CH_UPLOAD || []).forEach(u => {
    if (!u.date || !hit(u.book || u.title)) return;
    const d = ymd(u.date);
    upCnt[d] = (upCnt[d] || 0) + 1;
  });
  Object.keys(upCnt).forEach(d => add(d, 'content', `콘텐츠 업로드 ${upCnt[d]}건`));

  // 3) 배본일
  (PUB_BOOKS || []).forEach(b => {
    if (!hit(b.title)) return;
    const d = b.inDate || b.ship;
    if (d) add(ymd(d), 'ship', '배본');
  });

  return byDay;
}
const DT_EV = {
  ship:    {c:'#0F1620', label:'배본'},
  tieup:   {c:'#3A5BD9', label:'제휴'},
  ad:      {c:'#E5484D', label:'광고'},
  store:   {c:'#F0A020', label:'서점'},
  content: {c:'#8B95A5', label:'콘텐츠'},
};

// 기간 내 판매가 있는 도서 (검색 후보)
function dtCandidates(){
  const all = new Set();
  Object.keys(DAY_SALES_STORE||{}).forEach(b =>
    Object.keys(DAY_SALES_STORE[b]||{}).forEach(d => all.add(d)));
  const dates = [...all].sort().slice(-DTREND.days);
  return Object.keys(DAY_SALES_STORE||{})
    .map(t => ({t, sum: dtSeries(t, dates).reduce((a,b)=>a+b,0)}))
    .filter(x => x.sum > 0)
    .sort((a,b) => b.sum - a.sum);
}
function dtHitsHTML(){
  const nq = v => String(v||'').toLowerCase().replace(/\s/g,'');
  const q = nq(DTREND.q);
  if (!q) return '';
  const hits = dtCandidates().filter(x => nq(x.t).indexOf(q) >= 0);
  if (!hits.length) return `<div style="position:absolute;top:38px;left:0;z-index:40;width:330px;
    background:var(--surface);border:1px solid var(--border2);border-radius:var(--r2);
    box-shadow:var(--sh-lg);padding:11px 13px;font-size:12px;color:var(--ink3)">검색 결과가 없습니다</div>`;
  return `<div style="position:absolute;top:38px;left:0;z-index:40;width:330px;max-height:250px;
    overflow-y:auto;background:var(--surface);border:1px solid var(--border2);border-radius:var(--r2);
    box-shadow:var(--sh-lg)">
    ${hits.slice(0,12).map(x => {
      const on = DTREND.picked.indexOf(x.t) >= 0;
      return `<div onclick="dtToggle('${esc(x.t).replace(/'/g,"\\'")}')"
        style="display:flex;align-items:center;gap:9px;padding:8px 12px;cursor:pointer;
        ${on?'background:var(--accent-dim)':''}">
        <span style="width:14px;height:14px;border-radius:4px;flex-shrink:0;
          border:1.5px solid ${on?'var(--accent)':'var(--border2)'};
          background:${on?'var(--accent)':'transparent'};color:#FFF;font-size:9px;
          display:flex;align-items:center;justify-content:center">${on?'&#10003;':''}</span>
        <span style="font-size:12px;color:var(--ink);flex:1;white-space:nowrap;overflow:hidden;
          text-overflow:ellipsis">${esc(x.t)}</span>
        <span style="font-size:11px;color:var(--ink3)">${x.sum.toLocaleString()}부</span>
      </div>`;
    }).join('')}
  </div>`;
}

function renderDailyTrend(){
  // 데이터가 있는 날짜 축
  const all = new Set();
  Object.keys(DAY_SALES_STORE||{}).forEach(b =>
    Object.keys(DAY_SALES_STORE[b]||{}).forEach(d => all.add(d)));
  const dates = [...all].sort().slice(-DTREND.days);
  if (!dates.length) return '<div class="empty-row">일별 판매 데이터가 없습니다</div>';

  // 검색 후보 — 기간 내 판매가 있는 도서
  const cand = Object.keys(DAY_SALES_STORE||{})
    .map(t => ({t, sum: dtSeries(t, dates).reduce((a,b)=>a+b,0)}))
    .filter(x => x.sum > 0)
    .sort((a,b) => b.sum - a.sum);

  const nq = v => String(v||'').toLowerCase().replace(/\s/g,'');
  const q = nq(DTREND.q);
  const hits = q ? cand.filter(x => nq(x.t).indexOf(q) >= 0) : [];

  // 고른 것이 없으면 판매 상위 3종을 기본으로
  const picked = DTREND.picked.length ? DTREND.picked : cand.slice(0,3).map(x => x.t);
  const series = picked.map((t,i) => {
    const raw = dtSeries(t, dates);
    return { t, raw, v: DTREND.ma ? dtMovingAvg(raw, 7) : raw, c: DT_COLORS[i % DT_COLORS.length] };
  });

  const EV = DTREND.ev ? dtEvents(picked, dates) : {};
  const evDays = Object.keys(EV).length;
  const W = 1000, H = 300, PADL = 46, PADR = 16, PADT = 40, PADB = 30;
  const mx = Math.max(...series.flatMap(s => s.v), 1);
  const step = dates.length > 1 ? (W-PADL-PADR)/(dates.length-1) : 0;
  const X = i => PADL + i*step;
  const Y = v => PADT + (1 - v/mx) * (H-PADT-PADB);
  const short = d => d.slice(5).replace('-','/');

  return `
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px">
    <div style="position:relative">
      <input id="dtQ" value="${esc(DTREND.q)}" oninput="dtSearch(this.value)"
        placeholder="도서명 검색 후 선택 · 최대 5종"
        style="width:250px;border:1px solid var(--border2);background:var(--surface);color:var(--ink);
        border-radius:var(--r3);padding:7px 12px;font-family:var(--sans);font-size:12px;outline:none">
      <span onclick="dtSearch('');document.getElementById('dtQ').value=''" title="검색 지우기"
        style="position:absolute;right:9px;top:7px;cursor:pointer;color:var(--ink3);font-size:13px">&#10005;</span>
      <div id="dtHits">${dtHitsHTML()}</div>
    </div>
    ${[14,20,30,60].map(n => `<button onclick="dtDays(${n})"
      style="border:1px solid ${DTREND.days===n?'var(--accent)':'var(--border2)'};
      background:${DTREND.days===n?'var(--accent-dim)':'var(--surface)'};
      color:${DTREND.days===n?'var(--accent-deep)':'var(--ink2)'};border-radius:var(--r3);
      padding:6px 11px;font-family:var(--sans);font-size:11.5px;font-weight:700;cursor:pointer">${n}일</button>`).join('')}
    <button onclick="dtEv()" title="제휴·광고·업로드 시점을 곡선 위에 표시합니다"
      style="border:1px solid ${DTREND.ev?'var(--accent)':'var(--border2)'};
      background:${DTREND.ev?'var(--accent-dim)':'var(--surface)'};
      color:${DTREND.ev?'var(--accent-deep)':'var(--ink2)'};border-radius:var(--r3);
      padding:6px 11px;font-family:var(--sans);font-size:11.5px;font-weight:700;cursor:pointer">이벤트</button>
    <button onclick="dtMA()" title="요일 편차를 걷어내고 흐름만 봅니다"
      style="border:1px solid ${DTREND.ma?'var(--accent)':'var(--border2)'};
      background:${DTREND.ma?'var(--accent-dim)':'var(--surface)'};
      color:${DTREND.ma?'var(--accent-deep)':'var(--ink2)'};border-radius:var(--r3);
      padding:6px 11px;font-family:var(--sans);font-size:11.5px;font-weight:700;cursor:pointer">7일 평균</button>
    ${DTREND.picked.length ? `<button onclick="dtClear()"
      style="border:1px solid var(--border2);background:var(--surface);color:var(--ink3);
      border-radius:var(--r3);padding:6px 11px;font-family:var(--sans);font-size:11.5px;cursor:pointer">선택 해제</button>` : ''}
    <span style="margin-left:auto;font-size:11px;color:var(--ink3)">
      ${short(dates[0])} ~ ${short(dates[dates.length-1])}
      ${DTREND.picked.length ? '' : ' · 판매 상위 3종 자동 표시'}</span>
  </div>

  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
    ${series.map(s => `<span style="display:inline-flex;align-items:center;gap:7px;font-size:12px;
      padding:4px 10px;background:var(--surface3);border-radius:var(--r4)">
      <span style="width:12px;height:3px;border-radius:2px;background:${s.c}"></span>
      <b style="color:var(--ink)">${esc(s.t)}</b>
      <span style="color:var(--ink3)">${s.raw.reduce((a,b)=>a+b,0).toLocaleString()}부</span>
      ${DTREND.picked.length ? `<span onclick="dtToggle('${esc(s.t).replace(/'/g,"\\'")}')" title="빼기"
        style="cursor:pointer;color:var(--ink5);font-size:12px;margin-left:2px">&#10005;</span>` : ''}
    </span>`).join('')}
  </div>

  ${evDays ? `<div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:8px;font-size:11px;color:var(--ink3)">
    <span>이벤트</span>
    ${Object.keys(DT_EV).map(k=>`<span style="display:inline-flex;align-items:center;gap:5px">
      <span style="width:8px;height:8px;border-radius:50%;background:${DT_EV[k].c}"></span>${DT_EV[k].label}</span>`).join('')}
    <span style="color:var(--ink5)">점에 마우스를 올리면 내용이 보입니다</span>
  </div>` : ''}
  <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;overflow:visible">
    ${[0,0.25,0.5,0.75,1].map(f => {
      const y = PADT + f*(H-PADT-PADB), v = Math.round(mx*(1-f));
      return `<line x1="${PADL}" x2="${W-PADR}" y1="${y}" y2="${y}" stroke="var(--border)" stroke-width="1"/>
        <text x="${PADL-8}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--ink3)">${v.toLocaleString()}</text>`;
    }).join('')}
    ${dates.map((d,i) => {
      const every = Math.max(1, Math.ceil(dates.length/12));
      if (i % every && i !== dates.length-1) return '';
      return `<text x="${X(i)}" y="${H-10}" text-anchor="middle" font-size="10" fill="var(--ink3)">${short(d)}</text>`;
    }).join('')}
    ${Object.keys(EV).map(d => {
      const i = dates.indexOf(d);
      if (i < 0) return '';
      const list = EV[d];
      const main = ['ship','ad','tieup','store','content'].find(k => list.some(e=>e.kind===k)) || 'content';
      const c = DT_EV[main].c;
      const tip = list.map(e=>DT_EV[e.kind].label+' · '+e.text).join('\n');
      return `<g><title>${esc(d)}\n${esc(tip)}</title>
        <line x1="${X(i).toFixed(1)}" x2="${X(i).toFixed(1)}" y1="${PADT-16}" y2="${H-PADB}"
          stroke="${c}" stroke-width="1" stroke-dasharray="3 3" opacity=".45"/>
        <circle cx="${X(i).toFixed(1)}" cy="${PADT-20}" r="5" fill="${c}"/>
        ${list.length>1 ? `<text x="${X(i).toFixed(1)}" y="${PADT-17}" text-anchor="middle"
          font-size="7.5" font-weight="700" fill="#FFF">${list.length}</text>` : ''}
      </g>`;
    }).join('')}
    ${series.map(s => {
      const pts = s.v.map((v,i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' L');
      return `<path d="M${pts}" fill="none" stroke="${s.c}" stroke-width="2.2"
        stroke-linejoin="round" stroke-linecap="round"/>
        ${s.v.map((v,i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="2.6"
          fill="#FFF" stroke="${s.c}" stroke-width="1.6"><title>${esc(s.t)} · ${short(dates[i])} · ${Math.round(s.raw[i]).toLocaleString()}부</title></circle>`).join('')}`;
    }).join('')}
  </svg>

  <table style="margin-top:16px">
    <tr><th>도서</th><th class="right" style="width:96px">기간 합계</th>
      <th class="right" style="width:88px">일평균</th><th class="right" style="width:96px">최고일</th>
      <th class="right" style="width:110px">최근 7일</th><th class="right" style="width:110px">직전 7일 대비</th></tr>
    ${series.map(s => {
      const sum = s.raw.reduce((a,b)=>a+b,0);
      const best = Math.max(...s.raw), bi = s.raw.indexOf(best);
      const l7 = s.raw.slice(-7).reduce((a,b)=>a+b,0);
      const p7 = s.raw.slice(-14,-7).reduce((a,b)=>a+b,0);
      const diff = p7 ? (l7/p7-1)*100 : null;
      return `<tr>
        <td><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${s.c};
          margin-right:8px"></span><b style="font-size:12px">${esc(s.t)}</b></td>
        <td class="right"><b>${sum.toLocaleString()}</b></td>
        <td class="right">${Math.round(sum/s.raw.length).toLocaleString()}</td>
        <td class="right">${best.toLocaleString()}<span style="color:var(--ink3);font-size:10px;margin-left:5px">${short(dates[bi])}</span></td>
        <td class="right">${l7.toLocaleString()}</td>
        <td class="right">${diff==null ? '<span style="color:var(--ink3)">—</span>'
          : `<b style="color:${diff>=0?'var(--good)':'var(--bad)'}">${diff>=0?'▲':'▼'} ${Math.abs(diff).toFixed(0)}%</b>`}</td>
      </tr>`;
    }).join('')}
  </table>`;
}

/* ─────────────────────────────────────
   WEEKLY SALES CHART
───────────────────────────────────── */
function renderWeeklyChart() {
  const strategic = BOOKS.filter(b => b.isStrategic && WEEK_SALES[b.title]);
  if (!strategic.length) return '<div style="color:var(--ink3);padding:20px 0;text-align:center">전략도서 주차별 데이터 없음</div>';

  const color = '#37424F';

  return strategic.map((b, bi) => {
    const weeks = (WEEK_SALES[b.title] || [])
      .sort((a, c) => a.week.localeCompare(c.week));
    if (!weeks.length) return '';

    const maxQty = Math.max(...weeks.map(w => w.qty), 1);
    const W = 1400, H = 180;
    const PAD = {t:20, r:20, b:36, l:56};
    const cW = W - PAD.l - PAD.r;
    const cH = H - PAD.t - PAD.b;
    const n = weeks.length;

    const xPos = i => PAD.l + (n > 1 ? i / (n-1) : 0.5) * cW;
    const yPos = v => PAD.t + cH - (v / maxQty) * cH;
    const fmtN = v => v >= 1000 ? Math.round(v/100)/10+'k' : v;

    const yTicks = 3;
    const grid = Array.from({length:yTicks+1},(_,i) => {
      const v = Math.round(maxQty * i / yTicks);
      return `<line x1="${PAD.l}" x2="${PAD.l+cW}" y1="${yPos(v)}" y2="${yPos(v)}" stroke="#00000010" stroke-width="1"/>
      <text x="${PAD.l-8}" y="${yPos(v)+4}" fill="#8B97A6" font-size="10" text-anchor="end">${fmtN(v)}</text>`;
    }).join('');

    const xStep = Math.max(1, Math.ceil(n/12));
    const xLabels = weeks.map((w,i) => i % xStep === 0 ?
      `<text x="${xPos(i)}" y="${PAD.t+cH+16}" fill="#8B97A6" font-size="10" text-anchor="middle">${i+1}주</text>` : ''
    ).join('');

    const pts = weeks.map((w,i) => `${xPos(i)},${yPos(w.qty)}`).join('L');

    // 그라데이션 fill
    const fillPts = `${xPos(0)},${PAD.t+cH} M${pts} L${xPos(n-1)},${PAD.t+cH} Z`;

    const dots = weeks.map((w,i) =>
      `<circle class="wdot-${bi}-${i}" cx="${xPos(i)}" cy="${yPos(w.qty)}" r="3.5" fill="${color}" stroke="#fff" stroke-width="1.5" style="cursor:pointer"/>`
    ).join('');

    // 최고점 레이블
    const peakIdx = weeks.reduce((mx,w,i) => w.qty > weeks[mx].qty ? i : mx, 0);
    const peakLabel = `<text x="${xPos(peakIdx)}" y="${yPos(weeks[peakIdx].qty)-10}" fill="${color}" font-size="11" font-weight="700" text-anchor="middle">${weeks[peakIdx].qty.toLocaleString()}</text>`;

    const svgId = 'wchart-'+bi;
    const ttId  = 'wtt-'+bi;

    return `
    <div style="margin-bottom:24px;padding:20px;border:1px solid var(--ink5);border-radius:var(--r)">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
        <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${color}"></span>
        <span style="font-size:13px;font-weight:700;color:var(--ink1)">${esc(b.title)}</span>
        <span style="font-size:12px;color:var(--ink3);margin-left:4px">출간 ${b.pubDate} · ${n}주차 데이터</span>
        <span style="margin-left:auto;font-size:12px;color:var(--ink3)">누적 ${weeks.reduce((s,w)=>s+w.qty,0).toLocaleString()}부</span>
      </div>
      <div style="position:relative">
        <svg id="${svgId}" width="100%" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block;overflow:visible">
          <defs>
            <linearGradient id="wg${bi}" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="${color}" stop-opacity=".15"/>
              <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
            </linearGradient>
          </defs>
          ${grid}${xLabels}
          <path d="M${xPos(0)},${PAD.t+cH} L${pts} L${xPos(n-1)},${PAD.t+cH} Z" fill="url(#wg${bi})"/>
          <path d="M${pts}" fill="none" stroke="${color}" stroke-width="2"/>
          ${peakLabel}
          ${dots}
          <line id="whl-${bi}" x1="0" x2="0" y1="${PAD.t}" y2="${PAD.t+cH}" stroke="${color}" stroke-width="1" stroke-dasharray="3,3" opacity="0"/>
        </svg>
        <div id="${ttId}" style="display:none;position:absolute;top:10px;background:#1B2430;color:#fff;font-size:12px;padding:6px 10px;border-radius:var(--r2);pointer-events:none;white-space:nowrap"></div>
      </div>
    </div>`;
  }).join('');
}

function initWeeklyChartHover() {
  const strategic = BOOKS.filter(b => b.isStrategic && WEEK_SALES[b.title]);
  strategic.forEach((b, bi) => {
    const weeks = (WEEK_SALES[b.title]||[]).sort((a,c)=>a.week.localeCompare(c.week));
    const n = weeks.length;
    const W=1400, PAD_L=56, PAD_R=20, cW=W-PAD_L-PAD_R;
    const svg = document.getElementById('wchart-'+bi);
    const tt  = document.getElementById('wtt-'+bi);
    const hl  = document.getElementById('whl-'+bi);
    if(!svg||!tt||!hl||!n) return;
    svg.addEventListener('mousemove', function(e){
      const r = svg.getBoundingClientRect();
      const mx = (e.clientX-r.left)*(W/r.width)-PAD_L;
      const idx = Math.min(n-1, Math.max(0, Math.round(mx / (n>1 ? cW/(n-1) : 1))));
      const xp = PAD_L + (n>1 ? idx/(n-1)*cW : cW/2);
      hl.setAttribute('x1',xp); hl.setAttribute('x2',xp); hl.style.opacity='1';
      tt.style.display='block';
      tt.style.left=(xp*(r.width/W)+10)+'px';
      tt.textContent=weeks[idx].week+' | '+weeks[idx].qty.toLocaleString()+'부';
    });
    svg.addEventListener('mouseleave', function(){
      hl.style.opacity='0'; tt.style.display='none';
    });
  });
}

/* ─────────────────────────────────────
   4. 비용 실적
───────────────────────────────────── */
function renderCost(){
  const m=getM();
  const ym=document.getElementById('monthPicker').value.slice(0,7);
  const mMkt=M_MKT_COST[m]||0, mPub=M_PUB_COST[m]||0, mCom=M_COM_COST[m]||0;
  const cs=costSplit(m);
  const mNet=M_NET_SALES[m]||0;
  const cumTotal=MONTHS.slice(0,m+1).reduce((a,_,i)=>a+costSplit(i).total,0);
  const cumNet  =M_NET_SALES.slice(0,m+1).reduce((a,b)=>a+b,0);
  const cumPlan =M_TOTAL_PLAN.slice(0,m+1).reduce((a,b)=>a+b,0);

  // 비용률 = 총비용 / 순매출. 절대 금액은 매출 따라 커지므로 효율은 이 비율로 본다.
  // 총비용은 반드시 costSplit 을 거친다. 시트 수식이 계획을 포함하면
  // M_TOTAL_COST 에 이미 들어 있어서 그냥 더하면 이중 계상된다.
  const costOf = i => costSplit(i).total;
  const rate = i => (M_NET_SALES[i]>0) ? costOf(i)/M_NET_SALES[i]*100 : null;
  const curRate=rate(m), prvRate=m>0?rate(m-1):null;
  const profit = mNet - cs.total;

  /* ── 비용률 추이 : 순매출 막대 + 비용률 라인 (이중 축) ── */
  function rateChart(){
    const idx=MONTHS.map((_,i)=>i).filter(i=>M_NET_SALES[i]>0||M_TOTAL_COST[i]>0);
    if(idx.length<2) return `<div class="empty-row">표시할 월이 없습니다</div>`;
    const W=1000,H=230,P={t:18,r:52,b:30,l:56};
    const cW=W-P.l-P.r, cH=H-P.t-P.b;
    const maxAmt=Math.max(...idx.map(i=>Math.max(M_NET_SALES[i], costOf(i))),1);
    const rates=idx.map(rate).filter(v=>v!=null);
    const maxR=Math.max(...rates,10)*1.25;
    const bw=Math.min(46, cW/idx.length*0.5);
    const xc=k=>P.l+(k+0.5)*(cW/idx.length);
    const yA=v=>P.t+cH-(v/maxAmt)*cH;
    const yR=v=>P.t+cH-(v/maxR)*cH;

    const grid=[0,.25,.5,.75,1].map(f=>{
      const y=P.t+cH-f*cH;
      return `<line x1="${P.l}" x2="${P.l+cW}" y1="${y}" y2="${y}" stroke="#0F162010"/>`
        +`<text x="${P.l-8}" y="${y+4}" fill="#96A1AE" font-size="10" text-anchor="end">${fmtAmt(maxAmt*f)}</text>`
        +`<text x="${P.l+cW+8}" y="${y+4}" fill="#96A1AE" font-size="10">${Math.round(maxR*f)}%</text>`;
    }).join('');

    const bars=idx.map((i,k)=>{
      const net=M_NET_SALES[i]||0, cost=costOf(i);
      const isCur=i===m;
      return `<rect x="${xc(k)-bw/2}" y="${yA(net)}" width="${bw}" height="${Math.max(0,cH-(yA(net)-P.t))}" rx="2"
                fill="${isCur?'#DCE3FD':'#EDF0F4'}"/>`
           + `<rect x="${xc(k)-bw/2}" y="${yA(cost)}" width="${bw}" height="${Math.max(0,cH-(yA(cost)-P.t))}" rx="2"
                fill="${isCur?'#3A5BD9':'#B7C0CA'}"/>`;
    }).join('');

    // 기준선: 누적 비용률 (총비용 합계 ÷ 순매출 합계)
    const sumC=idx.reduce((a,i)=>a+costOf(i),0), sumN=idx.reduce((a,i)=>a+(M_NET_SALES[i]||0),0);
    const avgR=sumN>0 ? sumC/sumN*100 : null;
    const avgLine = (avgR==null || avgR>maxR) ? '' :
      `<line x1="${P.l}" x2="${P.l+cW}" y1="${yR(avgR)}" y2="${yR(avgR)}" stroke="#8AA0EE" stroke-width="1.5" stroke-dasharray="5,4"/>`
      + `<rect x="${P.l+cW-96}" y="${yR(avgR)-17}" width="92" height="15" rx="3" fill="#EEF1FE"/>`
      + `<text x="${P.l+cW-50}" y="${yR(avgR)-6}" fill="#2A44A8" font-size="9.5" font-weight="700" text-anchor="middle">누적 평균 ${avgR.toFixed(1)}%</text>`;

    const pts=idx.map((i,k)=>rate(i)==null?null:`${xc(k)},${yR(rate(i))}`).filter(Boolean).join('L');
    const dots=idx.map((i,k)=>rate(i)==null?'':
      `<circle cx="${xc(k)}" cy="${yR(rate(i))}" r="${i===m?4:2.8}" fill="#FFF" stroke="#0F1620" stroke-width="${i===m?2.4:1.6}"/>`).join('');
    const labels=idx.map((i,k)=>
      `<text x="${xc(k)}" y="${P.t+cH+18}" fill="${i===m?'#0F1620':'#96A1AE'}" font-size="10"
         font-weight="${i===m?800:400}" text-anchor="middle">${MONTHS[i]}</text>`).join('');
    const rateTags=idx.map((i,k)=>rate(i)==null?'':
      `<text x="${xc(k)}" y="${yR(rate(i))-10}" fill="${i===m?'#0F1620':'#77808D'}" font-size="10"
         font-weight="${i===m?800:600}" text-anchor="middle">${Math.round(rate(i))}%</text>`).join('');

    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:230px;display:block">
      ${grid}${bars}${avgLine}
      <path d="M${pts}" fill="none" stroke="#0F1620" stroke-width="2" stroke-linejoin="round"/>
      ${dots}${rateTags}${labels}</svg>`;
  }

  /* ── 대구분 구성 : 가로 막대 (지출/예정 스택) ── */
  function catBars(team){
    const src=COST_BY_CAT[team]||{};
    const rows=Object.keys(src).map(k=>({name:k, paid:src[k].fixed, plan:src[k].plan, total:src[k].fixed+src[k].plan}))
      .filter(r=>r.total>0).sort((x,y)=>y.total-x.total);
    if(!rows.length) return `<div class="empty-row">해당 기간 귀속된 비용이 없습니다</div>`;
    const mx=rows[0].total||1, sum=rows.reduce((a,r)=>a+r.total,0)||1;
    return rows.map((r,i)=>{
      const wPaid=r.paid/mx*100, wPlan=r.plan/mx*100;
      return `<div style="display:flex;align-items:center;gap:12px;padding:7px 0${i?';border-top:1px solid var(--border)':''}">
        <div style="width:74px;flex-shrink:0;font-size:12px;font-weight:700;color:var(--ink)">${esc(r.name.replace(/^\d+\./,''))}</div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;height:14px;border-radius:var(--r5);overflow:hidden;background:var(--surface3)">
            <div class="bar-grow" style="--w:${wPaid}%;--d:${i*50}ms;background:var(--accent)"></div>
            <div class="bar-grow" style="--w:${wPlan}%;--d:${i*50}ms;background:repeating-linear-gradient(45deg,#8AA0EE,#8AA0EE 4px,#C6D2F7 4px,#C6D2F7 8px)"></div>
          </div>
        </div>
        <div style="width:82px;text-align:right;font-size:12px;font-weight:800;color:var(--ink);flex-shrink:0">${won(r.total)}</div>
        <div style="width:34px;text-align:right;font-size:11px;color:var(--ink3);flex-shrink:0">${Math.round(r.total/sum*100)}%</div>
      </div>`;
    }).join('');
  }

  /* ── 지급 스케줄 : 지급월별 나가는 돈 ── */
  function paySchedule(){
    const keys=Object.keys(COST_BY_PAY).filter(k=>k>=ym.slice(0,4)+'-01').sort();
    if(!keys.length) return `<div class="empty-row">지급월이 입력된 건이 없습니다</div>`;
    const mx=Math.max(...keys.map(k=>COST_BY_PAY[k].fixed+COST_BY_PAY[k].plan),1);
    return `<div style="display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:8px">
      ${keys.map(k=>{
        const d=COST_BY_PAY[k], tot=d.fixed+d.plan;
        const h=Math.max(3, tot/mx*112);
        const isCur=k===ym, future=k>ym;
        return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0">
          <div style="font-size:10px;font-weight:${isCur?800:600};color:${isCur?'var(--ink)':'var(--ink3)'};white-space:nowrap">${won(tot)}</div>
          <div class="bar-grow" style="--w:100%;height:${h}px;width:100%;border-radius:var(--r4) var(--r4) 0 0;
            background:${future?'repeating-linear-gradient(45deg,#8AA0EE,#8AA0EE 4px,#C6D2F7 4px,#C6D2F7 8px)':(isCur?'var(--accent)':'var(--border2)')}"></div>
          <div style="font-size:10px;font-weight:${isCur?800:400};color:${isCur?'var(--ink)':'var(--ink3)'}">${k.slice(5)}월</div>
        </div>`;
      }).join('')}
    </div>`;
  }

  const rateDelta = (curRate!=null && prvRate!=null) ? (curRate-prvRate) : null;

  document.getElementById('tab-cost').innerHTML=`
    <div class="g4 gap">
      <div class="kpi"><div class="kpi-lbl">당월 비용</div>
        <div class="kpi-val">${won(cs.total)}</div>${cmpTag(MONTHS.map((_,i)=>costSplit(i).total),m,true)}
        <div class="kpi-sub">${cs.plan>0?`지출 ${won(cs.fixed)} · <span style="color:var(--warn)">예정 ${won(cs.plan)}</span>`:'전액 지출 완료'}</div>
        ${spark(M_TOTAL_COST,m,{color:'var(--ink3)'})}</div>
      <div class="kpi"><div class="kpi-lbl">비용률${help('비용률')}</div>
        <div class="kpi-val">${curRate!=null?curRate.toFixed(1):'—'}<span style="font-size:19px;font-weight:700">%</span></div>
        <div class="kpi-sub">${rateDelta!=null
          ? `전월 ${prvRate.toFixed(1)}% <span style="color:${rateDelta<=0?'var(--good)':'var(--bad)'};font-weight:700">${rateDelta<=0?'▼':'▲'} ${Math.abs(rateDelta).toFixed(1)}p</span>`
          : '순매출 대비 총비용'}</div>
        ${spark(MONTHS.map((_,i)=>rate(i)||0),m,{color:'var(--ink3)'})}</div>
      <div class="kpi"><div class="kpi-lbl">당월 순손익</div>
        <div class="kpi-val ${profit>=0?'good':'bad'}">${profit>=0?'+':''}${won(profit)}</div>
        <div class="kpi-sub">순매출 ${won(mNet)} − 비용 ${won(cs.total)}</div>
        ${spark(M_PROFIT,m)}</div>
      <div class="kpi"><div class="kpi-lbl">미지급 잔액</div>
        <div class="kpi-val">${won(cumPlan)}</div>
        <div class="kpi-sub">${cumPlan>0?'계획 상태로 남은 금액':'전액 지출 완료'}</div>
        ${spark(M_TOTAL_PLAN,m,{color:'var(--warn)'})}</div>
    </div>

    <div class="card gap">
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:4px">
        <div class="card-title" style="margin:0">비용률 추이 <small>막대 = 순매출 · 진한 막대 = 총비용 · 검은 선 = 월 비용률 · 점선 = 누적 평균</small></div>${pngBtn('비용률추이')}
        <div style="font-size:11px;color:var(--ink3)">연 누적 순매출 ${won(cumNet)} · 총비용 ${won(cumTotal)} · 비용률 ${cumNet>0?(cumTotal/cumNet*100).toFixed(1):'—'}%</div>
      </div>
      ${rateChart()}
    </div>

    <div class="g2 gap">
      <div class="card">
        <div class="card-title">비용 구성 추이 <small>팀별</small></div>
        ${stackedBarChart(costRowsFor(m), [
          {label:"마케팅팀",color:"#3A5BD9"},{label:"출판팀",color:"#37424F"},{label:"경상비",color:"#96A1AE"}])}
      </div>
      <div class="card">
        <div class="card-title">지급 스케줄 <small>빗금 = 아직 안 나간 금액</small></div>
        ${paySchedule()}
      </div>
    </div>

    <div class="gap2" style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap">
      <div class="sec-label" style="margin:0">항목별 비용 구성 <small style="font-weight:500;color:var(--ink3)">기준월까지 귀속 기준 누적 · 실선 = 지출, 빗금 = 예정</small></div>
      <button onclick="exportCost()" style="border:1px solid var(--border2);background:var(--surface);color:var(--ink2);
        border-radius:var(--r3);padding:6px 11px;font-family:var(--sans);font-size:11px;font-weight:700;cursor:pointer">CSV</button>
    </div>
    <div class="g2">
      <div class="card"><div class="card-title">마케팅팀</div>${catBars('마케팅')}</div>
      <div class="card"><div class="card-title">출판팀</div>${catBars('출판')}</div>
    </div>

    ${(COST_NOBOOK.미상 + COST_NOBOOK.기타) > 0 ? `
    <div class="card gap2" style="border-left:3px solid var(--border2)">
      <div class="card-title">도서에 배분되지 않은 비용 <small>도서별 손익·ROAS 집계에서 제외됩니다</small></div>
      <table>
        <tr><th style="width:110px">구분</th><th class="right" style="width:140px">금액</th><th>설명</th></tr>
        ${COST_NOBOOK.미상 > 0 ? `<tr><td><b style="font-size:12px">미상</b></td><td class="right"><b>${won(COST_NOBOOK.미상)}</b></td><td style="font-size:12px;color:var(--ink2)">도서별 기록이 없어 소급 배분이 불가한 비용</td></tr>` : ''}
        ${COST_NOBOOK.기타 > 0 ? `<tr><td><b style="font-size:12px">기타</b></td><td class="right"><b>${won(COST_NOBOOK.기타)}</b></td><td style="font-size:12px;color:var(--ink2)">본부 브랜딩·채널 운영 등 특정 도서에 귀속되지 않는 비용</td></tr>` : ''}
      </table>
    </div>` : ''}`;
}

// 월별 비용 구성 추이용 행
function costRowsFor(m){
  return MONTHS.slice(0,m+1).map((_,i)=>({label:MONTHS[i], vals:[M_MKT_COST[i],M_PUB_COST[i],M_COM_COST[i]]}));
}

/* ─────────────────────────────────────
   5. 채널 실적
───────────────────────────────────── */
function renderChannel(){
  const el = document.getElementById('tab-channel');
  const pickM = getM();
  const ym = document.getElementById('monthPicker').value.slice(0,7);

  // 채널 시트는 월 마감 후 채워지므로 기준월이 비어 있을 수 있다.
  // 그 경우 데이터가 있는 가장 최근 달로 대체하고 그 사실을 표시한다.
  const hasData = i => CH_PERF.some(c => ((c.items['팔로워']||[])[i]||0) > 0 || ((c.items['도달']||[])[i]||0) > 0);
  let m = pickM;
  while (m > 0 && !hasData(m)) m--;
  const stale = m !== pickM && hasData(m);

  if(!CH_PERF.length && !CH_CONTENT.length){
    el.innerHTML = `
<div class="card gap"><div class="card-title">채널</div>
      <div class="empty-row">채널 관리 시트를 불러오지 못했습니다. 공유 설정과 GID를 확인해 주세요.</div></div>`;
    return;
  }

  const iv = (a,i) => (a && a[i]) || 0;
  const rows = CH_PERF.map(c => ({
    kind:c.kind, acct:c.acct,
    fol:iv(c.items['팔로워'],m), diff:iv(c.items['증감'],m),
    reach:iv(c.items['도달'],m)||iv(c.items['도달(조회수)'],m),
    up:iv(c.items['업로드'],m), avg:iv(c.items['도달 평균'],m),
    share:iv(c.items['공유'],m), save:iv(c.items['저장'],m),
    rev:iv(c.items['수익(보너스)'],m)+iv(c.items['수익(광고)'],m),
    prevReach:(c.prev && (c.prev['도달'] || c.prev['도달(조회수)'])) || 0,
    ytdReach:((c.items['도달']||[]).slice(0,m+1).reduce((a,b)=>a+b,0))
            +((c.items['도달(조회수)']||[]).slice(0,m+1).reduce((a,b)=>a+b,0)),
    series:(c.items['팔로워']||[]).slice(0,m+1),
  })).filter(r => r.fol || r.reach || r.up);

  const sum = k => rows.reduce((a,r)=>a+(r[k]||0),0);
  const totFol=sum('fol'), totDiff=sum('diff'), totReach=sum('reach'), totUp=sum('up'), totRev=sum('rev');
  const kindColor = k => laneColor('ch-'+k).bg;
  const kinds = [...new Set(rows.map(r=>r.kind))];

  const contAll = CH_CONTENT.slice();
  const cont = contAll.filter(c => c.up && ymd(c.up).slice(0,7)===ym);

  /* ── 채널 포트폴리오 : 팔로워(가로) × 도달 평균(세로) × 업로드(크기) ── */
  /* 업로드 캘린더 — 계정 x 날짜 히트맵. 어느 채널이 언제 비는지 한눈에 본다. */
  function uploadCal(){
    const ups = CH_UPLOAD.filter(u => u.date && ymd(u.date).slice(0,7) === ym);
    if (!ups.length) return '<div class="empty-row">해당 월 업로드 일정이 없습니다</div>';
    const y = +ym.slice(0,4), mo = +ym.slice(5,7);
    const days = new Date(y, mo, 0).getDate();
    const accts = [...new Set(ups.map(u => u.acct))];
    const cell = {};                      // acct|day -> [{fmt,title,book}]
    ups.forEach(u => {
      const k = u.acct + '|' + u.date.getDate();
      (cell[k] = cell[k] || []).push(u);
    });
    const mx = Math.max(...Object.values(cell).map(v => v.length), 1);
    const totalBy = a => ups.filter(u => u.acct === a).length;
    const ordered = accts.sort((a,b) => totalBy(b) - totalBy(a));
    const dow = ['일','월','화','수','목','금','토'];
    return `<div style="overflow-x:auto">
      <table style="min-width:100%;border-collapse:separate;border-spacing:0">
        <tr><th style="width:132px;position:sticky;left:0;background:var(--surface);z-index:1">채널</th>
          ${Array.from({length:days},(_,i)=>{
            const d = new Date(y, mo-1, i+1), w = d.getDay();
            return `<th style="width:22px;padding:4px 0;text-align:center;font-size:9px;
              color:${w===0?'var(--bad)':(w===6?'var(--accent-deep)':'var(--ink3)')}">${i+1}
              <div style="font-size:8px;opacity:.7">${dow[w]}</div></th>`;
          }).join('')}
          <th style="width:44px;text-align:right">합계</th></tr>
        ${ordered.map(a=>`<tr>
          <td style="position:sticky;left:0;background:var(--surface);z-index:1;font-size:11px;
              font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:132px">${esc(a)}</td>
          ${Array.from({length:days},(_,i)=>{
            const list = cell[a+'|'+(i+1)] || [];
            const t = list.length / mx;
            const tip = list.map(u=>`${u.fmt} · ${u.book?'('+u.book+') ':''}${u.title}`).join('\n');
            const link = (list.find(u=>u.url)||{}).url || '';
            const inner = `<div style="height:21px;margin:1px;border-radius:2px;display:flex;align-items:center;justify-content:center;
                background:${list.length?`rgba(58,91,217,${(0.18+t*0.72).toFixed(2)})`:'var(--surface3)'};
                color:${t>0.5?'#FFF':'var(--ink2)'};font-size:9px;font-weight:800">${list.length||''}</div>`;
            return `<td title="${esc(tip)}" style="padding:0;text-align:center">${link
              ? `<a href="${esc(link)}" target="_blank" rel="noopener" style="display:block;text-decoration:none">${inner}</a>`
              : inner}</td>`;
          }).join('')}
          <td style="text-align:right;font-size:11px;font-weight:800">${totalBy(a)}</td></tr>`).join('')}
      </table></div>
      <div style="font-size:11px;color:var(--ink3);margin-top:10px;line-height:1.6">
        칸에 마우스를 올리면 그날 올린 콘텐츠 제목이 보입니다. 빈 칸이 이어지면 해당 채널이 쉬고 있다는 뜻입니다.${CH_UPLOAD.some(u=>u.url) ? ' 링크가 연결된 칸은 클릭하면 게시물로 이동합니다.' : ''}</div>`;
  }

  /* 채널 효율 — 산점도는 대부분이 한 구석에 뭉쳐 라벨이 겹친다.
     채널명을 세로로 세우면 겹칠 일이 없고 순위도 바로 읽힌다. */
  function effBars(){
    const list = rows.filter(r=>r.fol>0 && r.avg>0)
      .map(r=>({...r, rate: r.avg/r.fol}))
      .sort((a,b)=>b.rate-a.rate);
    if(!list.length) return '<div class="empty-row">표시할 채널이 없습니다</div>';
    const mxRate = list[0].rate;
    const mxFol  = Math.max(...list.map(r=>r.fol));
    const med = (()=>{ const v=list.map(r=>r.rate).sort((a,b)=>a-b); return v[Math.floor(v.length/2)]; })();
    return `<div>
      <div style="display:flex;align-items:center;gap:10px;padding:0 0 7px;font-size:10px;
           font-weight:700;letter-spacing:.06em;color:var(--ink3);text-transform:uppercase;border-bottom:1px solid var(--border)">
        <span style="width:132px">채널</span>
        <span style="flex:1">도달률${help('도달률')} · 팔로워 대비 1건 평균 도달</span>
        <span style="width:70px;text-align:right">도달 평균</span>
        <span style="width:66px;text-align:right">팔로워</span>
        <span style="width:44px;text-align:right">업로드</span>
      </div>
      ${list.map((r,i)=>{
        const w = Math.max(1.5, r.rate/mxRate*100);
        const good = r.rate >= med;
        return `<div style="display:flex;align-items:center;gap:10px;padding:7px 0${i?';border-top:1px solid var(--border)':''}">
          <div style="width:132px;display:flex;align-items:center;gap:7px;min-width:0">
            <span style="width:8px;height:8px;border-radius:2px;background:${kindColor(r.kind)};flex-shrink:0"></span>
            <span style="font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.acct)}</span>
          </div>
          <div style="flex:1;min-width:0;display:flex;align-items:center;gap:9px">
            <div style="flex:1;height:13px;background:var(--surface3);border-radius:var(--r5);overflow:hidden">
              <div class="bar-grow" style="--w:${w}%;--d:${i*35}ms;height:13px;
                background:${good?'var(--accent)':'var(--border2)'}"></div>
            </div>
            <span style="width:58px;text-align:right;font-size:12px;font-weight:800;
              color:${good?'var(--accent-deep)':'var(--ink3)'}">${r.rate>=10?Math.round(r.rate*100).toLocaleString():(r.rate*100).toFixed(0)}%</span>
          </div>
          <div style="width:70px;text-align:right;font-size:12px;font-weight:700;color:var(--ink)">${fmtAmt(Math.round(r.avg))}</div>
          <div style="width:66px;text-align:right;font-size:11px;color:var(--ink2)">${fmtAmt(r.fol)}</div>
          <div style="width:44px;text-align:right;font-size:11px;color:var(--ink3)">${r.up||'—'}</div>
        </div>`;
      }).join('')}
      <div style="font-size:11px;color:var(--ink3);margin-top:12px;line-height:1.6">
        도달률 = 콘텐츠 1건 평균 도달 ÷ 팔로워. 100%를 넘으면 팔로워 밖으로 퍼졌다는 뜻입니다.
        진한 막대는 중앙값(${Math.round(med*100)}%) 이상.</div>
    </div>`;
  }

  /* ── 주차별 팔로워 : 첫 주 대비 증감률 멀티라인 ── */
  /* 주차별 팔로워 — 15개 라인을 겹치면 라벨이 뒤엉킨다.
     채널을 세로로 세우고 각자 스파크라인 + 증감을 나란히 둔다. */
  function weeklyChart(){
    const rows = CH_WEEKLY.filter(w => w.points.length >= 2).map(w => {
      const p = w.points, first = p[0].v, last = p[p.length-1].v;
      return {...w, first, last, diff: last - first, rate: first ? (last/first - 1) * 100 : 0};
    }).sort((a,b) => b.rate - a.rate);
    if (!rows.length) return '<div class="empty-row">주차 데이터가 없습니다</div>';
    const dates = rows[0].points.map(p => p.date);
    const mxAbs = Math.max(...rows.map(r => Math.abs(r.rate)), 1);

    const spark = w => {
      const vs = w.points.map(p => p.v);
      const mn = Math.min(...vs), mx = Math.max(...vs), rg = (mx - mn) || 1;
      const W = 108, H = 26;
      const pts = vs.map((v,i) => `${(i/(vs.length-1)*W).toFixed(1)},${(H-3-((v-mn)/rg)*(H-6)).toFixed(1)}`).join('L');
      const up = w.diff >= 0;
      return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="display:block;overflow:visible">
        <path d="M${pts}" fill="none" stroke="${up?'#0E6E52':'#B3243C'}" stroke-width="1.8"
              stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx="${W}" cy="${(H-3-((vs[vs.length-1]-mn)/rg)*(H-6)).toFixed(1)}" r="2.6"
                fill="#FFF" stroke="${up?'#0E6E52':'#B3243C'}" stroke-width="1.8"/>
      </svg>`;
    };

    return `<div>
      <div style="display:flex;align-items:center;gap:10px;padding-bottom:7px;border-bottom:1px solid var(--border);
           font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)">
        <span style="width:132px">채널</span>
        <span style="width:112px">추이</span>
        <span style="flex:1">첫 주 대비 증감률</span>
        <span style="width:76px;text-align:right">현재</span>
        <span style="width:66px;text-align:right">순증</span>
      </div>
      ${rows.map((w,i)=>{
        const pos = w.rate >= 0;
        const bw = Math.abs(w.rate) / mxAbs * 50;
        return `<div style="display:flex;align-items:center;gap:10px;padding:6px 0${i?';border-top:1px solid var(--border)':''}">
          <div style="width:132px;display:flex;align-items:center;gap:7px;min-width:0">
            <span style="width:8px;height:8px;border-radius:2px;background:${kindColor(w.kind)};flex-shrink:0"></span>
            <span style="font-size:11.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(w.acct)}</span>
          </div>
          <div style="width:112px;flex-shrink:0">${spark(w)}</div>
          <div style="flex:1;min-width:0;display:flex;align-items:center;gap:8px">
            <div style="flex:1;height:11px;position:relative;background:var(--surface3);border-radius:var(--r5)">
              <div style="position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--border2)"></div>
              <div class="bar-grow" style="--w:${bw}%;--d:${i*35}ms;position:absolute;top:0;height:11px;
                ${pos?`left:50%;border-radius:0 var(--r5) var(--r5) 0;background:var(--good)`
                     :`right:50%;border-radius:var(--r5) 0 0 var(--r5);background:var(--bad)`}"></div>
            </div>
            <b style="width:56px;text-align:right;font-size:12px;color:${pos?'var(--good)':'var(--bad)'}">${pos?'+':''}${w.rate.toFixed(1)}%</b>
          </div>
          <div style="width:76px;text-align:right;font-size:12px;font-weight:700;color:var(--ink)">${w.last.toLocaleString()}</div>
          <div style="width:66px;text-align:right;font-size:11px;color:${pos?'var(--good)':'var(--bad)'}">${pos?'+':''}${w.diff.toLocaleString()}</div>
        </div>`;
      }).join('')}
      <div style="font-size:11px;color:var(--ink3);margin-top:11px;line-height:1.6">
        ${ymd(dates[0]).slice(5).replace('-','/')} ~ ${ymd(dates[dates.length-1]).slice(5).replace('-','/')} · ${dates.length}주
        · 규모가 달라도 비교되도록 첫 주 대비 % 로 환산했습니다.</div>
    </div>`;
  }

  /* ── 도서 × 채널 히트맵 ── */
  function heat(){
    const cross={}, bTot={}, cTot={};
    contAll.forEach(c=>{
      if(!c.book || !c.ch || c.ch==='-') return;
      const k=c.book+'|'+c.ch;
      cross[k]=(cross[k]||0)+c.reach;
      bTot[c.book]=(bTot[c.book]||0)+c.reach;
      cTot[c.ch]=(cTot[c.ch]||0)+c.reach;
    });
    const bs=Object.keys(bTot).sort((a,b)=>bTot[b]-bTot[a]);
    const cs=Object.keys(cTot).sort((a,b)=>cTot[b]-cTot[a]).slice(0,10);
    if(!bs.length) return '';
    const mx=Math.max(...Object.values(cross));
    return `<div style="overflow-x:auto"><table style="min-width:100%">
      <tr><th style="width:78px"></th>${cs.map(c=>`<th style="font-size:10px;font-weight:700;text-align:center;padding:6px 3px;white-space:nowrap">${esc(c.replace(/^\((IN|YT|TT|TH)\)/,''))}</th>`).join('')}
        <th class="right" style="width:78px">합계</th></tr>
      ${bs.map(b=>`<tr>
        <td><b style="font-size:12px">${esc(b)}</b></td>
        ${cs.map(c=>{
          const v=cross[b+'|'+c]||0, t=v/mx;
          return `<td style="padding:3px" title="${esc(b)} × ${esc(c)} · ${v.toLocaleString()}">
            <div style="height:30px;border-radius:var(--r4);display:flex;align-items:center;justify-content:center;
              background:${v?`rgba(58,91,217,${(0.10+t*0.82).toFixed(3)})`:'var(--surface3)'};
              color:${t>0.45?'#FFF':'var(--ink2)'};font-size:10px;font-weight:700">${v?fmtAmt(v):''}</div></td>`;
        }).join('')}
        <td class="right"><b>${fmtAmt(bTot[b])}</b></td></tr>`).join('')}
    </table></div>`;
  }

  /* ── 도달 집중도 : 상위 N건이 전체의 몇 % ── */
  function concentration(){
    const rs=contAll.map(c=>c.reach).filter(v=>v>0).sort((a,b)=>b-a);
    if(rs.length<5) return '';
    const tot=rs.reduce((a,b)=>a+b,0);
    const W=1000,H=190,P={t:16,r:20,b:34,l:52};
    const cW=W-P.l-P.r, cH=H-P.t-P.b;
    let acc=0; const pts=rs.map((v,i)=>{acc+=v; return {x:(i+1)/rs.length, y:acc/tot};});
    const px=k=>P.l+k*cW, py=v=>P.t+cH-v*cH;
    const path='M'+P.l+','+(P.t+cH)+'L'+pts.map(p=>px(p.x)+','+py(p.y)).join('L');
    const marks=[5,10,20,50].filter(k=>k<=rs.length).map(k=>{
      const share=rs.slice(0,k).reduce((a,b)=>a+b,0)/tot;
      return {k, share, x:px(k/rs.length), y:py(share)};
    });
    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:190px;display:block">
      ${[0,.25,.5,.75,1].map(f=>`<line x1="${P.l}" x2="${P.l+cW}" y1="${py(f)}" y2="${py(f)}" stroke="#0F16200D"/>
        <text x="${P.l-8}" y="${py(f)+4}" fill="#96A1AE" font-size="10" text-anchor="end" font-family="inherit">${Math.round(f*100)}%</text>`).join('')}
      <path d="${path}L${px(1)},${P.t+cH}Z" fill="#3A5BD9" fill-opacity=".10"/>
      <path d="${path}" data-draw fill="none" stroke="#3A5BD9" stroke-width="2.4" stroke-linejoin="round"/>
      ${marks.map(mk=>`<circle cx="${mk.x}" cy="${mk.y}" r="4" fill="#FFF" stroke="#2A44A8" stroke-width="2.2"/>
        <text x="${mk.x}" y="${mk.y-11}" fill="var(--ink)" font-size="10" font-weight="800" text-anchor="middle" font-family="inherit">${Math.round(mk.share*100)}%</text>
        <text x="${mk.x}" y="${P.t+cH+18}" fill="#96A1AE" font-size="10" text-anchor="middle" font-family="inherit">상위 ${mk.k}건</text>`).join('')}
      <text x="${px(1)}" y="${P.t+cH+18}" fill="#96A1AE" font-size="10" text-anchor="end" font-family="inherit">전체 ${rs.length}건</text>
    </svg>`;
  }

  el.innerHTML = `
    ${stale ? `<div class="card gap" style="border-left:3px solid var(--warn);background:var(--warn-dim)">
      <div style="font-size:12px;color:var(--ink2);line-height:1.6">
        <b>${MONTHS[pickM]} 채널 데이터가 아직 없습니다.</b> 아래 수치는 <b>${MONTHS[m]}</b> 기준입니다.
        채널 관리 시트의 <b>채널실적(2026)</b> 탭에 ${MONTHS[pickM]} 열을 채우면 자동으로 반영됩니다.</div></div>` : ''}

    <div class="g4 gap">
      <div class="kpi"><div class="kpi-lbl">총 팔로워</div>
        <div class="kpi-val" data-count="${totFol}" data-fmt="int">0</div>
        <div class="kpi-sub">${rows.length}개 채널 · ${kinds.join(' · ')}</div></div>
      <div class="kpi"><div class="kpi-lbl">당월 순증</div>
        <div class="kpi-val ${totDiff>=0?'good':'bad'}">${totDiff>=0?'+':''}${totDiff.toLocaleString()}</div>
        <div class="kpi-sub">${MONTHS[m]} 팔로워 증감</div></div>
      <div class="kpi"><div class="kpi-lbl">당월 도달</div>
        <div class="kpi-val" data-count="${totReach}" data-fmt="int">0</div>
        <div class="kpi-sub">업로드 ${totUp.toLocaleString()}건</div></div>
      <div class="kpi"><div class="kpi-lbl">당월 채널 수익</div>
        <div class="kpi-val">${won(totRev)}</div>
        <div class="kpi-sub">보너스 + 광고</div></div>
    </div>

    <div class="card gap">
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px">
        <div class="card-title" style="margin:0">채널 효율
          <small>팔로워 대비 얼마나 멀리 퍼지는지 · 도달률 순</small></div>
        <div style="display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--ink3)">
          ${kinds.map(k=>`<span style="display:inline-flex;align-items:center;gap:5px">
            <span style="width:9px;height:9px;border-radius:50%;background:${kindColor(k)}"></span>${esc(k)}</span>`).join('')}
        </div>
      </div>
      ${effBars()}
    </div>

    ${CH_WEEKLY.length ? `
    <div class="card gap">
      <div class="card-title">주차별 팔로워 <small>첫 주 대비 증감률 · 규모가 달라도 비교되도록 % 로 환산</small></div>
      ${weeklyChart()}
    </div>` : ''}

    ${contAll.length ? `
    <div class="g2 gap">
      <div class="card">
        <div class="card-title">도서 × 채널 도달 <small>어느 도서가 어느 채널에서 통하는지</small></div>
        ${heat()}
      </div>
      <div class="card">
        <div class="card-title">도달 집중도 <small>소수 콘텐츠에 얼마나 쏠려 있는지</small></div>
        ${concentration()}
        <div style="font-size:11px;color:var(--ink2);line-height:1.6;margin-top:10px">

const CH_MONTH_OPEN = {};
function toggleContMonth(k){
  // 기본값(기준월=펼침, 나머지=접힘)을 고려해서 뒤집는다.
  // 단순히 !CH_MONTH_OPEN[k] 로 하면 기준월은 undefined→true 라 안 접힌다.
  const ymNow = (document.getElementById('monthPicker').value||'').slice(0,7);
  const cur = (k in CH_MONTH_OPEN) ? CH_MONTH_OPEN[k] : (k === ymNow);
  CH_MONTH_OPEN[k] = !cur;
  renderChannel();
}

/* ── 표 공통 도구 ──
   검색어·정렬 상태를 표 id 로 보관한다. 여러 표에서 같은 방식으로 쓴다. */
const TBL = {};                       // {id: {q, key, dir}}
function tblState(id){ return TBL[id] = TBL[id] || {q:'', key:'', dir:-1}; }
function tblSearch(id, v){ tblState(id).q = String(v||'').trim(); rerender(); }
function tblSort(id, key){
  const st = tblState(id);
  if (st.key === key) st.dir = -st.dir; else { st.key = key; st.dir = -1; }
  rerender();
}
function tblApply(id, list, fields){
  const st = tblState(id);
  let out = list;
  if (st.q) {
    const q = st.q.toLowerCase().replace(/\s/g,'');
    out = out.filter(o => fields.some(f => String(o[f]==null?'':o[f]).toLowerCase().replace(/\s/g,'').indexOf(q) >= 0));
  }
  if (st.key) {
    // 날짜는 typeof 가 'object' 라 숫자 분기를 못 타고 문자열로 비교돼 뒤섞인다.
    // 정렬 전에 값을 비교 가능한 형태로 바꾼다.
    const val = o => {
      const v = o[st.key];
      if (v instanceof Date) return v.getTime();
      if (v == null || v === '') return null;
      return v;
    };
    out = out.slice().sort((a,b)=>{
      const x = val(a), y = val(b);
      // 빈 값은 방향과 무관하게 항상 뒤로
      if (x == null && y == null) return 0;
      if (x == null) return 1;
      if (y == null) return -1;
      if (typeof x === 'number' && typeof y === 'number') return (x-y)*st.dir;
      return String(x).localeCompare(String(y),'ko')*st.dir;
    });
  }
  return out;
}

const SEARCH_IME = {};                 // id → 조합 중 여부
function searchInput(el, apply){
  const id = el.id || '';
  if (id && SEARCH_IME[id]) return;    // 조합 중이면 아직 그리지 않는다
  const pos = el.selectionStart;
  apply(el.value);
  if (!id) return;
  const next = document.getElementById(id);
  if (next && next !== document.activeElement) {
    next.focus();
    try { next.setSelectionRange(pos, pos); } catch(e) {}
  }
}
// 조합 시작/끝을 잡아 그리는 시점을 미룬다
function initSearchIME(){
  document.addEventListener('compositionstart', e => {
    if (e.target && e.target.id) SEARCH_IME[e.target.id] = true;
  }, true);
  document.addEventListener('compositionend', e => {
    const el = e.target;
    if (!el || !el.id) return;
    SEARCH_IME[el.id] = false;
    if (typeof el.oninput === 'function') el.oninput({target: el});
    else el.dispatchEvent(new Event('input', {bubbles: true}));
  }, true);
}

// 표를 CSV 로 내려받기 — 회의 자료로 옮길 때
function downloadCSV(rows, filename){
  const esc2 = v => { const t = String(v==null?"":v); return /[",\n]/.test(t) ? '"'+t.replace(/"/g,'""')+'"' : t; };
  const csv = rows.map(r => r.map(esc2).join(",")).join("\n");
  const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8;"});   // BOM: 엑셀 한글 깨짐 방지
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

// 도서 목록 — 마케팅 캠페인 시트 00_설정에서 로드 (loadMktSheets)
const MKT_BOOKS = [];

// 도서별 마케팅 액션 (레인별)
const MKT_LANES = ["서점광고","메타광고","구글광고","제휴·유튜브","인스타그램","블로그","이벤트"];
// 레인 색 — 색상환을 쓰지 않고 브랜드 옐로우 + 잉크 농담으로 7단계 구분
// 레인 색 — 유상 집행(서점광고)만 액센트 인디고, 나머지는 명도 램프.
// text 는 "칩 배경 위" 전용. 흰 카드 위 글씨에 쓰면 안 된다.
// 레인 팔레트 — 명도 램프. 유상 집행 계열이 위쪽(진한 쪽)에 오도록 순서를 잡는다.
// 레인 팔레트 — 타임라인은 레인이 6~9개라 명도만으로는 회색 계단이 된다.
// 색상환을 고르게 나누되 채도를 25~58%로 눌러 비비드해지지 않게 했다.
// 전 색상 글씨 대비 4.5:1 이상.
const LANE_RAMP = [
  {bg:"#4A63C8",text:"#FFFFFF"},   // 인디고
  {bg:"#2B3A55",text:"#FFFFFF"},   // 딥 네이비
  {bg:"#227F78",text:"#FFFFFF"},   // 틸
  {bg:"#4E6E92",text:"#FFFFFF"},   // 스틸 블루
  {bg:"#7E5289",text:"#FFFFFF"},   // 플럼
  {bg:"#5F7038",text:"#FFFFFF"},   // 올리브
  {bg:"#A85742",text:"#FFFFFF"},   // 테라코타
  {bg:"#A8823B",text:"#0F1620"},   // 머스터드
  {bg:"#A34E6C",text:"#FFFFFF"},   // 로즈
];
// 자주 쓰는 이름은 고정 배정 (표기 흔들림 대비해 느슨하게 매칭)
const LANE_FIXED = [
  [/서점|교보|예스|알라딘|영풍/, 0],   // 인디고
  [/메타|페이스북|facebook|meta/i, 1], // 딥 네이비
  [/구글|google/i, 2],                // 틸
  [/유튜브|youtube|제휴/i, 3],         // 스틸 블루
  [/인스타|instagram/i, 4],           // 플럼
  [/블로그|blog/i, 5],                // 올리브
  [/카페|커뮤니티/, 6],                // 테라코타
  [/뉴스레터|메일|letter/i, 7],        // 머스터드
  [/이벤트|경품|굿즈/, 8],             // 로즈
];
const LANE_COLORS = {};   // 실행 중 채워진다 (laneColor 참조)
const _laneAssigned = {};
function laneColor(lane){
  const k = String(lane||"").trim();
  if (_laneAssigned[k]) return _laneAssigned[k];
  let idx = null;
  for (const [re, i] of LANE_FIXED) { if (re.test(k)) { idx = i; break; } }
  if (idx === null) {
    // 미지정 레인 — 아직 안 쓰인 톤 중 하나를 순서대로 배정
    const used = new Set(Object.values(_laneAssigned).map(v => v._i));
    idx = [4,7,8,5,6,3,2,1,0].find(i => !used.has(i));
    if (idx === undefined) idx = Object.keys(_laneAssigned).length % LANE_RAMP.length;
  }
  const c = Object.assign({_i: idx, border: LANE_RAMP[idx].bg}, LANE_RAMP[idx]);
  _laneAssigned[k] = c; LANE_COLORS[k] = c;
  return c;
}

// 도서별 마케팅 액션 데이터
// type: "main"=일반칩, "expandable"=드롭다운 가능, "sub"=하위 소재(접힘)
// 도서별 마케팅 액션 — 캠페인 시트 각 도서 탭에서 로드 {code: [action,...]}
const MKT_ACTIONS = {};


let calBook = MKT_BOOKS.length > 0 ? MKT_BOOKS[0].code : "";



/* ─────────────────────────────────────
   RENDER BOOK MARKETING
───────────────────────────────────── */
function renderCalendar() {
  if (!MKT_BOOKS.length) { renderCalendarEmpty(); return; }
  // 탭 GID가 없어 데이터를 못 읽은 도서는 조용히 비우지 말고 알린다
  const _noGid = (window.__mktMissingGid || []);
  const book = MKT_BOOKS.find(b=>b.code===calBook) || MKT_BOOKS[0];
  const actions = MKT_ACTIONS[calBook] || [];
  // 일별 판매는 daySalesByDate() 가 판매량_일별_서점에서 직접 만든다
  const sales   = null;

  // ── 날짜 범위 계산 ──
  // 판매 데이터가 있는 마지막 날 (없으면 null)
  const _salesKeys = Object.keys(daySalesByDate(calBook)).sort();
  const lastSales  = _salesKeys.length ? parseAnyDate(_salesKeys[_salesKeys.length-1]) : null;

  // 출간일이 비어 있으면 데이터 시작일, 그것도 없으면 오늘을 기준으로
  let pubDate = parseAnyDate(book.pubDate);
  if (!pubDate) pubDate = (_salesKeys.length ? parseAnyDate(_salesKeys[0]) : new Date());

  // 시작: 항상 출간일 -10일 (예약판매 구간)
  const startDate = new Date(pubDate); startDate.setDate(startDate.getDate()-10);

  // 액션이 끝나는 마지막 날
  const maxActDate = actions.length
    ? new Date(Math.max(...actions.map(a=>{
        const d = parseAnyDate(a.date) || pubDate;
        const e = new Date(d); e.setDate(e.getDate() + (parseInt(a.days,10)||1) - 1);
        return e.getTime();
      })))
    : null;

  // 끝: 출간 후 89일(총 100일)을 기본 창으로 잡는다.
  // 계획 수립용 여백이 필요하므로 데이터가 없어도 창은 유지한다.
  let finalEnd = new Date(pubDate); finalEnd.setDate(finalEnd.getDate() + 89);
  // 데이터나 액션이 그보다 뒤까지 있으면 잘리지 않게 확장
  if (lastSales && lastSales > finalEnd) finalEnd = new Date(lastSales);
  if (maxActDate && maxActDate > finalEnd) finalEnd = maxActDate;
  // 최소 폭 보장 (시작일보다 앞서는 경우 방지)
  if (finalEnd < startDate) { finalEnd = new Date(startDate); finalEnd.setDate(finalEnd.getDate() + 20); }

  // 날짜 배열
  const dates = [];
  for(let d=new Date(startDate); d<=finalEnd; d.setDate(d.getDate()+1)){
    dates.push(new Date(d));
  }

  // 총 비용
  const totalCost = actions.reduce((s,a)=>s+a.cost,0);
  const paidActions = actions.filter(a=>a.cost>0);
  const totalActions = actions.length;

  // 출간 후 경과일
  const today = new Date();
  const daysSincePub = Math.floor((today-pubDate)/86400000);

  // 목표 달성률 — 실판매 합계 기준
  const goalQty = (book.goal && book.goal.qty) || 1;
  const dayMapKPI = daySalesByDate(calBook);
  const currentSales = Object.values(dayMapKPI).reduce((a,b)=>a+b,0);
  const goalPct = Math.min(Math.round(currentSales/goalQty*100),100);

  document.getElementById('tab-calendar').innerHTML = `
    ${_noGid.length ? '<div class="card gap" style="border-left:3px solid var(--bad);background:var(--bad-dim)">'
      + '<div style="font-size:12px;color:var(--ink);font-weight:700;margin-bottom:4px">탭 GID가 등록되지 않은 도서가 있습니다</div>'
      + '<div style="font-size:12px;color:var(--ink2);line-height:1.7">' + _noGid.map(esc).join(" · ")
      + '<br>캠페인 시트 <b>00_설정</b>에 <b>GID</b> 열을 만들고, 해당 도서 탭을 연 상태의 주소창에서 gid= 뒤 숫자를 넣어주세요. 주소 전체를 붙여넣어도 됩니다.</div></div>'
      : ''}

    <!-- 도서 선택 -->
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r2)">
      <span style="font-size:12px;font-weight:800;color:var(--ink2)">도서 선택</span>
      <select onchange="calBook=this.value;renderCalendar();writeHash()" style="border:1px solid var(--border2);background:var(--surface);color:var(--ink);border-radius:var(--r3);padding:7px 12px;font-family:var(--sans);font-size:13px;font-weight:700;outline:none;cursor:pointer;flex:1;max-width:360px">
        ${MKT_BOOKS.map(b=>`<option value="${b.code}" ${b.code===calBook?'selected':''}>${b.name}</option>`).join('')}
      </select>
      <span style="font-size:11px;color:var(--ink3)">출간일 ${book.pubDate} · 정가 ${(book.price||0).toLocaleString()}원</span>
    </div>

    <!-- 도서 기본정보 -->
    ${(book.author || book.coreTarget || book.mainCopy) ? `
    <div class="card gap" style="margin-bottom:16px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <div>
          <div style="display:flex;flex-wrap:wrap;gap:12px;margin-bottom:12px">
            ${book.author ? `<span style="font-size:12px;color:var(--ink3)">저자 <b style="color:var(--ink1)">${esc(book.author)}</b></span>` : ''}
            ${book.genre ? `<span style="font-size:12px;color:var(--ink3)">분야 <b style="color:var(--ink1)">${esc(book.genre)}</b></span>` : ''}
            ${book.shipQtyPlan ? `<span style="font-size:12px;color:var(--ink3)">배본 <b style="color:var(--ink1)">${book.shipQtyPlan.toLocaleString()}부</b></span>` : ''}
          </div>
          ${book.mainCopy ? `<div style="font-size:13px;font-weight:700;color:var(--ink1);line-height:1.6;margin-bottom:8px">"${esc(book.mainCopy)}"</div>` : ''}
          ${book.subCopies && book.subCopies.length ? book.subCopies.map(c=>`<div style="font-size:12px;color:var(--ink2);line-height:1.6;margin-bottom:4px">${esc(c)}</div>`).join('') : ''}
        </div>
        <div>
          ${book.coreTarget ? `<div style="margin-bottom:8px"><div style="font-size:10px;font-weight:700;color:var(--accent);letter-spacing:.06em;margin-bottom:4px">CORE TARGET</div><div style="font-size:12px;color:var(--ink2);line-height:1.5">${esc(book.coreTarget)}</div></div>` : ''}
          ${book.subTargets && book.subTargets.length ? `<div><div style="font-size:10px;font-weight:700;color:var(--ink3);letter-spacing:.06em;margin-bottom:4px">SUB TARGET</div>${book.subTargets.map(t=>`<div style="font-size:12px;color:var(--ink3);line-height:1.5;margin-bottom:4px">· ${esc(t)}</div>`).join('')}</div>` : ''}
          ${book.vehicle ? `<div style="margin-top:8px"><div style="font-size:10px;font-weight:700;color:var(--ink3);letter-spacing:.06em;margin-bottom:4px">핵심 비히클</div><div style="font-size:12px;color:var(--ink2)">${esc(book.vehicle)}</div></div>` : ''}
          ${book.memo ? `<div style="margin-top:8px;padding:8px 12px;background:var(--warn-dim);border-radius:var(--r2);font-size:12px;color:var(--warn)">${esc(book.memo)}</div>` : ''}
        </div>
      </div>
    </div>` : ''}

    <!-- 상단 KPI -->
    <div class="g5 gap" style="margin-bottom:16px">
      <div class="kpi">
        <div class="kpi-lbl">출간 후 경과</div>
        <div class="kpi-val">${daysSincePub>0?daysSincePub+'일':'D-'+Math.abs(daysSincePub)}</div>
        <div class="kpi-sub">${book.pubDate}</div>
      </div>
      <div class="kpi">
        <div class="kpi-lbl">3개월 목표</div>
        <div class="kpi-val">${book.goal&&book.goal.qty?(book.goal.qty/10000).toFixed(0)+'만부':'미설정'}</div>
        <div class="kpi-sub">목표 순위 ${book.goal&&book.goal.rank||'-'}</div>
      </div>
      <div class="kpi">
        <div class="kpi-lbl">현재 판매</div>
        <div class="kpi-val good">${currentSales.toLocaleString()}부</div>
        <div class="kpi-sub">목표 대비 ${goalPct}%<div class="kpi-bar-wrap"><div class="kpi-bar" style="width:${goalPct}%"></div></div></div>
      </div>
      <div class="kpi">
        <div class="kpi-lbl">총 마케팅비</div>
        <div class="kpi-val">${won(totalCost)}</div>
        <div class="kpi-sub">${paidActions.length}건 유상 집행</div>
      </div>
      <div class="kpi">
        <div class="kpi-lbl">총 액션 수</div>
        <div class="kpi-val">${totalActions}건</div>
        <div class="kpi-sub">${MKT_LANES.filter(l=>actions.some(a=>a.lane===l)).length}개 채널</div>
      </div>
    </div>

    <!-- 일별 판매 라인차트 -->
    ${(()=>{
      // 타임라인 판매량과 동일한 소스 사용
      const sorted = dayTotalsFor(calBook);
      if (!sorted.length) return '<div class="card gap" style="color:var(--ink3);padding:20px;text-align:center">일별 판매 데이터 없음</div>';

      const parseDate = s => parseAnyDate(s) || new Date(0);
      const maxQty = Math.max(...sorted.map(d => d.qty), 1);
      const n = sorted.length;
      const H = 190;
      const PAD = {t:20, r:20, b:40, l:44};

      // 카드 폭에 맞춰 칸 너비를 계산 — 남는 여백 없이 꽉 채운다.
      // 일수가 많아 최소 칸폭(36px)을 밑돌면 가로 스크롤로 넘어간다.
      const tabW  = (document.getElementById('tab-calendar') || {}).clientWidth || 1200;
      const availW = Math.max(640, tabW - 2);
      const segs  = Math.max(n - 1, 1);
      const CELL  = Math.max(36, (availW - PAD.l - PAD.r) / segs);
      const W     = Math.round(PAD.l + PAD.r + CELL * segs);
      const cW = W - PAD.l - PAD.r;
      const cH = H - PAD.t - PAD.b;
      const xPos = i => PAD.l + (n > 1 ? i/(n-1) : 0.5) * cW;
      const yPos = v => PAD.t + cH - (v/maxQty)*cH;

      // ── 계열 정의 ──
      // 색만으로 5개를 가르면 모노톤에서 뭉개지므로, 밝기 + 선 형태를 함께 쓴다
      const storeMapC = daySalesStoreFor(calBook) || {};
      const hasStores = Object.keys(storeMapC).length > 0;
      const SERIES = [
        {key:'총판매',  color:'#0F1620', w:2.4, dash:'',    area:true},
        {key:'교보',    color:'#3A5BD9', w:1.6, dash:''},
        {key:'예스24',  color:'#1E3A8A', w:1.6, dash:''},
        {key:'알라딘',  color:'#7C8794', w:1.6, dash:'6,3'},
        {key:'영풍',    color:'#7C8794', w:1.6, dash:'2,2'},
      ].filter(sr => sr.key === '총판매' || hasStores);

      const valOf = (sr, i) => {
        if (sr.key === '총판매') return sorted[i].qty;
        const row = storeMapC[sorted[i].date];
        return row ? (Number(row[sr.key]) || 0) : 0;
      };
      // 합계가 항상 최대이므로 총판매 기준으로 y축을 잡는다
      const pathOf = sr => 'M' + sorted.map((d,i) => xPos(i)+','+yPos(valOf(sr,i))).join('L');

      const area = 'M'+xPos(0)+','+(PAD.t+cH)+' L'+
        sorted.map((d,i) => xPos(i)+','+yPos(d.qty)).join('L')+
        'L'+xPos(n-1)+','+(PAD.t+cH)+' Z';

      // y축 그리드 (4단계)
      const ySteps = 4;
      const grid = Array.from({length:ySteps+1},(_,i) => {
        const v = Math.round(maxQty * i / ySteps);
        return '<line x1="'+PAD.l+'" x2="'+(PAD.l+cW)+'" y1="'+yPos(v)+'" y2="'+yPos(v)+'" stroke="#00000008" stroke-width="1"/>'+
          '<text x="'+(PAD.l-6)+'" y="'+(yPos(v)+4)+'" fill="#CDD4DE" font-size="10" text-anchor="end">'+v+'</text>';
      }).join('');

      // x축 — 모든 날짜 표기. 첫날과 매월 1일만 'M/D', 나머지는 일자만
      const xLabels = sorted.map((d,i) => {
        const dt = parseDate(d.date);
        const head = (i === 0 || dt.getDate() === 1);
        const label = head ? (dt.getMonth()+1)+'/'+dt.getDate() : String(dt.getDate());
        const sun = dt.getDay() === 0;
        return '<text x="'+xPos(i)+'" y="'+(PAD.t+cH+17)+'" fill="'+(sun?'#B3243C':(head?'#55606E':'#8B97A6'))+
          '" font-size="'+(head?10:9)+'" font-weight="'+(head||sun?700:400)+'" text-anchor="middle">'+label+'</text>';
      }).join('');

      // 세로 그리드 — 월요일 / 매월 1일
      const vGrid = sorted.map((d,i) => {
        const dt = parseDate(d.date);
        if (dt.getDay() !== 1 && dt.getDate() !== 1) return '';
        return '<line x1="'+xPos(i)+'" x2="'+xPos(i)+'" y1="'+PAD.t+'" y2="'+(PAD.t+cH)+'" stroke="#0000000A" stroke-width="1"/>';
      }).join('');

      // 점은 총판매에만 (5계열 전부 찍으면 뭉개짐)
      const dots = sorted.map((d,i) =>
        '<circle cx="'+xPos(i)+'" cy="'+yPos(d.qty)+'" r="2.5" fill="#FFF" stroke="#0F1620" stroke-width="1.5"/>'
      ).join('');

      const chartId = 'day-chart-'+calBook;
      const ttId = 'day-tt-'+calBook;

      return '<div class="card gap" style="margin-bottom:16px;padding:16px 0 0">'+
        '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:0 16px 12px">'+
          '<div class="card-title" style="margin:0">일별 판매 추이 <small>출간일부터 · 서점별</small></div>'+
          '<div style="display:flex;gap:12px;flex-wrap:wrap">'+
            SERIES.map(sr => '<span style="display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:var(--ink2)">'+
              '<svg width="18" height="8"><line x1="0" y1="4" x2="18" y2="4" stroke="'+sr.color+'" stroke-width="'+sr.w+'"'+
                (sr.dash ? ' stroke-dasharray="'+sr.dash+'"' : '')+'/></svg>'+ sr.key +'</span>').join('')+
          '</div>'+
        '</div>'+
        '<div style="position:relative;overflow-x:auto">'+
        '<svg id="'+chartId+'" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMinYMid meet" style="display:block">'+
          '<defs><linearGradient id="dg1" x1="0" y1="0" x2="0" y2="1">'+
            '<stop offset="0%" stop-color="#37424F" stop-opacity=".15"/>'+
            '<stop offset="100%" stop-color="#37424F" stop-opacity="0"/>'+
          '</linearGradient></defs>'+
          grid + vGrid + xLabels +
          // 타임라인 액션 호버 시 해당 집행 기간을 덮는 밴드
          '<rect id="dcb-'+calBook+'" y="'+PAD.t+'" height="'+cH+'" x="0" width="0" '+
            'fill="rgba(58,91,217,.10)" stroke="var(--accent)" stroke-width="1" '+
            'style="display:none" pointer-events="none"/>'+
          '<path d="'+area+'" fill="url(#dg1)"/>'+
          SERIES.slice().reverse().map(sr => '<path d="'+pathOf(sr)+'" fill="none" stroke="'+sr.color+
            '" stroke-width="'+sr.w+'" stroke-linejoin="round" stroke-linecap="round"'+
            (sr.dash ? ' stroke-dasharray="'+sr.dash+'"' : '')+'/>').join('') + dots +
          '<line id="dhl-'+calBook+'" x1="0" x2="0" y1="'+PAD.t+'" y2="'+(PAD.t+cH)+'" stroke="#37424F" stroke-width="1" stroke-dasharray="3,3" opacity="0" pointer-events="none"/>'+
          '<rect x="'+PAD.l+'" y="'+PAD.t+'" width="'+cW+'" height="'+cH+'" fill="transparent" id="day-hover-'+calBook+'"/>'+
        '</svg>'+
        '<div id="'+ttId+'" style="display:none;position:fixed;z-index:200;background:var(--surface);border:1px solid var(--border2);color:var(--ink2);font-size:11px;line-height:1.5;padding:12px 14px;border-radius:var(--r2);pointer-events:none;box-shadow:var(--sh-lg)"></div>'+
        '</div></div>';
    })()}

    <!-- 일자형 마케팅 타임라인 -->
    <div class="card gap">
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap">
        <div class="card-title" style="margin:0">마케팅 타임라인 <small>출간일 기준 · 레인별 액션 밀도</small></div>
        <div style="display:flex;align-items:baseline;gap:12px;font-size:11px;color:var(--ink3)">
          <span>집행 액션 <b style="font-size:15px;font-weight:900;color:var(--ink)">${totalActions.toLocaleString()}</b>건</span>
          <span>운영 채널 <b style="font-size:15px;font-weight:900;color:var(--ink)">${MKT_LANES.filter(l=>actions.some(a=>a.lane===l)).length}</b>개</span>
          <span>집행 기간 <b style="font-size:15px;font-weight:900;color:var(--ink)">${dates.length}</b>일</span>
          <span>총 집행액 <b style="font-size:15px;font-weight:900;color:var(--ink)">${won(totalCost)}</b></span>
          <button onclick="toggleAllLanes()" style="border:1px solid var(--border2);background:var(--surface);color:var(--ink2);
            border-radius:var(--r3);padding:3px 9px;font-family:var(--sans);font-size:11px;font-weight:700;cursor:pointer;margin-left:4px">
            ${MKT_LANES.some(l=>actions.some(a=>a.lane===l) && !TL_COLLAPSED[l]) ? '모두 접기' : '모두 펼치기'}</button>
        </div>
      </div>
      <div class="mkt-timeline-wrap" id="tl-wrap"></div>
      </div>

      <!-- 범례 -->
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">
        ${MKT_LANES.filter(l=>actions.some(a=>a.lane===l)).map(l=>{
          const c=laneColor(l);
          // 레인 text 색은 칩(어두운 배경) 위에서만 유효하므로 범례 글씨엔 쓰지 않는다
          return `<span style="display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:var(--ink2)">
            <span style="width:20px;height:9px;background:${c.bg};border:1px solid ${c.border};border-radius:var(--r5);flex-shrink:0"></span>${l}
          </span>`;
        }).join('')}
        <span style="display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:var(--ink2)">
          <span style="width:20px;height:9px;background:var(--ink);border-radius:var(--r5);flex-shrink:0"></span>판매량
        </span>
      </div>
    </div>

    <!-- 하단: 비용 현황 + 제안 히스토리 나란히 -->
    <div class="g2e gap2">
      <!-- 매체별 비용 -->
      <div class="card">
        <div class="card-title">매체별 비용 집행</div>
        ${(()=>{
          const byLane = {};
          actions.forEach(a=>{ if(a.cost>0) byLane[a.lane]=(byLane[a.lane]||0)+a.cost; });
          const entries = Object.entries(byLane).sort((a,b)=>b[1]-a[1]);
          const max = Math.max(...entries.map(([,v])=>v),1);
          return entries.map(([lane,cost])=>{
            const c=laneColor(lane);
            const pct2=Math.round(cost/totalCost*100);
            // 흰 카드 위 글씨이므로 레인 text 색(칩 전용)을 쓰지 않고, 색 구분은 좌측 점으로
            return `<div class="prog-item">
              <div class="prog-head"><b style="display:inline-flex;align-items:center;gap:8px;color:var(--ink)"><span style="width:9px;height:9px;border-radius:var(--r5);background:${c.bg};border:1px solid ${c.border};flex-shrink:0"></span>${lane}</b><span>${won(cost)} · ${pct2}%</span></div>
              <div class="prog-bg"><div class="prog-fill" style="width:${Math.round(cost/max*100)}%;background:${c.border}"></div></div>
            </div>`;
          }).join('') || '<div class="empty-row">비용 데이터 없음</div>';
        })()}
      </div>

      <!-- 액션 목록 -->
      <div class="card">
        <div class="card-title">액션 목록 <small>${totalActions}건</small></div>
        <div style="max-height:280px;overflow-y:auto">
          <table>
            <tr><th>날짜</th><th>채널</th><th>내용</th><th class="right">비용</th></tr>
            ${actions.sort((a,b)=>a.date.localeCompare(b.date)).map(a=>{

                <td style="font-size:12px">${esc(a.label)}</td>
                <td class="right" style="font-size:11px">${a.cost?won(a.cost):'—'}</td>
              </tr>`;
            }).join('')}
          </table>
        </div>

    </div>`;
  // innerHTML 세팅 후 타임라인 DOM 직접 렌더
  renderTimeline(dates, pubDate, today, actions, sales);
  // 일별 판매 추이 호버 핸들러 연결 (innerHTML 교체로 매번 새로 붙여야 함)
  initDayChartHover();
}

/* ── 도서명/날짜 정규화 + 일별판매 매칭 헬퍼 ── */
function normTitle(s){
  return String(s||'')
    .replace(/\s+/g,'')
    .replace(/개정판|증보판|합본|특별판|리커버/g,'')
    .replace(/[()\[\]{}<>·・.,'"\u2018\u2019\u201C\u201D-]/g,'');
}
function ymd(d){
  if(!(d instanceof Date) || isNaN(d)) return '';
  return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
}
function parseAnyDate(v){
  if (v instanceof Date) return isNaN(v) ? null : v;
  if (v == null || v === '') return null;
  var t = String(v).trim();
  // "2026-01-14 00:00:00" / "2026-01-14T09:30" 처럼 시간이 붙은 값 → 시간 부분 제거.
  // 안 벗기면 '1400' 이 일(日)로 먹혀 엉뚱한 날짜가 나온다.
  t = t.replace(/[T\s]+\d{1,2}:\d{2}(:\d{2})?(\.\d+)?\s*(Z|[+-]\d{2}:?\d{2})?$/i, '').trim();
  // 한글 표기: 2026년 6월 22일 / 2026년 6월 22일(월)
  var kr = t.match(/(\d{4})\s*년\s*(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
  if (kr) return new Date(+kr[1], +kr[2] - 1, +kr[3]);
  var p = t.replace(/[.\/]/g, '-').replace(/\s/g, '').split('-').filter(function(x){ return x !== ''; });
  if (p.length >= 3) {
    var y = +p[0], m = +p[1], d = +p[2];
    if (p[0].length <= 2 && y < 100) y += 2000;          // 26-01-14
    if (y > 1900 && m >= 1 && m <= 12 && d >= 1 && d <= 31) return new Date(y, m - 1, d);
    return null;
  }
  // 연도 없는 MM/DD 는 브라우저가 2001년 등으로 해석하므로 버린다.
  // (연도를 아는 쪽에서 pubDateOf 같은 헬퍼로 조합해야 한다)
  if (p.length === 2 && +p[0] <= 31 && +p[1] <= 31) return null;
  var d2 = new Date(t);
  if (isNaN(d2)) return null;
  return d2.getFullYear() < 2000 ? null : d2;
}
