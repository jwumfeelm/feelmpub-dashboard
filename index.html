// ── 출판팀 시트 ──
// 탭마다 제목 행이 위에 있어 헤더 위치가 다르므로, 알려진 열 이름으로 헤더 행을 찾는다.
async function fetchPubGrid(gid) {
  const url = `https://docs.google.com/spreadsheets/d/${CFG.pubSheetId}/export?format=csv&gid=${gid}`;
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return parseCSVGrid(await res.text());
}
function findHeaderRow(grid, keys) {
  for (let i = 0; i < Math.min(grid.length, 8); i++) {
    const j = (grid[i] || []).map(v => String(v||'').replace(/\s/g,'')).join('|');
    if (keys.every(k => j.indexOf(k.replace(/\s/g,'')) >= 0)) return i;
  }
  return -1;
}
function gridToObjs(grid, hdrIdx) {
  const hdr = (grid[hdrIdx] || []).map(v => String(v||'').trim());
  return grid.slice(hdrIdx + 1).map(r => {
    const o = {_raw: r};
    hdr.forEach((h, i) => { if (h && !(h in o)) o[h] = r[i] || ''; });
    return o;
  });
}

async function loadPubSheets() {
  // 출간 관리
  try {
    const grid = await fetchPubGrid(CFG.pubGids.plan);
    const hi = findHeaderRow(grid, ['도서명','배본일']);
    if (hi < 0) throw new Error('헤더 행(도서명·배본일)을 찾지 못했습니다');

    // 열은 헤더 이름으로 찾는다. 시트에서 열이 밀려도 따라간다.
    // 못 찾으면 알려진 열 문자(A=0 기준)로 되돌아간다.
    const H = (grid[hi] || []).map(v => String(v||'').replace(/\s/g,''));
    const colAt = (names, fallback) => {
      for (const n of names) {
        const k = n.replace(/\s/g,'');
        const i = H.indexOf(k);
        if (i >= 0) return i;
      }
      return fallback;
    };
    // 폴백은 현재 시트 배치 기준 (E 도서명 · F 저자명 · G 역자명 · H 분야 …)
    const C = {
      inDate: colAt(['입고일'], 2),          // C
      ship:   colAt(['배본일'], 3),          // D
      title:  colAt(['도서명'], 4),          // E
      author: colAt(['저자명','저자'], 5),    // F
      trans:  colAt(['역자명','역자'], 6),    // G
      genre:  colAt(['분야'], 7),            // H
      team:   colAt(['팀'], -1),
      status: colAt(['원고 진행도','진행도'], 9),
      plan:   colAt(['기획','기획자'], 12),   // M
      design: colAt(['디자인','디자이너'], 14),// O
      mkter:  colAt(['마케터','마케팅'], 15), // P
    };

    // 공정 단계 열도 이름으로 찾는다. '디자인'은 담당자 열에도 있으므로
    // 담당자 구간(마케터·콘텐츠) 이후에서만 탐색한다.
    const stageFrom = Math.max(C.mkter, colAt(['콘텐츠'], -1)) + 1;
    const stageCol = names => {
      for (const n of names) {
        const k = n.replace(/\s/g,'').toLowerCase();
        for (let i = stageFrom; i < H.length; i++) {
          if (H[i].toLowerCase() === k) return i;
        }
      }
      return -1;
    };
    const STG = PUB_STAGES.map(st => ({
      key: st.key,
      col: (()=>{ const i = stageCol(st.names || [st.key]); return i >= 0 ? i : st.col; })()
    }));
    console.info('[출간 관리] 열 매핑', C, '공정', STG.map(x=>x.key+':'+x.col).join(' '));

    const rows = grid.slice(hi + 1).filter(r => String(r[C.title]||'').trim());
    const books = rows.map(r => {
      const stages = STG.map(st => ({key: st.key, date: dateWithYear(r[st.col], String(r[0]||''))}))
                       .filter(x => x.date);
      const yr0 = String(r[0]||'').trim();
      const ship = dateWithYear(r[C.ship], yr0) || dateWithYear(r[C.inDate], yr0);
      return {
        year:   yr0,
        month:  String(r[1]||'').trim(),
        inDate: dateWithYear(r[C.inDate], yr0),
        ship:   ship,
        title:  String(r[C.title]||'').trim(),
        author: String(r[C.author]||'').trim(),
        trans:  C.trans >= 0 ? String(r[C.trans]||'').trim() : '',
        genre:  String(r[C.genre]||'').trim(),
        team:   C.team >= 0 ? String(r[C.team]||'').trim() : '',
        status: String(r[C.status]||'').trim(),
        plan:   String(r[C.plan]||'').trim(),     // L 기획
        design: String(r[C.design]||'').trim(),   // O 디자인
        mkter:  String(r[C.mkter]||'').trim(),    // P 마케터
        stages: stages,
      };
    });
    PUB_BOOKS.splice(0, PUB_BOOKS.length, ...books);
  } catch(e) {
    console.warn('[출간 관리] 로드 실패:', e);
  }

  // 외서 계약 (GID 미입력이면 건너뜀)
  if (CFG.pubGids.rights) {
    try {
      const grid = await fetchPubGrid(CFG.pubGids.rights);
      const hi = findHeaderRow(grid, ['도서명','종료일']);
      if (hi >= 0) {
        const objs = gridToObjs(grid, hi).filter(o => String(o['도서명']||'').trim());
        PUB_RIGHTS.splice(0, PUB_RIGHTS.length, ...objs);
      }
    } catch(e) { console.warn('[외서 계약] 로드 실패:', e); }
  }

  // 판권 수출 (GID 미입력이면 건너뜀)
  if (CFG.pubGids.export) {
    try {
      const grid = await fetchPubGrid(CFG.pubGids.export);
      const hi = findHeaderRow(grid, ['도서명','국가']);
      if (hi >= 0) {
        const objs = gridToObjs(grid, hi).filter(o => String(o['도서명']||'').trim());
        PUB_EXPORT.splice(0, PUB_EXPORT.length, ...objs);
      }
    } catch(e) { console.warn('[판권 수출] 로드 실패:', e); }
  }
  if (activeTab === 'summary') renderSummary();
}

async function loadMktSheets() {
  try {
    // 00_설정 (노출 관리)
    const mktSetting = await fetchMktSheet(CFG.mktGids.setting);
    const visibleBooks = mktSetting.filter(r => r['노출여부 (Y/N)'] === 'Y' || r['노출여부 (Y/N)'] === 'y');

    if (!visibleBooks.length) return;

    // MKT_BOOKS 갱신
    // GID는 00_설정에서 읽는다. 신간마다 코드를 고치지 않도록.
    const pickGid = r => {
      for (const k of Object.keys(r)) {
        if (/gid|시트\s*id|탭\s*id/i.test(k)) {
          const v = String(r[k] || '').trim();
          const m = v.match(/gid=(\d+)/) || v.match(/^(\d{4,})$/);   // URL 통째로 붙여넣어도 인식
          if (m) return m[1];
        }
      }
      return '';
    };
    const newMktBooks = visibleBooks.map(r => {
      const code = r['도서코드 (탭명과 동일)'] || '';
      const name = r['도서명 (표시명)'] || '';
      const existing = MKT_BOOKS.find(b => b.code === code) || {};
      return { ...existing, code, name, gid: pickGid(r) };
    });
    MKT_BOOKS.splice(0, MKT_BOOKS.length, ...newMktBooks);

    // 각 도서 탭에서 액션 데이터 읽기
    const missingGid = [];
    for (const book of newMktBooks) {
      const gid = book.gid;
      if (!gid) {
        missingGid.push(book.code || book.name);
        window.__mktMissingGid = missingGid;
        console.warn('[캠페인] 탭 GID를 찾을 수 없습니다:', book.code,
          '— 00_설정에 GID 열을 추가하거나 탭 주소의 gid 값을 넣어주세요.');
        continue;
      }
      try {
        const grid = await fetchMktSheetGrid(gid);
        const flat = v => String(v||'').replace(/\s/g,'');

        // ── 시트 구조 자동 판별 ──
        // 액션 표 헤더 행(날짜 + 레인/액션명)이 어디인지 찾는다
        const actHdrIdx = grid.findIndex(r => {
          const j = (r||[]).map(flat).join('|');
          return j.includes('날짜') && (j.includes('레인') || j.includes('액션명'));
        });
        // 기본정보가 가로로 놓인 행(저자 + 분야가 한 줄에)
        const infoHdrIdx = grid.findIndex(r => {
          const j = (r||[]).map(flat).join('|');
          return j.includes('저자') && j.includes('분야');
        });

        const info = {};
        const subTargets = [], subCopies = [];
        const addInfo = (k, v) => {
          const key = String(k||'').trim().replace(/\s+/g,' ');
          const val = String(v||'').trim();
          if (!key || !val) return;
          if (/^Sub.?Target/i.test(key) || /^서브\s*타깃/.test(key)) subTargets.push(val);
          else if (/^Sub.?Copy/i.test(key) || /^서브\s*카피/.test(key)) subCopies.push(val);
          else if (!(key in info)) info[key] = val;
        };

        if (infoHdrIdx >= 0 && grid[infoHdrIdx+1]) {
          // (A) 가로형 — 헤더 행 바로 아래가 값
          grid[infoHdrIdx].forEach((h, i) => addInfo(h, grid[infoHdrIdx+1][i]));
        } else {
          // (B) 세로형 — A열 항목명 / B열 값. 액션 표 위쪽만 훑는다
          const limit = actHdrIdx >= 0 ? actHdrIdx : grid.length;
          for (let i = 0; i < limit; i++) addInfo((grid[i]||[])[0], (grid[i]||[])[1]);
        }

        const getInfo = (...keys) => { for(const k of keys){ if(info[k]) return info[k]; } return ''; };

        book.pubDate      = getInfo('출간일') || book.pubDate || '';
        book.price        = parseFloat(String(getInfo('정가(원)','정가')||'0').replace(/,/g,'')) || book.price || 0;
        book.author       = getInfo('저자','Author');
        book.genre        = getInfo('분야','장르','Genre');
        book.shipQtyPlan  = parseFloat(String(getInfo('배본부수(부)','배본부수')||'0').replace(/,/g,'')) || 0;
        book.coreTarget   = getInfo('코어타깃','코어 타깃','Core타깃','Core Target','CoreTarget');
        book.subTargets   = subTargets;
        book.mainCopy     = getInfo('메인카피','메인 카피','MAIN COPY','Main Copy','MainCopy');
        book.subCopies    = subCopies;
        book.vehicle      = getInfo('핵심비히클','핵심 비히클','핵심비클','MKT Vehicle','MKTVehicle');
        book.memo         = getInfo('담당메모','담당 메모','메모');
        book.goal = book.goal || {}; book.goal = {
          rank:    getInfo('3개월목표순위','3개월 목표 순위','목표순위','순위목표','순위 목표'),
          qty:     parseFloat(String(getInfo('3개월목표부수','3개월 목표 부수','목표부수','3개월 목표 부수')||'0').replace(/,/g,'')) || 0,
          revenue: 0,
        };

        // ── 마케팅 액션 파싱 ──
        // 액션 표 헤더가 있으면 그 아래부터, 없으면 3행부터.
        // 열 위치는 헤더 이름으로 찾고, 못 찾으면 기존 순서로 대체한다.
        const actStart = actHdrIdx >= 0 ? actHdrIdx + 1 : 2;
        const aHdr = actHdrIdx >= 0 ? (grid[actHdrIdx] || []).map(flat) : [];
        const col = (names, fallback) => {
          for (const n of names) {
            const i = aHdr.findIndex(h => h && h.indexOf(flat(n)) >= 0);
            if (i >= 0) return i;
          }
          return fallback;
        };
        const cDate = col(['날짜','일자'], 0);
        const cLane = col(['레인','채널'], 1);
        const cName = col(['액션명','액션'], 2);
        const cDays = col(['기간'], 3);
        const cCost = col(['비용(원)','비용'], 4);
        const cStat = col(['status','상태'], 6);
        const cUrl  = col(['소재URL','URL','링크'], 7);
        const cDesc = col(['소재설명','설명','내용'], 8);

        const actions = grid.slice(actStart).filter(vals => {
          const first = (vals[cDate] || '').trim();
          // 4자리 연도 + 구분자가 있는 것만 날짜로 인정
          if (!/^\d{4}[-./]/.test(first)) return false;
          return !!parseAnyDate(first);
        }).map(vals => {
          return {
            date:   ymd(parseAnyDate(vals[cDate])),
            lane:   (vals[cLane] || '').trim(),
            label:  (vals[cName] || '').trim(),
            days:   parseFloat(vals[cDays]) || 1,
            cost:   parseFloat(String(vals[cCost]||'0').replace(/,/g,'')) || 0,
            status: (vals[cStat] || 'planned').toLowerCase(),
            url:    (vals[cUrl] || '').trim().replace(/['\u2018\u2019"]/g, ''),
            detail: (vals[cDesc] || '').trim(),
            type:   'single',
          };
        });

        MKT_ACTIONS[book.code] = actions;
      } catch(e) {
        console.warn('마케팅 시트 로드 실패:', book.code, e);
      }
    }

    // calBook 초기화
    if (MKT_BOOKS.length > 0 && !MKT_BOOKS.find(b => b.code === calBook)) {
      calBook = MKT_BOOKS[0].code;
    }

  } catch(e) {
    console.warn('마케팅 캠페인 시트 로드 실패:', e);
  }
  // 늦게 도착한 출처가 데이터 신선도에 반영되도록 다시 그린다
  if (activeTab === 'summary') renderSummary();
}

async function loadSheets() {
  const dot = document.getElementById('syncDot');
  const txt = document.getElementById('syncTxt');

  // GID 미설정이면 연동 불가
  // 핵심 시트만 검사한다. shipRaw·authors·pubCal 은 나중에 채워지는 선택 항목이라
  // 여기에 넣으면 하나만 비어도 전체 연동이 멈춘다.
  const REQUIRED_GIDS = ['setting','monthly','cost','ship','scm','bookList','weekSales'];
  const allSet = REQUIRED_GIDS.every(k => (CFG.gids[k] || '') !== '');
  if (!CFG.sheetId || !allSet) {
    dot.className = 'sync-dot error';
    txt.textContent = '시트 ID/GID 미설정 — 데이터 없음';
    royLoadHide();
    return;
  }

  dot.className = 'sync-dot loading';
  txt.textContent = '구글 시트 연결 중...';

  try {
    // 병렬 fetch (현재 탭 구조 기준)
    const [setting, monthly, cost, ship, scm, bookList, weekSales, daySalesStore, members, pubCal] = await Promise.all([
      fetchSheet(CFG.gids.setting),   // 00_설정
      fetchSheet(CFG.gids.monthly),   // 01_월별실적
      fetchSheet(CFG.gids.cost),      // 02_비용원장
      fetchSheet(CFG.gids.ship),      // 03_출고실적
      fetchSheet(CFG.gids.scm),       // 04_마케팅실적
      fetchSheet(CFG.gids.bookList),  // 도서 목록
      fetchSheet(CFG.gids.weekSales), // 판매량_주차별
      fetchSheet(CFG.gids.daySalesStore).catch(e => {   // 판매량_일별_서점
        console.warn('[판매량_일별_서점] 로드 실패 — GID/공유설정 확인:', e);
        return [];
      }),
      CFG.gids.members
        ? fetchSheet(CFG.gids.members).catch(e => { console.warn('[구성원] 로드 실패:', e); return []; })
        : Promise.resolve([]),
      CFG.gids.pubCal                                   // 출간_캘린더
        ? fetchSheet(CFG.gids.pubCal).catch(e => { console.warn('[출간 캘린더] 로드 실패:', e); return []; })
        : Promise.resolve([]),
    ]);

    applySheetData({ setting, monthly, cost, ship, scm, bookList, weekSales, daySalesStore, members });
    applyPubCal(pubCal);
    celebrate();

    SD.loaded = true;
    royLoadHide();
    // 출고 RAW(3.6MB)는 로그인을 붙잡지 않고 뒤에서 미리 받아둔다.
    // 인세 정산 탭에 들어갈 즈음이면 대개 준비가 끝나 있다.
    setTimeout(() => { loadShipRaw(true); }, 1200);
    dot.className = 'sync-dot';
    txt.textContent = '시트 연동 완료 · ' + new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
    hideSkeleton();
    computeFreshness();

    // 최초 렌더는 빈 데이터로 그려지므로 애니메이션 잠금을 풀고 실데이터로 다시 재생
    const _tc = document.getElementById('trend-chart');
    if (_tc) _tc._animated = false;

    renderPills();
    renderActive();

    window.__mktMissingGid = [];
    // 그로스 채널 시트 비동기 로드
    loadChannelSheets().then(() => { if (activeTab==='channel') renderChannel(); });

    // 출판팀 시트 비동기 로드
    loadPubSheets().then(() => {
      if (activeTab==='publish') renderPublish();
      if (activeTab==='summary') renderSummary();   // 인당 출간·판권 수출이 뒤늦게 채워진다
    });

    // 마케팅 캠페인 시트 비동기 로드
    loadMktSheets().then(() => {
      if (activeTab === 'calendar') renderCalendar();
    });

  } catch(e) {
    royLoadHide();
    dot.className = 'sync-dot error';
    // 로컬(file://)에서 열면 CORS로 fetch 불가 → 안내 메시지
    const isLocal = location.protocol === 'file:';
    txt.textContent = isLocal
      ? '로컬(file://) 환경 — 시트 연동 불가 (GitHub Pages 배포 후 연동)'
      : '시트 연동 실패 — 데이터 없음';
    dot.className = isLocal ? 'sync-dot' : 'sync-dot error';
    if(!isLocal) console.warn('Sheet fetch error:', e);
  }
}

// 비밀번호는 연도와 무관하게 C2 한 칸에 적는 규칙 (시트에도 그렇게 안내돼 있음).
// 첫 연도 열부터 왼쪽→오른쪽으로 훑어 처음 나오는 값을 쓴다.
function pickPw(row){
  const keys = Object.keys(row).filter(k => /^\d{4}$/.test(k)).sort();   // 2025, 2026, …
  for (const k of keys.concat(['값','내용'])) {
    const v = String(row[k] || '').trim();
    if (v) return v;
  }
  return '';
}

/* ─────────────────────────────────────
   APPLY SHEET DATA → 전역 변수 반영
───────────────────────────────────── */
function applySheetData({ setting, monthly, cost, ship, scm, bookList, weekSales, daySalesStore, members }) {
  // ── 00_설정 → ANNUAL_TARGET, CFG.pw, 채널링크 갱신 ──
  const yr = new Date().getFullYear();
  if (setting && setting.length > 0) {
    const rowTarget = setting.find(r => r['항목']==='연간 매출 목표 (원)');
    if (rowTarget) {
      const val = toNum(rowTarget[String(yr)] || 0);
      if (val > 0) ANNUAL_TARGET = val;
    }
    const rowPw = setting.find(r => r['항목']==='대시보드 비밀번호');
    if (rowPw) {
      const pw = pickPw(rowPw);
      if (pw) { CFG.pw = pw; try { localStorage.setItem('feelm-pw', pw); } catch(e){} }
    }
    // 채널 링크 (H열=채널명, I열=링크)
    const linkRows = setting.filter(r => r['채널명'] && r['링크']);
    if (linkRows.length > 0) {
      CFG.channelLinks = {};
      linkRows.forEach(r => { CFG.channelLinks[r['채널명']] = r['링크']; });
    }
  }

  // ── 01_월별실적 → M_SHIP_SALES 등 갱신 ──
  // 구조: 항목 | 연도 | 1월~12월
  // 주의: '교보문고' 같은 서점명이 [출고 매출] · [전자책 매출] · [반품액] 세 구간에
  //       반복 등장한다. 항목명만으로 찾으면 엉뚱한 구간 값을 읽는다.
  //       또 '연도'가 병합 셀이면 하위 행에서 비어 나오므로 위 값을 이어받는다.
  const flatL = x => String(x || '').replace(/[\s\u00A0]+/g, '');
  const yr4   = x => { const m = String(x || '').match(/\d{4}/); return m ? m[0] : ''; };
  // 구간 헤더 판별 — 표기 흔들림(공백·괄호)에 견디도록 느슨하게
  const sectOf = L => {
    if (/^출고매출/.test(L)) return 'ship';
    if (/^전자책/.test(L))   return 'ebook';
    if (/^반품액/.test(L))   return 'return';
    if (/^(총매출|순매출|총비용)/.test(L)) return 'top';
    return null;
  };
  const mFirst = {};   // 연도|항목 → 최초 등장 행
  const mSect  = {};   // 연도|구간|항목 → 구간별 행
  const mSeen  = {ship:0, ebook:0, return:0};
  (() => {
    let curYear = '', curSect = 'top';
    monthly.forEach(r => {
      const y = yr4(r['연도']);
      if (y) curYear = y;
      const L = flatL(r['항목']);
      if (!L) return;
      const sc = sectOf(L);
      if (sc) { curSect = sc; if (mSeen[sc] !== undefined) mSeen[sc]++; }
      const fk = curYear + '|' + L;
      if (!(fk in mFirst)) mFirst[fk] = r;
      mSect[curYear + '|' + curSect + '|' + L] = r;
    });
  })();

  const rowToArr = row => row ? MONTHS.map(m => toNum(row[m] || 0)) : Array(12).fill(0);
  const getMonthly = (label, year = yr) => rowToArr(mFirst[yr4(year) + '|' + flatL(label)]);
  // 구간 지정 조회. 구간을 못 찾으면 0을 주지 말고 기존 방식(최초 등장)으로 되돌린다.
  const getSect = (label, sect, year = yr) => {
    const key = yr4(year) + '|' + sect + '|' + flatL(label);
    if (mSect[key]) return rowToArr(mSect[key]);
    return getMonthly(label, year);
  };
  // 진단용 — 구간 인식이 안 되면 콘솔에서 바로 확인 가능
  window.__monthlyDiag = () => ({
    '연도목록': [...new Set(monthly.map(r => yr4(r['연도'])).filter(Boolean))],
    '구간헤더인식': mSeen,
    '항목샘플': monthly.slice(0, 12).map(r => flatL(r['항목'])).filter(Boolean),
    '2026출고구간키': Object.keys(mSect).filter(k => k.indexOf('|ship|') > 0).slice(0, 12),
  });

  const newShip   = getMonthly('총 매출');
  const newReturn = getMonthly('반품액');
  const newMkt    = getMonthly('마케팅팀 비용');
  const newPub    = getMonthly('출판팀 비용');
  const newCom    = getMonthly('경상비');
  const newTarget = getMonthly('월 목표 매출');
  // 서점별 출고액 — [출고 매출] 구간에서만 읽는다 (전자책·반품 구간과 이름이 겹침)
  const newKyobo      = getSect('교보문고','ship');
  const newYes        = getSect('예스24','ship');
  const newAladin     = getSect('알라딘','ship');
  const newYoungpoong = getSect('영풍','ship');
  const newCoupang    = getSect('쿠팡','ship');
  const newBooksun    = getSect('북센','ship');
  const newDosomae    = getSect('도소매(자유서적 포함)','ship');
  const newOthers     = getSect('기타(현매)','ship');

  // 목표 매출은 출고 매출과 무관하게 항상 반영
  if (newTarget.some(v=>v>0)) {
    M_TARGET.splice(0, 12, ...newTarget);
  }

  // 서점별 월별 출고 부수 → M_SCM 갱신
  const storeMonthly = MONTHS.map((_,i) => ({
    kyobo:      newKyobo[i]||0,
    yes:        newYes[i]||0,
    aladin:     newAladin[i]||0,
    youngpoong: newYoungpoong[i]||0,
    coupang:    newCoupang[i]||0,
    booksun:    newBooksun[i]||0,
    dosomae:    newDosomae[i]||0,
    others:     newOthers[i]||0,
  }));
  if (storeMonthly.some(d=>Object.values(d).some(v=>v>0))) {
    M_SCM.splice(0, 12, ...storeMonthly);
  }

  // 데이터가 있으면 전역 변수 교체
  if (newShip.some(v=>v>0)) {
    M_SHIP_SALES.splice(0, 12, ...newShip);
    M_RETURN.splice(0, 12, ...newReturn);
    newShip.forEach((v,i) => { M_NET_SALES[i] = v - newReturn[i]; });
    M_MKT_COST.splice(0, 12, ...newMkt);
    M_PUB_COST.splice(0, 12, ...newPub);
    M_COM_COST.splice(0, 12, ...newCom);
    M_MKT_COST.forEach((_,i) => { M_TOTAL_COST[i] = newMkt[i]+newPub[i]+newCom[i]; });
    M_TOTAL_COST.forEach((v,i) => { M_PROFIT[i] = M_NET_SALES[i]-v; });
  }

  // ── 도서 목록 → BOOKS 갱신 ──
  if (bookList && bookList.length > 0) {
    const mapped = bookList.map((r, i) => ({
      id: i+1,
      title:       r['도서명']||'',
      code:        r['내부 관리 코드']||'',
      author:      '',
      genre:       r['분야']||'',
      price:       toNum(r['정가']),
      supply:      0,
      unit:        0,
      cover:       ['#0F1620','#2A3644','#48545F','#69747F','#2A44A8','#37424F','#8B97A6','#1B2430'][i%8],
      field:       r['관리']||'',
      mkt:         '',
      edit:        '',
      isbn:        r['ISBN']||'',
      // 출고 표기명 별칭 — 시트 수식이 못 잡아도 코드에서 다시 매칭
      altTitles:   String(r['출고표기명']||r['출고 표기명']||'')
                     .split(/[,|;\n]/).map(x=>x.trim()).filter(Boolean),
      pubDate:     r['출간일']||'',
      // 인세 — 저자명과 구간 인세율 (도서 목록 시트)
      author:      String(r['저자명']||r['저자']||'').trim(),
      tiers:       readTiers(r),
      isStrategic: (r['전략도서 여부']||'').toString().toLowerCase()==='true',
      // 도서 목록의 '과거*' 열은 2024년 이전분이 아니라 전체 누적 스냅샷이므로
      // 여기에 2025년 이후 실적을 더하면 이중 계상됨. 스냅샷은 따로 보관 후 max로 결합.
      snapShipQty:  toNum(r['과거출고부수']),
      snapShipAmt:  toNum(r['과거출고매출']),
      snapSalesQty: toNum(r['과거판매부수']),
      snapSalesPub: toNum(r['과거판매액']),
      cumShipQty:  0, cumShipAmt: 0, cumSalesQty: 0, cumSalesPub: 0,
      cumMktCost:  0, cumPubCost: 0, cumComCost: 0,
      r12ShipQty:  0, r12ShipAmt: 0,   // 최근 12개월 (관리 대상 판정용)
      mShipQty:0, mShipAmt:0, mReturn:0, mReturnAmt:0, stock:0, scm3m:0,
      stores:{kyobo:0,yes:0,aladin:0,naver:0,others:0},
      mktBreak:{meta:0,google:0,tiktok:0,store:0,etc:0},
    })).filter(b=>b.title);

    // ── 동일 ISBN 행 병합 (리커버·에디션·구판표기 등) ──
    // 대표 도서명은 [구판]/[리커버]/(구) 같은 머리표가 없는 쪽을 우선
    const isbnKey = v => String(v||'').replace(/[^0-9]/g,'');
    const tagged  = t => /^[\[(]/.test(String(t||'').trim());
    const byIsbn = new Map();
    const merged = [];
    mapped.forEach(b => {
      const k = isbnKey(b.isbn);
      if (!k) { merged.push(b); return; }          // ISBN 없으면 단독 유지
      const prev = byIsbn.get(k);
      if (!prev) { byIsbn.set(k, b); merged.push(b); return; }
      // 과거 실적은 합산
      prev.snapShipQty  += b.snapShipQty;
      prev.snapShipAmt  += b.snapShipAmt;
      prev.snapSalesQty += b.snapSalesQty;
      prev.snapSalesPub += b.snapSalesPub;
      prev.isStrategic  = prev.isStrategic || b.isStrategic;
      // 대표명 선정: 머리표 없는 이름 > 판본 공통명 > 기존
      if (tagged(prev.title) && !tagged(b.title)) {
        prev.title = b.title;
      } else if (tagged(prev.title) && tagged(b.title)) {
        // 둘 다 [리커버]/(구) 같은 머리표뿐이고 벗기면 같은 이름이면 공통명 사용
        const strip = t => String(t||'').replace(/^\s*[\[(][^\])]*[\])]\s*/, '').trim();
        if (strip(prev.title) && strip(prev.title) === strip(b.title)) prev.title = strip(prev.title);
      }
      if (!prev.price && b.price) prev.price = b.price;
      if (!prev.pubDate && b.pubDate) prev.pubDate = b.pubDate;
      (prev.aliases = prev.aliases || []).push(b.title);
      if (b.altTitles && b.altTitles.length)
        prev.altTitles = (prev.altTitles || []).concat(b.altTitles);
    });
    merged.forEach((b,i)=>{ b.id = i+1; });

    // ISBN → 도서 인덱스 (시트 간 조인 키)
    const bookByIsbn = new Map();
    merged.forEach(b => { const k=isbnKey(b.isbn); if(k) bookByIsbn.set(k, b); });
    // 도서명 → 도서 (ISBN 미기재 행 대비 폴백)
    const bookByTitle = new Map();
    merged.forEach(b => {
      bookByTitle.set(b.title.replace(/\s/g,''), b);
      (b.aliases||[]).forEach(a => bookByTitle.set(String(a).replace(/\s/g,''), b));
      (b.altTitles||[]).forEach(a => bookByTitle.set(String(a).replace(/\s/g,''), b));
    });
    const findBook = r => bookByIsbn.get(isbnKey(r['ISBN']))
                       || bookByTitle.get(String(r['도서명']||'').replace(/\s/g,''))
                       || null;

    // ── 02_비용원장 → 월별 계획(미지급) 비용 ──
    // 대부분 익월말 지급이라 당월은 계속 '계획' 상태다.
    // 지급분만 보면 당월 비용이 0으로 보이므로, 계획을 따로 담아 함께 표시한다.
    (function(){
      const yy = String(yr);
      const mk = Array(12).fill(0), pb = Array(12).fill(0), cm = Array(12).fill(0);
      cost.forEach(r => {
        if ((r['구분']||'').trim() !== '계획') return;
        const ym = String(r['귀속월']||'').trim();
        if (ym.slice(0,4) !== yy) return;
        const i = parseInt(ym.slice(5,7),10) - 1;
        if (isNaN(i) || i < 0 || i > 11) return;
        const amt = toNum(r['비용']);
        const team = (r['귀속팀'] || '').trim();
        if (team === '마케팅') mk[i] += amt;
        else if (team === '출판') pb[i] += amt;
        else cm[i] += amt;
      });
      M_MKT_PLAN.splice(0,12,...mk);
      M_PUB_PLAN.splice(0,12,...pb);
      M_COM_PLAN.splice(0,12,...cm);
      M_TOTAL_PLAN.splice(0,12,...mk.map((v,i)=>v+pb[i]+cm[i]));
    })();

    // ── 구성원 (생일·입사일) ──
  // 본인이 노출여부를 Y 로 둔 사람만 담는다. 생년은 쓰지 않는다.
  (function(){
    MEMBERS.splice(0, MEMBERS.length);
    ROSTER.splice(0, ROSTER.length);
    (members || []).forEach(function(r){
      var name = String(r['이름'] || '').trim();
      if (!name) return;
      // 명부는 전원 (생일 노출 여부와 무관). 퇴사일이 있으면 그 시점까지만 재직으로 본다.
      ROSTER.push({
        name: name,
        team: String(r['팀'] || '기타').trim() || '기타',
        joinD:  parseAnyDate(r['입사일']),
        leaveD: parseAnyDate(r['퇴사일']),
      });

      var show = String(r['노출여부'] || '').trim().toUpperCase();
      if (show !== 'Y') return;
      MEMBERS.push({
        name: name,
        team: String(r['팀'] || '').trim(),
        birth: mdOf(r['생일']),
        joined: String(r['입사일'] || '').trim(),
        joinedMD: mdOf(r['입사일']),
        joinYear: (String(r['입사일']||'').match(/(20\d{2})/) || [])[1] || '',
      });
    });
  })();

  // ── 지급월 기준 집계 ──
    Object.keys(COST_BY_PAY).forEach(k => delete COST_BY_PAY[k]);
    cost.forEach(r => {
      const g = (r['구분']||'').trim();
      if (g !== '지급' && g !== '계획') return;
      const pm = String(r['지급월']||'').trim().slice(0,7);
      const am = String(r['귀속월']||'').trim().slice(0,7);
      if (!pm) return;
      const amt = toNum(r['비용']);
      if (!COST_BY_PAY[pm]) COST_BY_PAY[pm] = {fixed:0, plan:0, fromPrev:0};
      if (g === '지급') COST_BY_PAY[pm].fixed += amt; else COST_BY_PAY[pm].plan += amt;
      if (am && am < pm) COST_BY_PAY[pm].fromPrev += amt;   // 이전 달 귀속분
    });

    // ── 귀속팀 x 대구분 집계 (귀속 기준, 기준월까지) ──
    Object.keys(COST_BY_CAT).forEach(k => delete COST_BY_CAT[k]);
    (function(){
      const upto = document.getElementById('monthPicker').value.slice(0,7);
      cost.forEach(r => {
        const g = (r['구분']||'').trim();
        if (g !== '지급' && g !== '계획') return;
        const ym = String(r['귀속월']||'').trim().slice(0,7);
        if (!ym || ym.slice(0,4) !== String(yr) || ym > upto) return;
        const team = (r['귀속팀']||'기타').trim() || '기타';
        const cat  = (r['대구분']||'미분류').trim() || '미분류';
        const amt  = toNum(r['비용']);
        if (!COST_BY_CAT[team]) COST_BY_CAT[team] = {};
        if (!COST_BY_CAT[team][cat]) COST_BY_CAT[team][cat] = {fixed:0, plan:0};
        if (g === '지급') COST_BY_CAT[team][cat].fixed += amt;
        else              COST_BY_CAT[team][cat].plan  += amt;
      });
    })();

    // ── 도서 미배분 비용 집계 ──
    COST_NOBOOK.미상 = 0; COST_NOBOOK.기타 = 0;
    let _firstAssigned = '';
    cost.forEach(r => {
      if ((r['구분']||'').trim() !== '지급') return;
      const nm = String(r['도서명']||'').trim();
      const amt = toNum(r['비용']);
      const ym = String(r['귀속월']||'').trim().slice(0,7);
      if (nm === '미상')      COST_NOBOOK.미상 += amt;
      else if (nm === '기타') COST_NOBOOK.기타 += amt;
      else if (nm && ym) {     // 실제 도서에 붙은 첫 달 = 배분 시작 시점
        if (!_firstAssigned || ym < _firstAssigned) _firstAssigned = ym;
      }
    });
    COST_NOBOOK.배분시작 = _firstAssigned;

    // ── 02_비용원장 → 도서별 누적 비용 (지급분만)
    cost.forEach(r => {
      if ((r['구분']||'').trim() !== '지급') return;
      const bookName = r['도서명'] || '';
      const b2 = findBook(r)
                 || bookByTitle.get(String(bookName).replace(/\s/g,''))
                 || merged.find(x => x.code === bookName);
      const amt = toNum(r['비용']);
      const team = (r['귀속팀'] || '').trim();
      if (b2) {
        if (team === '마케팅') b2.cumMktCost += amt;
        else if (team === '출판') b2.cumPubCost += amt;
        else b2.cumComCost += amt;
      }
    });

    // ── 03_출고실적 → 당월 출고 + 기준월까지 누적 집계
    const m = getM();
    const curYM = document.getElementById('monthPicker').value; // YYYY-MM
    const r12From = (()=>{
      const [y,mo] = curYM.split('-').map(Number);
      const d = new Date(y, mo-1-11, 1);
      return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2);
    })();
    ROY_SHIP.splice(0, ROY_SHIP.length, ...ship.map(r => ({
      title: String(r['도서명']||'').trim(),
      ym:    String(r['연도·월']||'').slice(0,7),
      ship:  toNum(r['출고부수']),
      ret:   toNum(r['반품부수']),
      price: toNum(r['정가']),
      rate:  toNum(r['종이책 인세율']),
    })).filter(x => x.ym));

    ship.forEach(r => {
      const b = findBook(r);
      if(!b) return;
      const ym = r['연도·월'] || '';
      // 2025년 이후 기준월 이하 누적 집계 (2024년 이전은 도서목록 과거데이터로 관리)
      if(ym && ym >= '2025-01' && ym <= curYM) {
        b.cumShipQty += toNum(r['출고부수']);
        b.cumShipAmt += toNum(r['출고매출(원)']);
      }
      // 최근 12개월 (기준월 포함 직전 12개월)
      if(ym && ym >= r12From && ym <= curYM) {
        b.r12ShipQty += toNum(r['출고부수']);
        b.r12ShipAmt += toNum(r['출고매출(원)']);
      }
      // 당월 집계
      if(!ym || !ym.startsWith(curYM.slice(0,7))) return;
      b.mShipQty   += toNum(r['출고부수']);
      b.mShipAmt   += toNum(r['출고매출(원)']);
      b.mReturn    += toNum(r['반품부수']);
      b.mReturnAmt += toNum(r['반품액(원)']);
    });

    // 재고 — 03_출고실적 재고 컬럼 기준 (도서별 마지막 행 값)
    const stockByTitle = {};
    ship.forEach(r => {
      if(r['도서명'] && r['재고'] !== '' && r['재고'] !== undefined) {
        stockByTitle[r['도서명']] = toNum(r['재고']);
      }
    });
    merged.forEach(b => {
      if(stockByTitle[b.title] !== undefined) b.stock = stockByTitle[b.title];
      else (b.aliases||[]).forEach(a => { if(stockByTitle[a] !== undefined) b.stock = stockByTitle[a]; });
    });

    // 06_마케팅실적(SCM) → 당월 서점별
    // 최근 3개월 YM 목록 계산
    const cur3m = [];
    for(let i=0; i<3; i++){
      const d = new Date(curYM + '-01');
      d.setMonth(d.getMonth() - i);
      cur3m.push(d.toISOString().slice(0,7));
    }

    ROY_SCM.splice(0, ROY_SCM.length, ...scm.map(r => ({
      title: String(r['도서명']||'').trim(),
      isbn:  String(r['ISBN']||'').trim(),
      ym:    String(r['연도·월']||'').slice(0,7),
      qty:   toNum(r['총판매(부)']),
    })).filter(x => x.ym));

    scm.forEach(r => {
      const ym = r['연도·월'] || '';
      const b = findBook(r);
      if(!b) return;
      // 당월 서점별 판매
      if(ym.startsWith(curYM.slice(0,7))) {
        b.stores.kyobo  += toNum(r['교보(부)']);
        b.stores.yes    += toNum(r['예스24(부)']);
        b.stores.aladin += toNum(r['알라딘(부)']);
        b.stores.naver  += toNum(r['영풍(부)']);
        b.stores.others += 0;
      }
      // 최근 3개월 실판매 누적
      if(cur3m.some(m => ym.startsWith(m))) {
        b.scm3m = (b.scm3m || 0) + toNum(r['총판매(부)']);
      }
      // 누적 실판매 전체 기간 (시중재고 계산용 - 2026년 출간 도서는 과거데이터 없음)
      b.cumSalesQty += toNum(r['총판매(부)']);
    });

    // ── 누적 확정: 스냅샷(전체 누적)과 실집계 중 큰 값 ──
    // 2024년 이전 실적은 03/04 시트에 없고 스냅샷에만 있으므로 max로 흡수
    merged.forEach(b => {
      b.cumShipQty  = Math.max(b.snapShipQty,  b.cumShipQty);
      b.cumShipAmt  = Math.max(b.snapShipAmt,  b.cumShipAmt);
      b.cumSalesQty = Math.max(b.snapSalesQty, b.cumSalesQty);
      // 공급단가 = 실제 출고매출 / 출고부수 (정가의 약 55%)
      b.supply = b.cumShipQty > 0 ? Math.round(b.cumShipAmt / b.cumShipQty) : 0;
      // 판매액은 공급가 기준으로 통일 (출고매출과 동일 기준).
      // 시트의 '과거판매액'은 정가 기준이라 그대로 쓰면 손익이 과대 계상됨.
      b.cumSalesPub = b.cumSalesQty * b.supply;
      b.cumSalesList = b.snapSalesPub;   // 정가 기준 원본 (참고용 보관)
    });

    if(merged.length > 0) {
      BOOKS.splice(0, BOOKS.length, ...merged);
    }
  }

  // ── 판매량_일별_서점 → DAY_SALES_STORE 갱신 ──
  // 기대 컬럼: 판매일 | 도서 | 서점 | 판매부수
  // 헤더명이 달라도 열 순서(1~4번째)로 폴백하므로 label 절이 없어도 동작
  window.__mktStoreDiag = { rows: 0, headers: [], mapped: null, parsed: 0, titles: [] };
  if (daySalesStore && daySalesStore.length > 0) {
    Object.keys(DAY_SALES_STORE).forEach(k => delete DAY_SALES_STORE[k]);

    const keys0 = Object.keys(daySalesStore[0] || {});
    const flat  = x => String(x||'').replace(/\s/g,'');
    const findKey = names =>
      keys0.find(k => names.some(n => flat(k) === flat(n))) ||
      keys0.find(k => names.some(n => flat(k).indexOf(flat(n)) >= 0));

    let kDate  = findKey(['판매일','날짜(일별)','날짜','일자']);
    let kTitle = findKey(['도서명','도서','제목']);
    let kStore = findKey(['서점분류','서점','채널']);
    let kQty   = findKey(['판매부수','판매수량','수량']);
    // 헤더로 못 찾은 항목은 열 순서로 대체
    if (!kDate || !kTitle || !kStore || !kQty) {
      kDate  = kDate  || keys0[0];
      kTitle = kTitle || keys0[1];
      kStore = kStore || keys0[2];
      kQty   = kQty   || keys0[3];
    }

    // 교보_온/교보_오프/교보_법인 등 세부 코드를 서점 단위로 통합
    const normStore = v => {
      const t = String(v||'').trim();
      if (/교보/.test(t))            return '교보';
      if (/예스|YES24/i.test(t))     return '예스24';
      if (/알라딘/.test(t))          return '알라딘';
      if (/영풍/.test(t))            return '영풍';
      return t;
    };

    daySalesStore.forEach(r => {
      const title = String(r[kTitle]  || '').trim();
      const store = normStore(r[kStore]);
      const qty   = toNum(r[kQty]);
      const key   = ymd(parseAnyDate(r[kDate]));
      if (!title || !key || !store) return;
      if (!DAY_SALES_STORE[title]) DAY_SALES_STORE[title] = {};
      if (!DAY_SALES_STORE[title][key]) DAY_SALES_STORE[title][key] = {};
      const cur = DAY_SALES_STORE[title][key];
      cur[store] = (cur[store] || 0) + qty;
      window.__mktStoreDiag.parsed++;
    });

    window.__mktStoreDiag.rows    = daySalesStore.length;
    window.__mktStoreDiag.headers = keys0;
    window.__mktStoreDiag.mapped  = {날짜:kDate, 도서:kTitle, 서점:kStore, 부수:kQty};
    window.__mktStoreDiag.titles  = Object.keys(DAY_SALES_STORE);
  }

  // ── 판매량_주차별 → WEEK_SALES 갱신 ──
  if (weekSales && weekSales.length > 0) {
    Object.keys(WEEK_SALES).forEach(k => delete WEEK_SALES[k]);
    // 전략도서 제목 → 공백제거 맵
    const stratTitleMap = {};
    BOOKS.filter(b => b.isStrategic).forEach(b => {
      stratTitleMap[b.title.replace(/\s/g, '')] = b.title;
    });
    weekSales.forEach(r => {
      // D열 도서명(도서 목록 기준) 우선, 없으면 A열 ISBN 기준 매칭
      const title = r['도서명'] || stratTitleMap[(r['ISBN']||'').replace(/\s/g,'')] || '';
      const week  = r['연도·주차'] || '';
      const qty   = toNum(r['판매부수']);
      if (!title || !week) return;
      if (!WEEK_SALES[title]) WEEK_SALES[title] = [];
      WEEK_SALES[title].push({week, qty});
    });
  }

}

/* ─────────────────────────────────────
   INIT
───────────────────────────────────── */
function initApp(){
  applyHash();                    // URL 에 담긴 화면 상태 복원
  showSkeleton();
  renderTabs(); renderPills(); renderActive();
  stampConfNote();
  initEasterEggs();
  initCmdk();
  initSearchIME();
  (function(){
    const el = document.getElementById('royModal');
    if (el) el.addEventListener('click', e => { if (e.target === el) royClose(); });
    document.addEventListener('keydown', e => {
      if ((e.key||'').toLowerCase() === 'escape' && el && el.classList.contains('on')) royClose();
    });
  })();
  royLoadArchive();
  royMetaLoad();
  initInstall();
  window.addEventListener('hashchange', function(){ applyHash(); renderPills(); renderActive(); });
  initShortcuts();

  // 조작 중 판정 — 마지막 마우스 움직임 이후 20초간은 '사용 중'으로 본다
  var _idleT = null;
  document.addEventListener('mousemove', function(){
    window.__userActive = true;
    clearTimeout(_idleT);
    _idleT = setTimeout(function(){ window.__userActive = false; }, 20000);
  }, {passive:true});
  loadSheets();
  if(CFG.autoRefreshMin > 0) {
    // 자동 새로고침이 보고 있던 위치를 되돌리지 않도록, 마우스가 화면 위에 있으면 건너뛴다
    setInterval(function(){
      if (window.__userActive) return;      // 조작 중이면 다음 주기로 미룸
      loadSheets();
    }, CFG.autoRefreshMin * 60 * 1000);
  }
}

function writeHash(){
  const p = ['tab='+activeTab];
  const m = (document.getElementById('monthPicker')||{}).value;
  if(m) p.push('m='+m);
  if(activeTab==='calendar' && calBook) p.push('book='+encodeURIComponent(calBook));
  const h = '#'+p.join('&');
  if(location.hash !== h) history.replaceState(null,'',h);
}
function readHash(){
  const out = {};
  (location.hash||'').replace(/^#/,'').split('&').forEach(kv=>{
    const i = kv.indexOf('=');
    if(i>0) out[kv.slice(0,i)] = decodeURIComponent(kv.slice(i+1));
  });
  return out;
}
function applyHash(){
  { const mm=(location.hash||'').match(/cmp=(prev|none)/); if(mm) CMP=mm[1]; }
  const q = readHash();
  if(q.m && /^\d{4}-\d{2}$/.test(q.m)){
    const el = document.getElementById('monthPicker');
    if(el) el.value = q.m;
  }
  if(q.book) calBook = q.book;
  const ids = TABS.filter(t=>t.id).map(t=>t.id);
  if(q.tab && ids.indexOf(q.tab)>=0) setTab(q.tab, true);
}

// ── 스파크라인 ──
// KPI 숫자만으로는 '지금 오르는 중인지'가 안 보인다. 최근 구간 추세를 얇은 선으로 덧붙인다.
// 숫자가 0에서 목표값까지 올라가며 채워진다. data-count 를 가진 요소를 훑는다.
function runCountUps(root){
  (root || document).querySelectorAll('[data-count]').forEach(function(el){
    var to   = Number(el.getAttribute('data-count')) || 0;
    var mode = el.getAttribute('data-fmt') || 'won';
    var dur  = 1000, t0 = null;
    var ease = function(t){ return 1 - Math.pow(1 - t, 3); };      // 감속
    var fmt  = function(v){
      if (mode === 'won')  return (v < 0 ? '-' : '') + won(Math.abs(Math.round(v)));
      if (mode === 'wonS') return (v >= 0 ? '+' : '-') + won(Math.abs(Math.round(v)));
      if (mode === 'dec')  return v.toFixed(1);
      if (mode === 'int')  return Math.round(v).toLocaleString();
      return String(Math.round(v));
    };
    // 애니메이션이 어떤 이유로든 중단돼도 값이 0 으로 남지 않게 최종값을 예약해 둔다
    var done = false;
    var settle = function(){ if (!done) { done = true; el.textContent = fmt(to); } };
    setTimeout(settle, dur + 400);
    function step(ts){
      if (done) return;
      if (!t0) t0 = ts;
      var k = Math.min(1, (ts - t0) / dur);
      el.textContent = fmt(to * ease(k));
      if (k < 1) requestAnimationFrame(step);
      else settle();
    }
    requestAnimationFrame(step);
  });
}
// 선이 왼쪽에서 오른쪽으로 그려진다
function drawLines(root){
  (root || document).querySelectorAll('[data-draw]').forEach(function(pth){
    var len = 0;
    try { len = pth.getTotalLength(); } catch(e) { return; }
    if (!len) return;
    pth.style.transition = 'none';
    pth.style.strokeDasharray = len + ' ' + len;
    pth.style.strokeDashoffset = len;
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        pth.style.transition = 'stroke-dashoffset 1.1s cubic-bezier(.16,1,.3,1)';
        pth.style.strokeDashoffset = '0';
      });
    });
  });
}

function spark(series, curIdx, opt){
  opt = opt || {};
  const span = opt.span || 6;
  const from = Math.max(0, (curIdx|0) - span + 1);
  const data = (series||[]).slice(from, (curIdx|0) + 1).map(v => Number(v)||0);
  if (data.length < 2 || data.every(v => v === 0)) return '';
  const W = 100, H = 22, P = 1.5;
  const mx = Math.max(...data), mn = Math.min(...data);
  const rng = (mx - mn) || 1;
  const x = i => P + i / (data.length - 1) * (W - P*2);
  const y = v => H - P - ((v - mn) / rng) * (H - P*2);
  const pts = data.map((v,i) => x(i)+','+y(v)).join('L');
  const last = data[data.length-1], prev = data[data.length-2];
  const up = last >= prev;
  const col = opt.color || (up ? 'var(--ink)' : 'var(--bad)');
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" '
    + 'style="width:100%;height:22px;display:block;margin-top:12px;overflow:visible">'
    + '<path d="M'+pts+'L'+x(data.length-1)+','+(H-P)+'L'+x(0)+','+(H-P)+'Z" fill="'+col+'" opacity=".07"/>'
    + '<path d="M'+pts+'" fill="none" stroke="'+col+'" stroke-width="1.5" '
    + 'stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>'
    + '<circle cx="'+x(data.length-1)+'" cy="'+y(last)+'" r="2" fill="'+col+'" '
    + 'vector-effect="non-scaling-stroke"/>'
    + '</svg>';
}

function progBar(label,val,total,color,sub=''){
  const r=Math.min(pct(val,total),100);
  return `<div class="prog-item">
    <div class="prog-head"><b>${label}</b><span>${won(val)} / ${won(total)} · ${r}%${sub?' · '+sub:''}</span></div>
    <div class="prog-bg"><div class="prog-fill bar-grow" style="--w:${r}%;background:${color}"></div></div>
  </div>`;
}

function renderTrendChart(curM) {
  const el = document.getElementById('trend-chart');
  if (!el) return;

  const W = el.offsetWidth || 900;
  const H = 220;
  const PAD = {t:28, r:72, b:40, l:72};
  const cW = W - PAD.l - PAD.r;
  const cH = H - PAD.t - PAD.b;
  const months = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

  const shipData   = M_SHIP_SALES.map((v,i) => i <= curM ? v : null);
  const targetData = M_TARGET;
  const costData   = M_TOTAL_COST.map((v,i) => i <= curM ? v : null);
  const retData    = M_SHIP_SALES.map((v,i) => i <= curM && v > 0 ? Math.round(M_RETURN[i]/v*1000)/10 : null); // M_SHIP_SALES = 총 매출

  const maxAmt = Math.max(...M_TARGET, ...M_SHIP_SALES.filter((_,i)=>i<=curM), 1) * 1.15;
  const maxRet = Math.max(...retData.filter(v=>v!==null), 15);

  const barW  = slotW * 0.52;
  const xPos  = i => PAD.l + (i + 0.5) / 12 * cW;
  const yAmt  = v => PAD.t + cH - (v / maxAmt) * cH;
  const yRet  = v => PAD.t + cH - (v / maxRet) * cH;
  const fmtAmt = v => v >= 100000000 ? (v/100000000).toFixed(1)+'억' : v >= 10000 ? Math.round(v/10000)+'만' : v;

  const yTicks = 4;
  const amtTicks = Array.from({length:yTicks+1},(_,i) => maxAmt * i / yTicks);
  const retTicks = Array.from({length:yTicks+1},(_,i) => maxRet * i / yTicks);

  // 목표 라인
  const targetPts = targetData.map((v,i) => `${xPos(i)},${yAmt(v)}`);
  const targetPath = `M${targetPts.join('L')}`;

  // 비용 라인
  const costPts = costData.map((v,i) => v !== null ? `${xPos(i)},${yAmt(v)}` : null).filter(Boolean);
  const costPath = costPts.length > 1 ? `M${costPts.join('L')}` : '';

  const retPts = retData.map((v,i) => v !== null ? `${xPos(i)},${yRet(v)}` : null).filter(Boolean);

    </span>

      <span style="display:inline-block;width:18px;height:1.5px;background:${TC.target};vertical-align:middle"></span>목표매출
    </span>
    <span style="display:flex;align-items:center;gap:8px;font-size:11px;color:${TC.legend}">
      <span style="display:inline-block;width:18px;height:1.5px;background:${TC.cost};vertical-align:middle;border-top:1.5px dashed ${TC.cost}"></span>총비용
    </span>
    <span style="display:flex;align-items:center;gap:8px;font-size:11px;color:${TC.legend}">
      <span style="display:inline-block;width:8px;height:8px;background:${TC.ret};border-radius:50%"></span>반품률(우)

    const rect = svg.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (W / rect.width);
    const idx = Math.min(11, Math.max(0, Math.floor((mx - PAD.l) / cW * 12)));
    const cx = xPos(idx);
    hLine.setAttribute('x1', cx); hLine.setAttribute('x2', cx);
    hLine.style.opacity = '1';

    const sv = shipData[idx], tv = targetData[idx], cv = costData[idx], rv = retData[idx];
    const achStr = sv != null && tv ? (sv >= tv ? '달성 ' : '미달 ') : null;
    const lines = [
      ['tc-tt-mo',     months[idx],                                    TC.ttMuted],
      ['tc-tt-ship',   sv  != null ? (achStr + fmtAmt(sv))            : null, sv != null && tv && sv >= tv ? TC.barTop : TC.ret],
      ['tc-tt-target', tv  != null ? '목표  ' + fmtAmt(tv)            : null, TC.target],
      ['tc-tt-cost',   cv  != null ? '비용  ' + fmtAmt(cv)            : null, TC.ttMuted],
      ['tc-tt-ret',    rv  != null ? '반품  ' + rv + '%'               : null, TC.ret],
    ].filter(l => l[1] !== null);

    const ttW = 144, lineH = 17, ttPad = 10;
    const ttH = lines.length * lineH + ttPad * 2;
    let ttX = cx + 14, ttY = PAD.t + 4;
    if (ttX + ttW > W - PAD.r) ttX = cx - ttW - 14;

    const bg = el.querySelector('#tc-tt-bg');
    bg.setAttribute('x', ttX); bg.setAttribute('y', ttY);
    bg.setAttribute('width', ttW); bg.setAttribute('height', ttH);

    lines.forEach(([id, txt, fill], i) => {
      const t = el.querySelector('#' + id);
      if (t) { t.setAttribute('x', ttX + ttPad); t.setAttribute('y', ttY + ttPad + 11 + i * lineH); t.setAttribute('fill', fill); t.textContent = txt; }
    });
    tooltip.style.opacity = '1';
  });

  hoverArea.addEventListener('mouseleave', () => { hLine.style.opacity = '0'; tooltip.style.opacity = '0'; });

  if (el._animated) return;
  el._animated = true;

  const EASE = 'cubic-bezier(.16,1,.3,1)';

  // ── 막대: 바닥에서 위로 자라남 (월 순서대로 60ms 간격) ──
  const allBars = el.querySelectorAll('#tc-ship-bars rect');
  allBars.forEach((bar, i) => {
    const origY = parseFloat(bar.getAttribute('y'));
    const origH = parseFloat(bar.getAttribute('height'));
    bar.setAttribute('y', origY + origH);
    bar.setAttribute('height', 0);
    setTimeout(() => {
      bar.style.transition = 'y .62s ' + EASE + ', height .62s ' + EASE;
      bar.setAttribute('y', origY);
      bar.setAttribute('height', origH);
    }, i * 60);
  });

  // ── 라인: 왼쪽에서 오른쪽으로 그려짐 ──
  const barsDone = allBars.length * 60 + 200;
  [['tc-target', 0.75, 0], ['tc-cost', 0.8, 140], ['tc-ret', 0.85, 280]].forEach(([id, op, delay]) => {
    animateLine(el.querySelector('#' + id), op, barsDone + delay);
  });

  // ── 반품률 점: 라인이 다 그려진 뒤 하나씩 ──
  const dots = el.querySelectorAll('#tc-ret-dots circle');
  dots.forEach((c, i) => {
    c.style.opacity = '0';
    setTimeout(() => {
      c.style.transition = 'opacity .3s linear';
      c.style.opacity = '1';
    }, barsDone + 280 + 900 + i * 45);
  });
}

// 선을 왼쪽에서 오른쪽으로 그림. 점선(stroke-dasharray)도 원래 패턴을 보존한다.
function animateLine(path, finalOpacity, delay) {
  if (!path) return;
  let len = 0;
  try { len = path.getTotalLength(); } catch(e) { return; }
  if (!len) return;

  const origDash = path.getAttribute('stroke-dasharray');   // 점선 패턴 백업
  path.style.opacity = '0';
  path.style.strokeDasharray = len + ' ' + len;
  path.style.strokeDashoffset = len;
  path.style.transition = 'none';

  setTimeout(() => {
    path.style.opacity = String(finalOpacity);
    path.style.transition = 'stroke-dashoffset 1s cubic-bezier(.16,1,.3,1)';
    path.style.strokeDashoffset = '0';
    // 다 그려지면 원래 점선 패턴 복원
    path.addEventListener('transitionend', () => {
      path.style.transition = 'none';
      path.style.strokeDashoffset = '';
      path.style.strokeDasharray = origDash || '';
    }, {once:true});
  }, delay);
}
