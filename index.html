// 서점별 일별 판매 → {'YYYY-MM-DD': {교보:n, ...}} (없으면 null)
function daySalesStoreFor(code){
  var keys=Object.keys(DAY_SALES_STORE);
  if(!keys.length) return null;
  var mb=(typeof MKT_BOOKS!=='undefined') ? MKT_BOOKS.find(function(b){return b.code===code;}) : null;
  var cands=[];
  if(mb){ if(mb.name) cands.push(mb.name); if(mb.code) cands.push(mb.code); }
  if(code) cands.push(code);
  for(var i=0;i<cands.length;i++){
    var target=normTitle(cands[i]);
    if(!target) continue;
    var hit=keys.find(function(k){ return normTitle(k)===target; });
    if(hit) return DAY_SALES_STORE[hit];
    hit=keys.find(function(k){
      var nk=normTitle(k);
      return nk && (nk.indexOf(target)>=0 || target.indexOf(nk)>=0);
    });
    if(hit) return DAY_SALES_STORE[hit];
  }
  return null;
}

// 일별 총판매 → {YYYY-MM-DD: 부수}
// 판매량_일별_서점 하나만 본다. 총판매는 서점별 값을 합산해서 만든다.
function daySalesByDate(code){
  var out={};
  var sm = daySalesStoreFor(code);
  if (!sm) return out;
  Object.keys(sm).forEach(function(k){
    var row=sm[k], t=0;
    Object.keys(row).forEach(function(st){ t += (Number(row[st])||0); });
    out[k]=t;
  });
  return out;
}

// 차트용 — 날짜 오름차순 [{date, qty}]
function dayTotalsFor(code){
  var m=daySalesByDate(code);
  return Object.keys(m).sort().map(function(k){ return {date:k, qty:m[k]}; });
}

function driveImgUrl(url) {
  if (!url) return '';
  const m = url.match(/\/file\/d\/([^\/\?]+)/);
  if (m) return 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w1200';
  return url;
}
function drivePreviewUrl(url) {
  if (!url) return '';
  const m = url.match(/\/file\/d\/([^\/\?]+)/);
  if (m) return 'https://drive.google.com/file/d/' + m[1] + '/preview';
  return '';
}
function driveLh3Url(url) {
  if (!url) return '';
  const m = url.match(/\/file\/d\/([^\/\?]+)/);
  return m ? 'https://lh3.googleusercontent.com/d/' + m[1] + '=w1200' : '';
}
function driveOpenUrl(url) {
  if (!url) return '';
  const m = url.match(/\/file\/d\/([^\/\?]+)/);
  return m ? 'https://drive.google.com/file/d/' + m[1] + '/view' : url;
}
// ── 소재 링크 → 미리보기 판별 ──
// 유튜브는 공개 썸네일 주소가 있어 그대로 쓰고, 인스타·블로그는 서버 인증 없이
// 썸네일을 가져올 방법이 없으므로 플랫폼 표식 + 바로가기로 대체한다.
function mediaInfo(url) {
  var u = String(url || '').trim();
  if (!u) return null;

  // 구글드라이브
  var gd = u.match(/\/file\/d\/([^\/\?]+)/);
  if (gd) return {kind:'drive', name:'구글드라이브', thumb:driveImgUrl(u), open:driveOpenUrl(u), mark:'D'};

  // 유튜브 (watch / youtu.be / shorts / embed)
  var yt = u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  if (yt) return {
    kind:'youtube', name:'YouTube', mark:'▶',
    thumb:'https://img.youtube.com/vi/'+yt[1]+'/hqdefault.jpg',
    thumbAlt:'https://img.youtube.com/vi/'+yt[1]+'/mqdefault.jpg',
    open:'https://www.youtube.com/watch?v='+yt[1]
  };

  // 이미지 직링크
  if (/\.(png|jpe?g|gif|webp|avif)(\?|$)/i.test(u)) return {kind:'image', name:'이미지', thumb:u, open:u, mark:'IMG'};

  // 나머지 플랫폼 — 썸네일 없음
  var host = '';
  try { host = new URL(u).hostname.replace(/^www\./,''); } catch(e) { host = u.slice(0,40); }
  var known = [
    [/instagram\.com/i,      'Instagram', 'IG'],
    [/(blog\.naver\.com|tistory\.com|brunch\.co\.kr|velog\.io)/i, '블로그', 'BLOG'],
    [/(facebook\.com|fb\.com)/i, 'Facebook', 'FB'],
    [/(tiktok\.com)/i,       'TikTok',    'TT'],
    [/(threads\.net)/i,      'Threads',   'TH'],
    [/(x\.com|twitter\.com)/i,'X',        'X'],
    [/(kyobobook|yes24|aladin|ridibooks)/i, '서점', 'BOOK'],
  ];
  for (var i=0;i<known.length;i++) if (known[i][0].test(u)) return {kind:'link', name:known[i][1], mark:known[i][2], open:u, host:host};
  return {kind:'link', name:host || '링크', mark:'LINK', open:u, host:host};
}

// 썸네일 로드 실패 시 단계적 대체
function mediaImgFallback(el, alt) {
  el.onerror = null;
  if (alt && el.src !== alt) { el.src = alt; return; }
  var box = el.parentElement;
  if (box) { el.style.display='none'; var ph = box.querySelector('[data-ph]'); if (ph) ph.style.display='flex'; }
}

function driveImgFallback(el, url) {
  el.onerror = null;
  var u = driveLh3Url(url);
  if (u && el.src !== u) { el.src = u; return; }
  el.style.display = 'none';
}

function initDayChartHover() {
  // 차트와 완전히 동일한 배열이어야 툴팁 인덱스가 맞는다
  const sorted = dayTotalsFor(calBook);
  if (!sorted.length) return;
  const n = sorted.length;

  // 역방향 연동 — 타임라인 액션 호버 시 이 차트의 기간을 표시하기 위한 기하 정보
  DC_LINK = null;
  const storeMapH = daySalesStoreFor(calBook) || {};
  const STORES_H = ['교보','예스24','알라딘','영풍'];
  // 차트 선과 완전히 동일한 색·선형태를 툴팁 표식에도 쓴다
  const SERIES_MARK = {
    '교보':   {c:'#3A5BD9', d:''},
    '예스24': {c:'#1E3A8A', d:''},
    '알라딘': {c:'#7C8794', d:'4,2'},
    '영풍':   {c:'#7C8794', d:'1.5,1.5'},
  };

  const svg = document.getElementById('day-chart-'+calBook);
  // 차트가 카드 폭에 맞춰 매번 다시 계산되므로, 좌표는 하드코딩하지 말고 viewBox에서 읽는다
  const vb = svg ? (svg.getAttribute('viewBox')||'').split(/\s+/).map(Number) : [];
  const W = vb[2] || 1200;
  const PAD_L = 44, PAD_R = 20, cW = W - PAD_L - PAD_R;
  const tt  = document.getElementById('day-tt-'+calBook);
  const hl  = document.getElementById('dhl-'+calBook);
  const ha  = document.getElementById('day-hover-'+calBook);
  if (!svg || !tt || !hl || !ha) return;

  ha.addEventListener('mousemove', function(e) {
    const r = svg.getBoundingClientRect();
    const mx = (e.clientX - r.left) * (W / r.width) - PAD_L;
    const idx = Math.min(n-1, Math.max(0, Math.round(mx / (n > 1 ? cW/(n-1) : 1))));
    const xp = PAD_L + (n > 1 ? idx/(n-1)*cW : cW/2);
    hl.setAttribute('x1', xp); hl.setAttribute('x2', xp); hl.style.opacity = '1';
    tt.style.display = 'block';
    const d = sorted[idx];
    const row = storeMapH[d.date] || null;
    const dt  = parseAnyDate(d.date);
    const dow = dt ? ['일','월','화','수','목','금','토'][dt.getDay()] : '';
    // 선이 겹치는 구간을 읽으려면 계열별 수치를 세로로 나란히 보여줘야 한다
    let html = '<div style="font-weight:800;color:var(--ink);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border)">'
      + d.date + ' <span style="color:var(--ink3);font-weight:600">(' + dow + ')</span></div>'
      + '<div style="display:flex;justify-content:space-between;gap:16px;font-weight:800;color:var(--ink);margin-bottom:'+(row?'6px':'0')+'">'
      + '<span style="display:inline-flex;align-items:center;gap:8px">'
      + '<svg width="16" height="6"><line x1="0" y1="3" x2="16" y2="3" stroke="#0F1620" stroke-width="3"/></svg>총판매</span>'
      + '<span>' + d.qty.toLocaleString() + '부</span></div>';
    if (row) {
      const tot = d.qty || 1;
      html += STORES_H.map(st => {
        const v = Number(row[st]) || 0;
        const sh = Math.round(v / tot * 100);
        const mk = SERIES_MARK[st] || {c:'#69747F', d:''};
        return '<div style="display:flex;justify-content:space-between;gap:16px;line-height:1.8">'
          + '<span style="display:inline-flex;align-items:center;gap:8px;color:var(--ink2)">'
          + '<svg width="16" height="6"><line x1="0" y1="3" x2="16" y2="3" stroke="'+mk.c+'" stroke-width="2"'
          + (mk.d ? ' stroke-dasharray="'+mk.d+'"' : '') + '/></svg>' + st + '</span>'
          + '<span style="font-weight:700;color:var(--ink)">' + v.toLocaleString()
          + '<span style="color:var(--ink3);font-weight:500;margin-left:8px">' + sh + '%</span></span></div>';
      }).join('');
    }

    // 그날 집행된 마케팅 액션 — 세로로 이어 붙이면 툴팁이 화면을 넘겨서 2단으로 배치
    const acts = (TL_LINK && TL_LINK.actByDate) ? (TL_LINK.actByDate[d.date] || []) : [];
    let actHtml = '';
    if (acts.length) {
      actHtml = '<div style="font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--ink3);'
        + 'text-transform:uppercase;margin-bottom:6px">집행 액션 ' + acts.length + '건</div>'
        + acts.map(a => {
            const c = laneColor(a.lane);
            const dayTag = a.span > 1 ? ' <span style="color:var(--ink3);font-weight:500">'+a.day+'/'+a.span+'</span>' : '';
            return '<div style="display:flex;align-items:center;gap:7px;line-height:1.75;white-space:nowrap">'
              + '<span style="width:8px;height:8px;border-radius:2px;flex-shrink:0;background:'+c.bg
              + ';border:1px solid '+c.border+'"></span>'
              + '<span style="color:var(--ink);font-weight:700">'+esc(a.label||a.lane)+'</span>'
              + dayTag + '</div>';
          }).join('');
    }

    tt.innerHTML = actHtml
      ? '<div style="display:flex;gap:18px;align-items:flex-start">'
        + '<div>' + html + '</div>'
        + '<div style="border-left:1px solid var(--border);padding-left:16px">' + actHtml + '</div>'
        + '</div>'
      : html;

    // 커서 기준으로 뷰포트 안에 들어오도록 배치 (페이지를 밀어내지 않는다)
    const vw = window.innerWidth, vh = window.innerHeight;
    const tw = tt.offsetWidth, th = tt.offsetHeight;
    let tx = e.clientX + 16;
    if (tx + tw > vw - 8) tx = e.clientX - tw - 16;
    if (tx < 8) tx = 8;
    let ty = e.clientY - th / 2;
    if (ty + th > vh - 8) ty = vh - th - 8;
    if (ty < 8) ty = 8;
    tt.style.left = tx + 'px';
    tt.style.top  = ty + 'px';

    // 타임라인의 같은 날짜 열을 함께 표시
    highlightTimelineDate(d.date);
  });
  // 날짜 → x좌표 매핑을 등록해 두면 타임라인 쪽에서 구간을 칠할 수 있다
  DC_LINK = {
    band:  document.getElementById('dcb-'+calBook),
    dates: sorted.map(d => d.date),
    xOf:   i => PAD_L + (n > 1 ? i/(n-1)*cW : cW/2),
  };

  ha.addEventListener('mouseleave', function() {
    hl.style.opacity = '0'; tt.style.display = 'none';
    clearTimelineHighlight();
  });
}

// ── 일별 추이 ↔ 마케팅 타임라인 연동 ──
// 차트에서 특정 날짜를 호버하면 타임라인의 같은 열을 표시하고,
// 그 열이 화면 밖이면 가로 스크롤로 끌어온다.
var TL_LINK = null;
var TL_LAST_IDX = -1;
// 레인 접힘 상태 — 다시 그려도 유지된다
var TL_COLLAPSED = {};
function toggleLane(lane){
  TL_COLLAPSED[lane] = !TL_COLLAPSED[lane];
  renderCalendar();
}
function toggleAllLanes(){
  var acts = MKT_ACTIONS[calBook] || [];
  var used = MKT_LANES.filter(function(l){ return acts.some(function(a){ return a.lane===l; }); });
  var anyOpen = used.some(function(l){ return !TL_COLLAPSED[l]; });
  used.forEach(function(l){ TL_COLLAPSED[l] = anyOpen; });
  renderCalendar();
}

var DC_LINK = null;

// 타임라인 액션 → 차트 구간 표시
function highlightChartRange(fromIso, toIso){
  if(!DC_LINK || !DC_LINK.band) return;
  const ds = DC_LINK.dates;
  // 구간에 걸치는 첫/마지막 데이터 지점을 찾는다 (데이터가 없는 날은 건너뜀)
  let a = -1, b = -1;
  for(let i=0;i<ds.length;i++){
    if(ds[i] >= fromIso && ds[i] <= toIso){ if(a<0) a=i; b=i; }
  }
  const band = DC_LINK.band;
  if(a < 0){ band.style.display='none'; return; }
  const x1 = DC_LINK.xOf(a), x2 = DC_LINK.xOf(b);
  const pad = 5;
  band.setAttribute('x', Math.max(0, x1 - pad));
  band.setAttribute('width', Math.max(2, (x2 - x1) + pad*2));
  band.style.display = 'block';
}
function clearChartHighlight(){
  if(DC_LINK && DC_LINK.band) DC_LINK.band.style.display='none';
}

// 액션 칩 툴팁 — body 직속 싱글턴.
// 타임라인 안에 두면 overflow 에 잘리고, .section 의 animation(transform) 때문에
// position:fixed 기준점이 뷰포트가 아니라 섹션이 되어 엉뚱한 곳에 뜬다.
var CHIP_TIP = null;
function chipTipEl(){
  if (CHIP_TIP && document.body.contains(CHIP_TIP)) return CHIP_TIP;
  CHIP_TIP = document.createElement('div');
  CHIP_TIP.className = 'tl-tooltip';
  document.body.appendChild(CHIP_TIP);
  return CHIP_TIP;
}
function showChipTip(html, ev){
  var t = chipTipEl();
  t.innerHTML = html;
  t.style.opacity = '1';
  moveChipTip(ev);
}
function moveChipTip(ev){
  var t = CHIP_TIP; if(!t) return;
  var vw = window.innerWidth, vh = window.innerHeight;
  var tw = t.offsetWidth, th = t.offsetHeight;
  var tx = ev.clientX + 14;
  if (tx + tw > vw - 8) tx = ev.clientX - tw - 14;
  if (tx < 8) tx = 8;
  var ty = ev.clientY - th - 12;        // 커서 위가 기본
  if (ty < 8) ty = ev.clientY + 18;     // 위가 좁으면 아래
  if (ty + th > vh - 8) ty = Math.max(8, vh - th - 8);
  t.style.left = tx + 'px';
  t.style.top  = ty + 'px';
}
function hideChipTip(){ if(CHIP_TIP) CHIP_TIP.style.opacity = '0'; }

function highlightTimelineDate(iso){
  if(!TL_LINK || !TL_LINK.overlay) return;
  var i = TL_LINK.dates.indexOf(iso);
  var hl = TL_LINK.overlay;
  if(i < 0){ hl.style.display='none'; TL_LAST_IDX=-1; return; }
  hl.style.display='block';
  hl.style.left  = (TL_LINK.LBL_W + i*TL_LINK.CELL_W) + 'px';
  hl.style.width = TL_LINK.CELL_W + 'px';

  // 열이 보이는 영역 밖이면 가운데로 끌어온다 (인덱스가 바뀔 때만)
  if(i !== TL_LAST_IDX){
    TL_LAST_IDX = i;
    var w = TL_LINK.wrap, x = TL_LINK.LBL_W + i*TL_LINK.CELL_W;
    var leftEdge = w.scrollLeft + TL_LINK.LBL_W;
    var rightEdge = w.scrollLeft + w.clientWidth - TL_LINK.CELL_W;
    if(x < leftEdge || x > rightEdge){
      try { w.scrollTo({left: Math.max(0, x - w.clientWidth/2), behavior:'smooth'}); }
      catch(e){ w.scrollLeft = Math.max(0, x - w.clientWidth/2); }
    }
  }
}
function clearTimelineHighlight(){
  if(TL_LINK && TL_LINK.overlay) TL_LINK.overlay.style.display='none';
  TL_LAST_IDX = -1;
}

function renderTimeline(dates, pubDate, today, actions, sales) {
  var CELL_W = 38;
  var LBL_W  = 130;
  var STORES_TL = ["교보","예스24","영풍","알라딘"];
  if(!window.tlExpanded) window.tlExpanded = {};

  var salesByDate = {};
  var hasStoreBreakdown = false;

  var storeMap = daySalesStoreFor(calBook);
  if (storeMap && Object.keys(storeMap).length) {
    // 판매량_일별_서점 — 서점별 분해
    hasStoreBreakdown = true;
    Object.keys(storeMap).forEach(function(k){
      var row = storeMap[k], entry = {};
      var total = 0;
      STORES_TL.forEach(function(st){
        var v = row[st] || 0;
        entry[st] = v; total += v;
      });
      // STORES_TL에 없는 서점도 총합에는 포함
      Object.keys(row).forEach(function(st){
        if(STORES_TL.indexOf(st) < 0) total += (row[st] || 0);
      });
      entry.total = total;
      salesByDate[k] = entry;
    });
  } else if (sales && sales.data && sales.data.length) {
    hasStoreBreakdown = true;
    sales.data.forEach(function(row) {
      var total = STORES_TL.reduce(function(s,st){ return s+(row[st]||0); }, 0);
      salesByDate[row.date] = Object.assign({total:total}, row);
    });
  } else {
    // 서점별 데이터가 없으면 총판매만 채움
    var dmap = daySalesByDate(calBook);
    Object.keys(dmap).forEach(function(k){ salesByDate[k] = {total: dmap[k]}; });
  }

  // 월 밴드 — 12가지 색 대신 2톤 교대로 리듬만 부여
  var MO_BG   = Array.from({length:12},(_,i)=> i%2===0 ? "rgba(15,22,32,.055)" : "rgba(15,22,32,.022)");
  var MO_TEXT = Array.from({length:12},()=> "#55606E");

  function wkBg(d){
    var diff=Math.floor((d-pubDate)/86400000);
    if(diff<0) return 'rgba(154,98,16,.05)';
    return Math.floor(diff/7)%2===0?'rgba(0,0,0,.012)':'rgba(0,0,0,.032)';
  }

  var wrap=document.getElementById('tl-wrap');
  if(!wrap) return;
  var savedScroll=wrap.scrollLeft||0;
  wrap.innerHTML='';
  wrap.style.cssText='overflow-x:auto;padding-bottom:8px;';
  var totalW=dates.length*CELL_W;

  // ── inner: 실제 콘텐츠 컨테이너 (relative) ──
  var inner=document.createElement('div');
  inner.style.cssText='position:relative;width:'+(LBL_W+totalW)+'px;';
  wrap.appendChild(inner);

  // ── 배경 레이어: inner 안에 absolute, 높이는 나중에 inner.scrollHeight로 설정 ──
  var bgLayer=document.createElement('div');
  bgLayer.style.cssText='position:absolute;top:0;left:'+LBL_W+'px;width:'+totalW+'px;height:100%;pointer-events:none;z-index:0;display:flex;';
  dates.forEach(function(d,idx){
    var col=document.createElement('div');
    var isWknd=d.getDay()===0||d.getDay()===6;
    col.style.cssText='width:'+CELL_W+'px;flex-shrink:0;height:100%;background:'+wkBg(d)+';box-sizing:border-box;';
    bgLayer.appendChild(col);
  });
  inner.appendChild(bgLayer);

  // 연동 하이라이트 열 — 배경 위, 콘텐츠 아래
  var hlCol=document.createElement('div');
  hlCol.style.cssText='position:absolute;top:0;bottom:0;display:none;pointer-events:none;z-index:0;'
    +'background:rgba(58,91,217,.10);border-left:1px solid var(--accent);border-right:1px solid var(--accent);';
  inner.appendChild(hlCol);

  // 날짜별 액션 색인 — 차트 툴팁에서 그날 집행 내역을 함께 보여주기 위함
  var actByDate={};
  (actions||[]).forEach(function(a){
    var st=parseAnyDate(a.date); if(!st) return;
    var span=Math.max(1, parseInt(a.days,10)||1);
    for(var k=0;k<span;k++){
      var d=new Date(st.getFullYear(), st.getMonth(), st.getDate()+k);
      var key=ymd(d);
      (actByDate[key]=actByDate[key]||[]).push({lane:a.lane, label:a.label, cost:a.cost, day:k+1, span:span});
    }
  });

  TL_LINK={wrap:wrap, inner:inner, overlay:hlCol, LBL_W:LBL_W, CELL_W:CELL_W,
           dates:dates.map(ymd), actByDate:actByDate};

  // wrap 대신 inner에 행을 추가하도록 appendRow 래퍼
  var _origAppend = null; // makeRow가 inner에 append하도록 아래서 처리

  // ── DOM 행 생성 헬퍼 ──
  function makeRow(h, lblHTML, lblStyle, noBg, showDots){
    var row=document.createElement('div');
    row.style.cssText='display:flex;min-height:'+h+'px;position:relative;';
    var lbl=document.createElement('div');
    lbl.style.cssText='width:'+LBL_W+'px;min-width:'+LBL_W+'px;flex-shrink:0;display:flex;align-items:center;padding:0 8px 0 10px;box-sizing:border-box;overflow:hidden;position:relative;z-index:1;'+(lblStyle||'');
    lbl.innerHTML=lblHTML||'';
    row.appendChild(lbl);
    var bar=document.createElement('div');
    bar.style.cssText='width:'+totalW+'px;flex-shrink:0;position:relative;min-height:'+h+'px;z-index:1;';
    if(showDots){
      dates.forEach(function(d,idx2){
        var isWknd=d.getDay()===0||d.getDay()===6;
        var dot=document.createElement('div');
        dot.style.cssText='position:absolute;left:'+(idx2*CELL_W+CELL_W-1)+'px;top:0;bottom:0;width:1px;border-right:1px dashed rgba(0,0,0,'+(isWknd?'.12':'.06')+');pointer-events:none;z-index:0;';
        bar.appendChild(dot);
      });
    }
    row.appendChild(bar);
    inner.appendChild(row);
    return {lbl:lbl,bar:bar,row:row};
  }
  function makeSectionHeader(text){
    var div=document.createElement('div');
    div.style.cssText='display:flex;height:20px;position:relative;z-index:1;';
    var l=document.createElement('div');
    l.style.cssText='width:'+LBL_W+'px;min-width:'+LBL_W+'px;flex-shrink:0;background:var(--surface3);border-top:1px solid var(--border);border-bottom:1px solid var(--border);display:flex;align-items:center;padding-left:10px;';
    l.innerHTML='<span style="font-size:10px;font-weight:800;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase;">'+text+'</span>';
    div.appendChild(l);
    var r=document.createElement('div');
    r.style.cssText='width:'+totalW+'px;background:var(--surface3);border-top:1px solid var(--border);border-bottom:1px solid var(--border);';
    div.appendChild(r);
    inner.appendChild(div);
  }

  function makeDivider(){
    var div=document.createElement('div');div.style.cssText='display:flex;height:1px;';
    var l=document.createElement('div');l.style.cssText='width:'+LBL_W+'px;min-width:'+LBL_W+'px;flex-shrink:0;background:var(--border);';div.appendChild(l);
    var r=document.createElement('div');r.style.cssText='width:'+totalW+'px;background:var(--border);';div.appendChild(r);
    inner.appendChild(div);
  }

  // ── 칩의 날짜 범위 계산 ──
  function getChipRange(a){
    var sDate=new Date(a.date),eDate=new Date(a.date);
    eDate.setDate(eDate.getDate()+(a.days||1)-1);
    var sIdx=dates.findIndex(function(d){return d.toDateString()===sDate.toDateString();});
    var eIdx=dates.findIndex(function(d){return d.toDateString()===eDate.toDateString();});
    if(sIdx<0) return null;
    if(eIdx<0) eIdx=dates.length-1;
    return {sIdx:sIdx, eIdx:eIdx};
  }

  // ── 겹침 방지: 액션 목록을 여러 줄(트랙)로 배분 ──
  function assignTracks(acts){
    var tracks=[]; // tracks[i] = 마지막 eIdx
    var result=acts.map(function(a){
      var range=getChipRange(a);
      if(!range) return {a:a,track:0,range:null};
      // 비어있는 트랙 찾기
      var placed=false;
      for(var t=0;t<tracks.length;t++){
        if(tracks[t]<range.sIdx){ // 겹치지 않음
          tracks[t]=range.eIdx;
          return {a:a,track:t,range:range};
        }
      }
      // 새 트랙
      tracks.push(range.eIdx);
      return {a:a,track:tracks.length-1,range:range};
    });
    return {items:result, trackCount:Math.max(tracks.length,1)};
  }

  // ── 칩 DOM 생성 ──
  function makeChip(bar, a, chipH, rowH, trackH, trackIdx, c, isExpandable, nextSIdx){
    var range=getChipRange(a);
    if(!range) return;
    var spanCells=range.eIdx-range.sIdx+1, spanW=spanCells*CELL_W;
    var chipTop=trackIdx*trackH+Math.round((trackH-chipH)/2);

    // 래퍼 div (툴팁 포함)
    var wrap2=document.createElement('div');
    wrap2.className='tl-chip-wrap';
    wrap2.style.cssText=[
      'position:absolute',
      'left:'+(range.sIdx*CELL_W+1)+'px',
      'width:'+(spanW-2)+'px',
      'height:'+chipH+'px',
      'top:'+chipTop+'px',
      'z-index:2',
    ].join(';');

    // 레인 색 단색. 구분은 레인 색 하나로만 하고 다른 장식은 넣지 않는다.
    var chip=document.createElement('div');
    chip.style.cssText=[
      'width:100%','height:100%',
      'background:'+c.bg,
      'border-radius:var(--r4)',
      'display:flex','align-items:center','justify-content:center',
      'overflow:hidden','box-sizing:border-box','cursor:pointer',
    ].join(';');

    // ── 액션명: 칩 안에 표시 (기존 관리 시트와 동일한 방식) ──
    // 좁은 칩(1~2일)은 2줄 줄바꿈, 넓은 칩은 1줄 가운데 정렬
    var narrow = spanCells <= 2;
    var txt = document.createElement('span');
    if(narrow){
      txt.style.cssText='padding:1px 1px;font-size:10px;line-height:1.25;font-weight:500;letter-spacing:-.01em;color:'+c.text+';'
        +'display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;'
        +'overflow:hidden;word-break:break-all;text-align:center;pointer-events:none;'
        +'flex:1;min-width:0;';
    } else {
      var fs = Math.max(9, Math.min(11, Math.floor((spanW-28)/6)));
      txt.style.cssText='padding:0 6px;font-size:'+fs+'px;font-weight:500;letter-spacing:-.005em;color:'+c.text+';'
        +'white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;'
        +'pointer-events:none;flex:1;min-width:0;';
    }
    txt.textContent=a.label;
    chip.appendChild(txt);

    // ── 역방향 연동: 이 액션에 호버하면 일별 추이에서 집행 기간을 표시 ──
    (function(){
      var from = a.date;
      var st = parseAnyDate(a.date);
      var span = Math.max(1, parseInt(a.days,10) || 1);
      var to = st ? ymd(new Date(st.getFullYear(), st.getMonth(), st.getDate()+span-1)) : from;
      wrap2.addEventListener('mouseenter', function(){ highlightChartRange(from, to); });
      wrap2.addEventListener('mouseleave', function(){ clearChartHighlight(); });
    })();

    // ── 호버 툴팁 — 집행 기간의 판매 성과를 함께 보여준다 ──
    // 타임라인이 길어지면 위 그래프가 화면 밖으로 밀리므로, 답을 여기서 바로 준다.
    var tipHTML = (function(){
      var st=parseAnyDate(a.date);
      var span=Math.max(1, parseInt(a.days,10)||1);
      var head='<div style="font-weight:800;font-size:12px;margin-bottom:2px">'+esc(a.label||a.lane)+'</div>';
      var sub=[];
      if(a.detail) sub.push(esc(a.detail));
      if(a.cost>0) sub.push(won(a.cost));
      if(sub.length) head+='<div style="opacity:.62;font-weight:500;margin-bottom:7px">'+sub.join(' · ')+'</div>';
      if(!st) return head;

      var map=daySalesByDate(calBook);
      if(!map || !Object.keys(map).length) return head;

      var dayAt=function(k){ return new Date(st.getFullYear(), st.getMonth(), st.getDate()+k); };
      var row=function(l,v,dim){ return '<div style="display:flex;justify-content:space-between;gap:18px;line-height:1.7'
        +(dim?';opacity:.62':'')+'">'
        +'<span style="opacity:.62">'+l+'</span><span style="font-weight:700">'+v+'</span></div>'; };

      // 기준선 — 집행 직전 동일 일수 평균
      var bSum=0,bCnt=0;
      for(var k=1;k<=span;k++){ var v=map[ymd(dayAt(-k))]; if(v!==undefined){ bSum+=v; bCnt++; } }
      var base=bCnt? bSum/bCnt : 0;

      // 같은 날 다른 액션이 함께 돌면 효과 귀속이 불가능하다 — 그 사실을 표시한다
      var sameDay = 0;
      if (TL_LINK && TL_LINK.actByDate) {
        var lst = TL_LINK.actByDate[ymd(st)] || [];
        sameDay = Math.max(0, lst.length - 1);
      }
      var out=head+'<div style="border-top:1px solid rgba(255,255,255,.16);padding-top:7px">';

      // 짧은 액션(2일 이하)은 효과가 다음날 이후로 밀리는 경우가 잦아
      // 하나의 숫자로 뭉치지 않고 D+0부터 날짜별로 펼쳐 보여준다.
      if(span<=2){
        var win=span+2;
        out+='<div style="opacity:.5;font-size:10px;letter-spacing:.06em;margin-bottom:4px">'
           + '집행 ' + ymd(st).slice(5).replace('-','/') + ' · 관측 D+0~D+'+(win-1)+'</div>';
        if(bCnt) out+=row('직전 '+span+'일 평균', Math.round(base).toLocaleString()+'부', true);
        var any=false, wTot=0;
        for(var k=0;k<win;k++){
          var d=dayAt(k), v=map[ymd(d)];
          if(v===undefined) continue;
          any=true; wTot+=v;
          var pct = base>0 ? Math.round((v/base-1)*100) : null;
          var col2 = pct===null ? '' : (pct>0 ? '#8FE3C0' : (pct<0 ? '#F0A0B0' : ''));
          var tag  = pct===null ? '' : ' <span style="color:'+col2+'">'+(pct>0?'+':'')+pct+'%</span>';
          out+=row('D+'+k+' ('+ymd(d).slice(5).replace('-','/')+')', v.toLocaleString()+'부'+tag);
        }
        if(!any) return head+'<div style="opacity:.62">기간 내 판매 데이터 없음</div>';
        if(a.cost>0 && wTot>0) out+=row('부당 비용', Math.round(a.cost/wTot).toLocaleString()+'원');
        out+='<div style="opacity:.42;font-size:10px;line-height:1.5;margin-top:6px">'
           + '업로드 시각에 따라 효과가 다음 날로 밀릴 수 있어 며칠치를 함께 표시합니다'
           + (sameDay ? '<br>같은 날 '+sameDay+'건이 함께 집행되어 개별 귀속은 불가합니다' : '')
           + '</div>';
        return out+'</div>';
      }

      // 기간이 긴 액션은 합계로.
      var dSum=0,dCnt=0;
      for(var k=0;k<span;k++){ var v2=map[ymd(dayAt(k))]; if(v2!==undefined){ dSum+=v2; dCnt++; } }
      if(!dCnt) return head+'<div style="opacity:.62">기간 내 판매 데이터 없음</div>';
      var avgD=dSum/dCnt;
      var diff=base>0 ? Math.round((avgD/base-1)*100) : null;

      out+='<div style="opacity:.5;font-size:10px;letter-spacing:.06em;margin-bottom:4px">'
         + ymd(st).slice(5).replace('-','/') + ' ~ ' + ymd(dayAt(span-1)).slice(5).replace('-','/')
         + ' (' + span + '일)</div>'
         + row('기간 판매', dSum.toLocaleString()+'부')
         + row('일평균', Math.round(avgD).toLocaleString()+'부');
      if(bCnt){
        out += row('직전 '+span+'일 평균', Math.round(base).toLocaleString()+'부', true);
        if(diff!==null){
          var col3 = diff>0 ? '#8FE3C0' : (diff<0 ? '#F0A0B0' : 'rgba(255,255,255,.7)');
          out += row('증감', '<span style="color:'+col3+'">'+(diff>0?'+':'')+diff+'%</span>');
        }
      }
      if(a.cost>0 && dSum>0) out += row('부당 비용', Math.round(a.cost/dSum).toLocaleString()+'원');
      if(sameDay) out += '<div style="opacity:.42;font-size:10px;line-height:1.5;margin-top:6px">'
        + '같은 날 '+sameDay+'건이 함께 집행되어 개별 귀속은 불가합니다</div>';
      return out+'</div>';
    })();

    wrap2.addEventListener('mouseenter', function(ev){ showChipTip(tipHTML, ev); });
    wrap2.addEventListener('mousemove',  moveChipTip);
    wrap2.addEventListener('mouseleave', hideChipTip);

    if(isExpandable){
      var arrow=document.createElement('span');
      arrow.style.cssText='font-size:12px;color:'+c.text+';padding:0 8px 0 2px;flex-shrink:0;transition:transform .2s;user-select:none;font-weight:900;';
      arrow.textContent=window.tlExpanded[a.date+a.lane]?'▲':'▼';
      chip.appendChild(arrow);
      chip.addEventListener('click',function(e){
        e.stopPropagation();
        window.tlExpanded[a.date+a.lane]=!window.tlExpanded[a.date+a.lane];
        renderTimeline(dates,pubDate,today,actions,sales);
        setTimeout(function(){wrap.scrollLeft=savedScroll;},10);
      });
    } else {
      chip.addEventListener('click',function(e){
        e.stopPropagation();
        openDetailPanel(a,c);
      });
    }
    wrap2.appendChild(chip);
    bar.appendChild(wrap2);
  }

  // ── 레인 행 추가 (멀티트랙) ──
  function addLaneRow(lane, acts, c, showDots){
    var TRACK_H=33, CHIP_H=31;   // 간격 2px — 밀도 우선
    var collapsed = !!TL_COLLAPSED[lane];
    var assigned=assignTracks(acts);
    var numTracks=assigned.trackCount;
    var rowH = collapsed ? 26 : numTracks*TRACK_H;

    // 라벨: 레인명 + 건수 + 접기 버튼 (한 줄)
    var lblHTML =
      '<span onclick="toggleLane(\''+lane.replace(/'/g,"\\'")+'\')" title="'+(collapsed?'펼치기':'접기')+'"'
      + ' style="display:flex;align-items:center;gap:6px;width:100%;cursor:pointer;user-select:none">'
      + '<span style="font-size:8px;color:var(--ink3);width:7px;flex-shrink:0;'
      + (collapsed?'':'transform:rotate(90deg);')+'">▶</span>'
      + '<span style="width:9px;height:9px;border-radius:2px;flex-shrink:0;background:'+c.bg+'"></span>'
      + '<span style="font-size:11px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0">'+lane+'</span>'
      + '<span style="font-size:10px;font-weight:700;color:var(--ink3);flex-shrink:0;margin-left:auto">'+acts.length+'건</span>'
      + '</span>';

    var r=makeRow(rowH, lblHTML,
      'border-left:3px solid '+c.border+';align-items:'+(collapsed?'center':'flex-start')+';padding-top:'+(collapsed?'0':'2')+'px;',
      false, showDots && !collapsed);

    // 접힌 상태 — 집행일에 얇은 표식만 남긴다 (언제 돌았는지는 계속 보이게)
    if (collapsed) {
      var hit = {};
      acts.forEach(function(a){
        var st = parseAnyDate(a.date); if(!st) return;
        var span = Math.max(1, parseInt(a.days,10)||1);
        for (var k=0;k<span;k++){
          var d = new Date(st.getFullYear(), st.getMonth(), st.getDate()+k);
          var i = dates.findIndex(function(x){ return ymd(x)===ymd(d); });
          if (i>=0) hit[i] = (hit[i]||0)+1;
        }
      });
      Object.keys(hit).forEach(function(i){
        var m=document.createElement('div');
        m.style.cssText='position:absolute;left:'+(i*CELL_W+2)+'px;top:8px;width:'+(CELL_W-4)+'px;height:10px;'
          +'border-radius:var(--r5);background:'+c.bg+';border:1px solid '+c.border+';'
          +'opacity:'+Math.min(1,.45+hit[i]*0.18)+';';
        m.title = lane+' '+hit[i]+'건';
        r.bar.appendChild(m);
      });
      return r;
    }

    // 트랙별로 다음 칩 시작 위치 계산 (바깥 라벨이 겹치지 않도록)
    var byTrack={};
    assigned.items.forEach(function(it){
      if(!it.range) return;
      (byTrack[it.track]=byTrack[it.track]||[]).push(it);
    });
    Object.keys(byTrack).forEach(function(t){
      var arr=byTrack[t].sort(function(x,y){return x.range.sIdx-y.range.sIdx;});
      arr.forEach(function(it,i){
        it.nextSIdx = (i+1<arr.length) ? arr[i+1].range.sIdx : dates.length;
      });
    });

    assigned.items.forEach(function(item){
      if(!item.range) return;
      var isExp=item.a.type==='expandable';
      makeChip(r.bar,item.a,CHIP_H,rowH,TRACK_H,item.track,c,isExp,item.nextSIdx);
    });
    return r;
  }

  // ── 날짜 파싱 (7/8 → Date) ──
  function parseMonthDay(str){
    var parts=str.trim().replace('일','').split('/');
    return new Date(2026, parseInt(parts[0])-1, parseInt(parts[1]));
  }

  // ── 소재 드롭다운 행 삽입 (wrap에 직접, 특정 행 뒤에) ──
  function insertExpandedRows(afterRow, a, c){
    if(!a.materials||!a.materials.length) return;
    var phases={},phOrder=[];
    a.materials.forEach(function(m){
      var ph=m.phase||'기타';
      if(!phases[ph]){phases[ph]=[];phOrder.push(ph);}
      phases[ph].push(m);
    });

    // afterRow.row 다음에 삽입
    var anchor=afterRow.row.nextSibling;

    phOrder.forEach(function(ph){
      // 페이즈 헤더
      var phDiv=document.createElement('div');
      phDiv.style.cssText='display:flex;height:16px;';
      var phL=document.createElement('div');
      phL.style.cssText='width:'+LBL_W+'px;min-width:'+LBL_W+'px;flex-shrink:0;background:rgba(99,102,241,.06);border-left:3px solid '+c.border+';padding-left:14px;display:flex;align-items:center;box-sizing:border-box;';
      phL.innerHTML='<span style="font-size:10px;font-weight:800;color:#55606E">'+ph+'</span>';
      phDiv.appendChild(phL);
      var phR=document.createElement('div');
      phR.style.cssText='width:'+totalW+'px;background:rgba(99,102,241,.04);border-top:1px dashed rgba(99,102,241,.2);';
      phDiv.appendChild(phR);
      inner.insertBefore(phDiv,anchor);

      // 소재 칩 행 (겹침 방지)
      var mActs=phases[ph].map(function(m){
        if(!m.days) return null;
        var parts=m.days.split('~');
        var sDt=parseMonthDay(parts[0]),eDt=parseMonthDay(parts[parts.length-1]);
        var sIdx2=dates.findIndex(function(d){return d.toDateString()===sDt.toDateString();});
        var eIdx2=dates.findIndex(function(d){return d.toDateString()===eDt.toDateString();});
        if(sIdx2<0) return null;
        if(eIdx2<0) eIdx2=sIdx2;
        return {m:m, sIdx:sIdx2, eIdx:eIdx2};
      }).filter(Boolean);

      // 트랙 배분
      var mTracks=[];
      var mAssigned=mActs.map(function(item){
        for(var t=0;t<mTracks.length;t++){
          if(mTracks[t]<item.sIdx){mTracks[t]=item.eIdx;return{item:item,track:t};}
        }
        mTracks.push(item.eIdx);
        return{item:item,track:mTracks.length-1};
      });
      var numMTracks=Math.max(mTracks.length,1);
      var MTRACK_H=18,MCHIP_H=13;
      var mRowH=numMTracks*MTRACK_H;

      var subDiv=document.createElement('div');
      subDiv.style.cssText='display:flex;min-height:'+mRowH+'px;';
      var subL=document.createElement('div');
      subL.style.cssText='width:'+LBL_W+'px;min-width:'+LBL_W+'px;flex-shrink:0;background:rgba(99,102,241,.03);border-left:3px solid '+c.border+';padding-left:18px;display:flex;align-items:flex-start;padding-top:3px;box-sizing:border-box;';
      subL.innerHTML='<span style="font-size:10px;font-weight:500;color:var(--ink3)">소재</span>';
      subDiv.appendChild(subL);
      var subR=document.createElement('div');
      subR.style.cssText='width:'+totalW+'px;position:relative;min-height:'+mRowH+'px;background:rgba(99,102,241,.03);';
      dates.forEach(function(d2,idx2){
        var bg2=document.createElement('div');
        bg2.style.cssText='position:absolute;left:'+(idx2*CELL_W)+'px;width:'+CELL_W+'px;top:0;bottom:0;background:'+wkBg(d2)+';';
        subR.appendChild(bg2);
      });

      mAssigned.forEach(function(ma){
        var item=ma.item,m=item.m,t=ma.track;
        var spanCells=item.eIdx-item.sIdx+1,spanW=spanCells*CELL_W;
        var chipTop=t*MTRACK_H+Math.round((MTRACK_H-MCHIP_H)/2);
        var subChip=document.createElement('div');
        subChip.style.cssText=[
          'position:absolute','left:'+(item.sIdx*CELL_W+1)+'px','width:'+(spanW-2)+'px',
          'height:'+MCHIP_H+'px','top:'+chipTop+'px',
          'background:rgba(99,102,241,.12)',
          'border:1px dashed rgba(99,102,241,.5)','border-radius:var(--r5)',
          'display:flex','align-items:center','overflow:hidden','z-index:2','cursor:pointer',
        ].join(';');
        subChip.title=m.label+' ('+m.days+')';
        var stxt=document.createElement('span');
        stxt.style.cssText='padding:0 4px;font-size:10px;font-weight:600;color:#55606E;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:'+(spanW-6)+'px;display:block;';
        stxt.textContent=m.label;
        subChip.appendChild(stxt);
        subChip.addEventListener('click',function(e){
          e.stopPropagation();
          openDetailPanel(Object.assign({},a,{label:m.label,detail:m.desc||'',cost:m.cost,date:m.days}),c,m);
        });
        subR.appendChild(subChip);
      });

      subDiv.appendChild(subR);
      inner.insertBefore(subDiv,anchor);
    });
  }

  // ══ 헤더 행들 ══
  var moR=makeRow(18,'','border:none;background:transparent;',true);
  var i=0;
  while(i<dates.length){
    var d=dates[i],mIdx=d.getMonth(),span=1;
    while(i+span<dates.length&&dates[i+span].getMonth()===mIdx)span++;
    var mc=document.createElement('div');
    mc.style.cssText='position:absolute;left:'+(i*CELL_W)+'px;width:'+(span*CELL_W)+'px;height:16px;top:0;background:'+MO_BG[mIdx]+';display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:'+MO_TEXT[mIdx]+';border-left:1px solid rgba(0,0,0,.08);box-sizing:border-box;';
    mc.textContent=(mIdx+1)+'월';
    moR.bar.appendChild(mc);i+=span;
  }
  var wkR=makeRow(13,'','border:none;background:transparent;',true);
  i=0;
  while(i<dates.length){
    var d=dates[i],diff=Math.floor((d-pubDate)/86400000),isPre=diff<0,wkId=Math.floor(diff/7),span=1;
    if(isPre){while(i+span<dates.length&&Math.floor((dates[i+span]-pubDate)/86400000)<0)span++;}
    else{while(i+span<dates.length){var dd2=Math.floor((dates[i+span]-pubDate)/86400000);if(dd2<0||Math.floor(dd2/7)!==wkId)break;span++;}}
    diff=Math.floor((d-pubDate)/86400000);
    var wc=document.createElement('div');
    wc.style.cssText='position:absolute;left:'+(i*CELL_W)+'px;width:'+(span*CELL_W)+'px;height:13px;top:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;font-size:10px;color:'+(isPre?'#2A44A8':'#96A1AE')+';white-space:nowrap;overflow:hidden;background:'+wkBg(d)+';';
    wc.textContent=isPre?'예약판매':(Math.floor(diff/7)+1)+'주차';
    wkR.bar.appendChild(wc);i+=span;
  }
  var dtR=makeRow(20,'','border:none;background:transparent;');
  dates.forEach(function(d,idx){
    var isPub2=d.toDateString()===pubDate.toDateString(),isT=d.toDateString()===today.toDateString();
    var cell=document.createElement('div');
    cell.style.cssText='position:absolute;left:'+(idx*CELL_W)+'px;width:'+CELL_W+'px;height:17px;top:0;display:flex;align-items:center;justify-content:center;z-index:1;';
    var num=document.createElement('div');
    if(isPub2)num.style.cssText='background:var(--accent);color:var(--accent-text);border-radius:50%;width:15px;height:15px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;';
    else num.style.cssText='font-size:11px;font-weight:'+(isT?800:400)+';color:'+(isT?'var(--bad)':'#B7C0CA')+';';
    num.textContent=d.getDate();
    cell.appendChild(num);dtR.bar.appendChild(cell);
  });
  var DOWS=["일","월","화","수","목","금","토"];
  var dowR=makeRow(15,'','border:none;background:transparent;');
  dates.forEach(function(d,idx){
    var col=d.getDay()===0?'#B3243C':d.getDay()===6?'#55606E':'#CDD4DE';
    var cell=document.createElement('div');
    cell.style.cssText='position:absolute;left:'+(idx*CELL_W)+'px;width:'+CELL_W+'px;height:13px;top:0;text-align:center;font-size:10px;font-weight:'+(d.getDay()===0||d.getDay()===6?600:400)+';color:'+col+';line-height:15px;z-index:1;';
    cell.textContent=DOWS[d.getDay()];dowR.bar.appendChild(cell);
  });

  // ══ 판매량 ══
  makeSectionHeader('판매량');

  // 누적 합계 계산
  var cumTotal=0, cumByStore={};
  STORES_TL.forEach(function(st){cumByStore[st]=0;});
  Object.values(salesByDate).forEach(function(dd){
    cumTotal+=(dd.total||0);
    STORES_TL.forEach(function(st){cumByStore[st]+=(dd[st]||0);});
  });

  // ── 총판매 행 (라벨 옆에 누적값 인라인) ──
  var totLbl='<div style="display:flex;justify-content:space-between;align-items:center;width:100%;padding:0 6px 0 0">'
    +'<span style="font-size:10px;font-weight:700;color:var(--ink2)">총판매</span>'
    +'<span style="font-size:10px;font-weight:800;color:var(--good)">'+(cumTotal?cumTotal.toLocaleString()+'부':'0부')+'</span>'
    +'</div>';
  var totR=makeRow(22,totLbl,'border-left:2px solid var(--border2,false,true);padding:0 0 0 10px;background:transparent;',false,true);

  dates.forEach(function(d,idx){
    var ds=ymd(d),dd=salesByDate[ds],val=dd?dd.total:0;
    if(!val)return;
    var cell=document.createElement('div');
    cell.style.cssText='position:absolute;left:'+(idx*CELL_W)+'px;width:'+CELL_W+'px;height:22px;top:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--ink);z-index:1;';
    cell.textContent=val;totR.bar.appendChild(cell);
  });

  // ── 서점별 행 (라벨에 누적값 표시) ── 서점별 분해 데이터가 있을 때만
  (hasStoreBreakdown ? STORES_TL : []).forEach(function(st){
    var cum=cumByStore[st];
    var stLbl='<div style="display:flex;justify-content:space-between;align-items:center;width:100%;padding:0 6px 0 0">'
      +'<span style="font-size:10px;font-weight:500;color:var(--ink3)">'+st+'</span>'
      +'<span style="font-size:10px;font-weight:700;color:var(--ink2)">'+(cum?cum.toLocaleString()+'부':'0부')+'</span>'
      +'</div>';
    var stR=makeRow(20,stLbl,'border-left:2px solid var(--border2,false,true);padding:0 0 0 16px;background:transparent;',false,true);

    dates.forEach(function(d,idx){
      var ds=ymd(d),dd=salesByDate[ds],val=dd?(dd[st]||0):0;
      if(!val)return;
      var cell=document.createElement('div');
      cell.style.cssText='position:absolute;left:'+(idx*CELL_W)+'px;width:'+CELL_W+'px;height:20px;top:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:400;color:var(--ink2);z-index:1;';
      cell.textContent=val;stR.bar.appendChild(cell);
    });
  });

  // ══ 마케팅 액션 ══
  makeSectionHeader('마케팅 액션');
  var laneGroups={},laneOrder=[];
  actions.forEach(function(a){
    if(a.label&&a.label.startsWith('└'))return;
    if(!laneGroups[a.lane]){laneGroups[a.lane]=[];laneOrder.push(a.lane);}
    laneGroups[a.lane].push(a);
  });

  laneOrder.forEach(function(lane,laneIdx){
    var acts=laneGroups[lane];
    var c=laneColor(lane);
    if(laneIdx>0) makeDivider();

    var laneRow=addLaneRow(lane,acts,c,true);

    // 드롭다운 확장 행 삽입 (해당 레인 행 바로 다음)
    acts.forEach(function(a){
      if(a.type!=='expandable') return;
      if(!window.tlExpanded[a.date+a.lane]) return;
      insertExpandedRows(laneRow,a,c);
    });
  });

  // 스크롤 복원 / 초기화
  if(savedScroll>0){
    wrap.scrollLeft=savedScroll;
  } else {
    setTimeout(function(){
      var preStart=new Date(pubDate);preStart.setDate(preStart.getDate()-10);
      var scrollIdx=dates.findIndex(function(d){return d.toDateString()===preStart.toDateString();});
      if(scrollIdx>=0) wrap.scrollLeft=Math.max(0,scrollIdx*CELL_W-4);
    },50);
  }
}

  panel.scrollIntoView({behavior:'smooth', block:'nearest'});
}

   출간 관리 (출판팀)
───────────────────────────────────── */
function renderPublish(){
  const el = document.getElementById('tab-publish');
  if (!PUB_BOOKS.length) {
    el.innerHTML = `<div class="card gap"><div class="card-title">출간 관리</div>
      <div class="empty-row">출간 기획 시트를 불러오지 못했습니다. 시트 공유 설정과 GID를 확인해 주세요.</div></div>`;
    return;
  }
  const today = new Date(); today.setHours(0,0,0,0);
  const dday = d => d ? Math.round((d - today)/86400000) : null;
  const ym   = document.getElementById('monthPicker').value.slice(0,7);

  // 제작 관점이므로 입고일을 기준으로 본다. 입고일이 없으면 배본일로 대체.
  const keyDate = b => b.inDate || b.ship;
  const live = PUB_BOOKS.filter(b => keyDate(b) && keyDate(b) >= today)
                        .sort((a,b)=>keyDate(a)-keyDate(b));
  const thisMonth = PUB_BOOKS.filter(b => keyDate(b) && ymd(keyDate(b)).slice(0,7) === ym);
  const yearBooks = PUB_BOOKS.filter(b => b.ship && String(b.ship.getFullYear()) === ym.slice(0,4));
  const soon = live.filter(b => dday(keyDate(b)) <= 21);

  // 현재 단계 = 오늘 이전 마지막 완료 단계
  const stageOf = b => {
    const done = b.stages.filter(s => s.date <= today);
    const next = b.stages.filter(s => s.date > today);
    return {done: done.length ? done[done.length-1] : null, next: next.length ? next[0] : null, cnt: done.length};
  };

  /* 공정 트랙 — 회의 3단계 / 제작 7단계를 나눠서 표시 */
  function stepBar(b){
    const set = {}; b.stages.forEach(s => { set[s.key] = s.date; });
    const doneKeys = b.stages.filter(s => s.date <= today).map(s => s.key);
    const cur = doneKeys.length ? doneKeys[doneKeys.length-1] : null;
    const seg = st => {
      const d = set[st.key];
      const state = !d ? 'none' : (d <= today ? 'done' : 'plan');
      const isCur = st.key === cur;
      const bg = state==='done' ? (isCur ? 'var(--accent-deep)' : 'var(--accent)')
               : (state==='plan' ? '#C6D2F7' : 'var(--surface3)');
      const col = isCur ? 'var(--ink)' : (state==='none' ? 'var(--ink3)' : 'var(--ink2)');
      return `<div title="${st.key}${d?' · '+ymd(d).slice(5):'  미정'}" style="flex:1;min-width:0">
        <div style="height:${isCur?8:6}px;border-radius:var(--r5);background:${bg}"></div>
        <div style="font-size:9px;line-height:1.3;margin-top:3px;text-align:center;white-space:nowrap;
          overflow:hidden;text-overflow:ellipsis;color:${col};font-weight:${isCur?800:500}">${st.key}</div>
      </div>`;
    };
    return `<div style="display:flex;gap:14px;align-items:flex-end">
      ${PUB_STAGE_GROUPS.map((g,gi)=>`
        <div style="flex:${g.keys.length};min-width:0">
          <div style="display:flex;gap:3px;align-items:flex-end">${g.keys.map(seg).join('')}</div>
        </div>
        ${gi < PUB_STAGE_GROUPS.length-1 ? '<div style="width:1px;align-self:stretch;background:var(--border);margin-bottom:14px"></div>' : ''}
      `).join('')}
    </div>`;
  }

  /* 월별 입고 예정 — 특정 달에 몰리면 제작 리소스가 분산된다 */
  function shipByMonth(){
    const cnt = {};
    live.forEach(b => { const k = ymd(keyDate(b)).slice(0,7); cnt[k] = (cnt[k]||0)+1; });
    const keys = Object.keys(cnt).sort().slice(0,12);
    if(!keys.length) return `<div class="empty-row">입고 예정이 없습니다</div>`;
    const mx = Math.max(...keys.map(k=>cnt[k]));
    return `<div style="display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:8px">
      ${keys.map(k=>{
        const h = Math.max(4, cnt[k]/mx*112);
        const cur = k === ym;
        return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0">
          <div style="font-size:11px;font-weight:${cur?800:700};color:${cur?'var(--ink)':'var(--ink2)'}">${cnt[k]}</div>
          <div class="bar-grow" style="--w:100%;height:${h}px;width:100%;border-radius:var(--r4) var(--r4) 0 0;
            background:${cur?'var(--accent)':'var(--border2)'}"></div>
          <div style="font-size:10px;font-weight:${cur?800:400};color:${cur?'var(--ink)':'var(--ink3)'};white-space:nowrap">${k.slice(2).replace('-','.')}</div>
        </div>`;
      }).join('')}
    </div>`;
  }

  /* 공정 단계 분포 — 파이프라인이 어디에 몰려 있나 */
  function stageDist(){
    const buckets = [
      {label:'미착수',   test: b => b.stages.filter(s=>s.date<=today).length === 0},
      {label:'기획·회의', test: b => { const d=b.stages.filter(s=>s.date<=today).map(s=>s.key); return d.length>0 && !d.some(k=>['조판','PC교','1교','2교','3교','발주','입고'].includes(k)); }},
      {label:'교정 중',   test: b => { const d=b.stages.filter(s=>s.date<=today).map(s=>s.key); return d.some(k=>['조판','PC교','1교','2교','3교'].includes(k)) && !d.includes('발주'); }},
      {label:'발주·입고', test: b => b.stages.some(s=>s.date<=today && (s.key==='발주'||s.key==='입고'))},
    ];
    const rows = buckets.map(bk => ({label:bk.label, n: live.filter(bk.test).length}));
    const sum = rows.reduce((a,r)=>a+r.n,0) || 1;
    return rows.map((r,i)=>`<div style="display:flex;align-items:center;gap:12px;padding:8px 0${i?';border-top:1px solid var(--border)':''}">
      <div style="width:72px;font-size:12px;font-weight:700;color:var(--ink);flex-shrink:0">${r.label}</div>
      <div style="flex:1;height:12px;background:var(--surface3);border-radius:var(--r5);overflow:hidden">
        <div class="bar-grow" style="--w:${r.n/sum*100}%;--d:${i*60}ms;height:12px;background:var(--accent)"></div>
      </div>
      <div style="width:34px;text-align:right;font-size:12px;font-weight:800;color:var(--ink)">${r.n}종</div>
      <div style="width:34px;text-align:right;font-size:11px;color:var(--ink3)">${Math.round(r.n/sum*100)}%</div>
    </div>`).join('');
  }

  /* 외서 계약 만료 임박 */
  function rightsCard(){
    if(!CFG.pubGids.rights) return `<div class="card gap2" style="border-left:3px solid var(--border2)">
      <div class="card-title">외서 계약 <small>연동 대기</small></div>
      <div style="font-size:12px;color:var(--ink2);line-height:1.7">
        코드의 <b>pubGids.rights</b> 에 외서 계약 탭의 GID를 넣으면 계약 만료 임박 건이 여기에 표시됩니다.</div></div>`;
    const rows = PUB_RIGHTS.map(r=>({
      title: String(r['도서명']||'').trim(),
      agency: String(r['에이전시']||'').trim(),
      pic: String(r['담당자']||'').trim(),
      end: parseAnyDate(r['종료일']),
    })).filter(r=>r.end);
    const expired = rows.filter(r=>dday(r.end) < 0).length;
    const near = rows.filter(r=>dday(r.end) >= 0 && dday(r.end) <= 180).sort((a,b)=>a.end-b.end);
    if(!near.length && !expired) return '';
    return `<div class="card gap2" style="border-left:3px solid ${near.length?'var(--bad)':'var(--border2)'}">
      <div class="card-title">외서 계약 만료 임박 <small>재계약 검토가 필요한 건</small></div>
      ${near.length ? `<table>
        <tr><th style="width:80px">남은 기간</th><th>도서명</th><th style="width:150px">에이전시</th><th class="right" style="width:110px">종료일</th></tr>
        ${near.slice(0,8).map(r=>{
          const d = dday(r.end);
          const col = d<=30 ? 'var(--bad)' : (d<=90 ? 'var(--warn)' : 'var(--ink2)');
          return `<tr><td><b style="color:${col};font-size:12px">D-${d}</b></td>
            <td style="font-size:12px"><b>${esc(r.title)}</b></td>
            <td style="font-size:12px;color:var(--ink2)">${esc(r.agency)}${r.pic?' · '+esc(r.pic):''}</td>
            <td class="right" style="font-size:12px;color:var(--ink2)">${ymd(r.end)}</td></tr>`;
        }).join('')}
      </table>` : ''}
      ${expired ? `<div style="font-size:11px;color:var(--ink3);margin-top:10px">이미 만료된 계약 ${expired}건 — 시트에서 정리 필요</div>` : ''}
    </div>`;
  }

  el.innerHTML = `
    <div class="g3 gap">
      ${(()=>{ const done = yearBooks.filter(b=>b.ship < today).length;
        const pct = yearBooks.length ? Math.round(done/yearBooks.length*100) : 0;
        return `<div class="kpi"><div class="kpi-lbl">${ym.slice(0,4)}년 출간</div>
        <div class="kpi-val">${done}<span style="font-size:19px;font-weight:700">종</span><span style="font-size:19px;font-weight:700;color:var(--ink3)"> / ${yearBooks.length}종</span></div>
        <div class="kpi-sub">계획 대비 ${pct}% · 배본일 기준</div>
        <div class="kpi-bar-wrap" style="height:4px;background:var(--ink5);border-radius:2px;margin-top:10px;overflow:hidden"><div class="bar-grow" style="--w:${pct}%;height:4px;background:var(--accent);border-radius:2px"></div></div></div>`; })()}
      <div class="kpi"><div class="kpi-lbl">당월 입고</div>
        <div class="kpi-val">${thisMonth.length}<span style="font-size:19px;font-weight:700">종</span></div>
        <div class="kpi-sub">${ym} · 입고일 기준</div></div>
      <div class="kpi"><div class="kpi-lbl">입고 임박</div>
        <div class="kpi-val ${soon.length?'bad':''}">${soon.length}<span style="font-size:19px;font-weight:700">종</span></div>
        <div class="kpi-sub">3주 이내 입고</div></div>
    </div>

    <div class="card gap">
      <div class="card-title">제작 진행 현황 <small>입고일 순 · 회의 3단계 / 제작 7단계</small></div>
      ${live.length ? `<table>
        <tr><th style="width:92px">입고일</th><th style="width:220px">도서</th>
            <th>진행 · 공정 단계</th><th style="width:190px">담당</th></tr>
        ${live.slice(0,25).map(b=>{
          const kd = keyDate(b), d = dday(kd);
          const st = stageOf(b);
          const col = d<=7 ? 'var(--bad)' : (d<=21 ? 'var(--warn)' : 'var(--ink2)');
          const who = [['기획',b.plan],['마케터',b.mkter],['디자인',b.design]]
            .filter(([,v]) => v)
            .map(([k,v]) => `<span style="white-space:nowrap">`
              + `<span style="color:var(--ink3);font-size:10px">${k}</span> `
              + `<b style="color:var(--ink);font-weight:700">${esc(v)}</b></span>`)
            .join('<span style="color:var(--border2);margin:0 5px">·</span>');
          return `<tr>
            <td style="vertical-align:top">
              <b style="font-size:13px;color:var(--ink);letter-spacing:-.01em">${ymd(kd).slice(5).replace('-','/')}</b>
              ${!b.inDate ? '<div style="font-size:9px;color:var(--ink3);line-height:1.3">배본일 기준</div>' : ''}
              <div style="font-size:10px;font-weight:700;color:${col};margin-top:1px">D-${d}</div>
              <div style="font-size:10px;color:var(--ink3);margin-top:3px">
                ${b.ship ? `배본 ${ymd(b.ship).slice(5).replace('-','/')}` : '<span style="color:var(--ink3)">배본 미정</span>'}</div></td>
            <td style="vertical-align:top">
              <div style="font-size:12px;font-weight:800;color:var(--ink);line-height:1.4">${esc(b.title)}</div>
              <div style="font-size:11px;color:var(--ink2);line-height:1.5">${esc(b.author)||'<span style="color:var(--ink3)">저자 미정</span>'}${b.trans?`<span style="color:var(--ink3)"> / 역 ${esc(b.trans)}</span>`:''}</div>
              <div style="font-size:10px;color:var(--ink3);line-height:1.5">${esc(b.genre)}</div></td>
            <td>${stepBar(b)}
              <div style="display:flex;justify-content:space-between;gap:10px;font-size:10px;color:var(--ink3);margin-top:5px">
                <span>${st.done ? `진행 <b style="color:var(--ink2)">${esc(st.done.key)}</b>` : '미착수'}</span>
                <span>${st.next ? `다음 ${esc(st.next.key)} ${ymd(st.next.date).slice(5)}` : ''}</span>
                <span>${st.cnt}/${PUB_STAGES.length}</span>
              </div></td>
            <td style="font-size:11px;color:var(--ink2);vertical-align:top;line-height:1.9">${who||'<span style="color:var(--ink3)">미배정</span>'}</td>
          </tr>`;
        }).join('')}
      </table>` : `<div class="empty-row">입고 예정 도서가 없습니다</div>`}
    </div>

    <div class="g2 gap">
      <div class="card"><div class="card-title">월별 입고 예정 <small>한 달에 몰리면 제작 리소스가 분산됩니다</small></div>${shipByMonth()}</div>
      <div class="card"><div class="card-title">공정 단계 분포 <small>진행 중 도서가 어느 구간에 있는지</small></div>${stageDist()}</div>
    </div>

    ${rightsCard()}`;
}

function renderData(){
  const rule = (n,t) => `<tr><td style="width:22px;color:var(--ink3);font-size:11px;font-weight:800">${n}</td><td style="font-size:12px;color:var(--ink2);line-height:1.7">${t}</td></tr>`;
  const card = (title, sub, body) => `
    <div class="card gap2">
      <div class="card-title">${title}${sub?` <small>${sub}</small>`:''}</div>
      ${body}
    </div>`;
  const cols = rows => `<table><tr><th style="width:150px">열</th><th>입력 내용</th></tr>${
    rows.map(([c,d])=>`<tr><td><b style="font-size:12px">${c}</b></td><td style="font-size:12px;color:var(--ink2)">${d}</td></tr>`).join('')}</table>`;

  const syncTxt = (document.getElementById('syncTxt')||{}).textContent || '-';
  const gidCount = Object.keys(CFG.gids).length;

  document.getElementById('tab-data').innerHTML=`
    <div class="g4 gap">
      <div class="kpi"><div class="kpi-lbl">연동 상태</div><div class="kpi-val" style="font-size:22px">${SD.loaded?'정상':'대기'}</div><div class="kpi-sub">${esc(syncTxt)}</div></div>
      <div class="kpi"><div class="kpi-lbl">연동 시트</div><div class="kpi-val">${gidCount}<span style="font-size:19px;font-weight:700">개</span></div><div class="kpi-sub">대시보드 + 캠페인</div></div>
      <div class="kpi"><div class="kpi-lbl">등록 도서</div><div class="kpi-val">${BOOKS.length}<span style="font-size:19px;font-weight:700">종</span></div><div class="kpi-sub">도서 목록 기준</div></div>
      <div class="kpi"><div class="kpi-lbl">캠페인 운영</div><div class="kpi-val">${MKT_BOOKS.length}<span style="font-size:19px;font-weight:700">종</span></div><div class="kpi-sub">00_설정 노출여부 Y</div></div>
    </div>

    <div class="card gap">
      <div class="card-title">입력 3원칙 <small>이것만 지키면 대부분의 오류가 안 생깁니다</small></div>
      <table>
        ${rule(1,'<b style="color:var(--ink)">도서는 ISBN으로 연결됩니다.</b> 도서명이 아닙니다. 신간은 <b>도서 목록</b> 탭에 먼저 등록해야 다른 탭 데이터가 붙습니다.')}
        ${rule(2,'<b style="color:var(--ink)">표기가 다르면 별칭을 등록합니다.</b> 출고 데이터의 도서명이 도서 목록과 다르면(리커버·절판·진중문고 등) 도서 목록 <b>N열(출고표기명)</b>에 그 표기를 적습니다. 여러 개면 쉼표로 구분합니다.')}
        ${rule(3,'<b style="color:var(--ink)">회색 탭은 건드리지 않습니다.</b> 아래 표에서 <span class="badge neutral">자동</span> 표시된 탭은 수식으로 만들어집니다. 값을 직접 입력하면 수식이 지워집니다.')}
      </table>
    </div>

    <div class="sec-label gap2">대시보드 시트</div>
    <div class="card gap">
      <table>
        <tr><th>탭</th><th>역할</th><th>입력</th></tr>
        ${[
          ['도서 목록','전 도서 마스터. 모든 연결의 기준','수기'],
          ['출고 RAW','서점별 출고·반품 원천 데이터','붙여넣기'],
          ['판매량 RAW','서점별 실판매 원천 데이터','붙여넣기'],
          ['02_비용원장','비용 건별 입력','수기'],
          ['00_설정','연 목표·비밀번호·채널 링크','수기'],
          ['03_출고실적','출고 RAW 월별 집계','자동'],
          ['04_마케팅실적','판매량 RAW 월별 집계','자동'],
          ['05_채널실적','채널 지표','수기'],
          ['판매량_주차별 / _일별_서점','판매량 RAW 집계','자동'],
        ].map(([n,d,w])=>`<tr><td><b>${n}</b></td><td style="font-size:12px;color:var(--ink2)">${d}</td><td><span class="badge ${w==='자동'?'neutral':w==='붙여넣기'?'info':'acc'}">${w}</span></td></tr>`).join('')}
      </table>
    </div>

    ${card('도서 목록', '신간이 나오면 여기부터', cols([
      ['A · ISBN','13자리. <b>비우면 안 됩니다.</b> 이 값으로 모든 탭이 연결됩니다'],
      ['B · 도서명','대시보드에 표시되는 이름'],
      ['C · 내부 관리 코드','공백 없는 식별용 코드'],
      ['F · 출간일','YYYY. M. D'],
      ['H · 정가','숫자만'],
      ['I · 전략도서 여부','TRUE / FALSE. TRUE인 도서만 본부 종합의 관리 신간에 표시'],
      ['J~M · 과거출고/판매','<b>2024년 이전 출간 도서만</b> 입력. 2025년 이후 출간 도서는 비워두세요. 채우면 실적이 두 번 더해집니다'],
      ['N · 출고표기명','출고 데이터에서 다르게 쓰이는 이름. 여러 개는 쉼표 구분'],
    ]))}

    ${card('출고 RAW / 판매량 RAW', '매월 붙여넣기', `
      <table>
        ${rule('','원천 파일을 <b>마지막 행 아래에 이어서</b> 붙여넣습니다. 기존 행을 덮어쓰지 마세요')}
        ${rule('','붙여넣은 뒤 <b>S열(ISBN)</b> 수식이 마지막 행까지 채워졌는지 확인합니다')}
        ${rule('','S열을 <b>미매칭</b>으로 필터링해서 걸리는 도서가 있으면, 도서 목록에 신간 등록이 빠졌거나 표기가 다른 경우입니다')}
      </table>`)}

    ${card('02_비용원장', '도서별 손익을 보려면 여기가 핵심', cols([
      ['귀속팀','마케팅 / 출판 / 기타. 본부 단위 비용 집계 기준'],

// ── 생일·입사 기념일 축하 ──
// 하루에 한 번만. 해당자가 없으면 아무것도 하지 않는다.
function celebrate(){
  if (!MEMBERS.length) return;
  var now = new Date();
  var md  = ('0'+(now.getMonth()+1)).slice(-2) + '-' + ('0'+now.getDate()).slice(-2);
  var key = 'feelm-celebrate-' + now.getFullYear() + '-' + md;
  try { if (localStorage.getItem(key)) return; } catch(e) {}

  var birth = MEMBERS.filter(function(m){ return m.birth === md; });
  var anniv = MEMBERS.filter(function(m){
    if (m.joinedMD !== md || !m.joinYear) return false;
    return now.getFullYear() > +m.joinYear;      // 입사 당해는 제외
  });
  if (!birth.length && !anniv.length) return;

  var line = function(m, sub){
    return '<div style="display:flex;align-items:baseline;gap:10px;padding:9px 0;border-top:1px solid var(--border)">'
      + '<b style="font-size:17px;font-weight:800;color:var(--ink);letter-spacing:-.01em">' + esc(m.name) + '</b>'
      + (m.team ? '<span style="font-size:12px;color:var(--ink3)">' + esc(m.team) + '</span>' : '')

// 같은 연도 배열만 있으므로 전년은 시트에 없으면 표시하지 않는다
function cmpDelta(arr, i){
  if (CMP === 'none' || !arr) return null;
  if (CMP === 'prev') {
    if (i <= 0 || !arr[i-1]) return null;
    return {base: arr[i-1], pct: (arr[i]/arr[i-1]-1)*100, label:'전월'};
  }
  return null;                          // 전년 데이터는 별도 시트가 있어야 가능
}
function cmpTag(arr, i, lowerIsBetter){
  const d = cmpDelta(arr, i);
  if (!d) return '';
  const good = lowerIsBetter ? d.pct <= 0 : d.pct >= 0;
  return `<span style="font-size:11px;font-weight:700;color:${good?'var(--good)':'var(--bad)'};margin-left:6px">
    ${d.pct>=0?'▲':'▼'} ${Math.abs(d.pct).toFixed(1)}%</span>

}

/* ── 차트 PNG 저장 ── */
// 화면의 SVG 를 그대로 PNG 로 굽는다. 외부 라이브러리 없이 동작한다.
function svgToPng(svgEl, filename, scale){
  if (!svgEl) { alert('저장할 차트를 찾지 못했습니다.'); return; }

  // 크기 — viewBox 를 우선 쓰되 없거나 이상하면 실제 표시 크기로
  const vb = (svgEl.getAttribute('viewBox') || '').trim().split(/[\s,]+/).map(Number);
  const box = svgEl.getBoundingClientRect();
  let w = (vb.length === 4 && vb[2] > 0) ? vb[2] : 0;
  let h = (vb.length === 4 && vb[3] > 0) ? vb[3] : 0;
  if (!w || !h) { w = Math.round(box.width) || 1000; h = Math.round(box.height) || 300; }
  if (w < 60 || h < 40) { alert('이 차트는 너무 작아 저장할 수 없습니다.'); return; }

  const k = scale || 2;
  const pad = 34;                                   // 하단 표식 자리

  // 원본을 복제하고, 클래스로만 칠해진 부분을 실제 색으로 굳힌다.
  // 직렬화하면 문서 스타일시트가 따라가지 않아 색이 전부 빠지기 때문.
  const clone = svgEl.cloneNode(true);
  const live = svgEl.querySelectorAll('*');
  const copy = clone.querySelectorAll('*');
  const PROPS = ['fill','stroke','stroke-width','stroke-dasharray','stroke-dashoffset',
                 'stroke-linecap','stroke-linejoin','opacity','fill-opacity','stroke-opacity',
                 'stop-color','stop-opacity','font-size','font-weight','font-family',
                 'letter-spacing','text-anchor','dominant-baseline','transform','visibility','display'];
  for (let i = 0; i < live.length && i < copy.length; i++){
    const cs = getComputedStyle(live[i]);
    let css = '';
    PROPS.forEach(pn => {
      const v = cs.getPropertyValue(pn);
      if (v && v !== 'none' || pn === 'fill' || pn === 'stroke') css += `${pn}:${v};`;
    });
    // 애니메이션 도중이면 최종 상태로 굳힌다
    copy[i].setAttribute('style', css);
    copy[i].removeAttribute('class');
  }
  clone.setAttribute('width', w);
  clone.setAttribute('height', h);
  if (!clone.getAttribute('viewBox')) clone.setAttribute('viewBox', `0 0 ${w} ${h}`);
  clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');

  const cs = getComputedStyle(document.documentElement);
  let src = new XMLSerializer().serializeToString(clone);
  src = src.replace(/var\((--[a-z0-9-]+)[^)]*\)/gi, (m0, name) => (cs.getPropertyValue(name) || '#888').trim());

  const img = new Image();
  const url = URL.createObjectURL(new Blob([src], {type:'image/svg+xml;charset=utf-8'}));
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = w * k; c.height = (h + pad) * k;
    const g = c.getContext('2d');
    g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, c.width, c.height);
    g.drawImage(img, 0, 0, w * k, h * k);
    g.font = `700 ${11*k}px "Pretendard", sans-serif`;
    g.fillStyle = 'rgba(15,22,32,.45)';
    g.textAlign = 'right';
    g.fillText('대외비 · 콘텐츠사업본부 · ' + ymd(new Date()), c.width - 12*k, c.height - 12*k);
    c.toBlob(b => {
      if (!b) { alert('이미지를 만들지 못했습니다.'); URL.revokeObjectURL(url); return; }
      const a2 = document.createElement('a');
      a2.href = URL.createObjectURL(b);
      a2.download = (filename || 'chart') + '.png';
      document.body.appendChild(a2); a2.click(); document.body.removeChild(a2);
      setTimeout(() => URL.revokeObjectURL(a2.href), 1000);
      URL.revokeObjectURL(url);
    }, 'image/png');
  };
  img.onerror = () => { URL.revokeObjectURL(url); alert('이미지로 저장하지 못했습니다.'); };
  img.src = url;
}
// 버튼이 속한 카드 안의 첫 SVG 를 저장
function savePng(btn, name){
  const card = btn.closest('.card') || document;
  // 카드 안에 아이콘용 작은 SVG 가 섞여 있어 첫 번째를 집으면 엉뚱한 게 저장된다.
  // 화면에서 가장 넓은 SVG 를 실제 차트로 본다.
  let best = null, area = 0;
  card.querySelectorAll('svg').forEach(el => {
    const b = el.getBoundingClientRect();
    const a2 = b.width * b.height;
    if (b.width >= 200 && a2 > area) { area = a2; best = el; }
  });
  if (!best) { alert('저장할 차트를 찾지 못했습니다.'); return; }
  svgToPng(best, name || 'chart');
}
function pngBtn(name){
  return `<button onclick="savePng(this,'${name}')" title="PNG 로 저장"
    style="border:1px solid var(--border2);background:var(--surface);color:var(--ink2);border-radius:var(--r3);
    padding:5px 10px;font-family:var(--sans);font-size:11px;font-weight:700;cursor:pointer">PNG</button>`;
}

/* ── 주간 보고 자동 생성 ── */
function weekReportText(){
  const m = getM();
  const ym = document.getElementById('monthPicker').value.slice(0,7);
  const Y = +ym.slice(0,4);
  const today = new Date(); today.setHours(0,0,0,0);
  const from = new Date(today); from.setDate(from.getDate() - 6);
  const dd = d => ymd(d).slice(5).replace('-','/');
  const L = [];

  L.push(`[콘텐츠사업본부] 주간 리포트 ${dd(from)}~${dd(today)}`);
  L.push('');

  // 실적
  const net = M_NET_SALES[m]||0, tgt = M_TARGET[m]||0;
  const cs  = costSplit(m), prof = net - cs.total;
  const ach = tgt ? Math.round(net/tgt*100) : null;
  L.push(`■ ${ym} 실적`);
  L.push(`순매출 ${won(net)}${ach!=null?` (목표 대비 ${ach}%)`:''} · 비용 ${won(cs.total)} · 손익 ${prof>=0?'+':''}${won(prof)}`);
  const rr = net>0 ? (M_RETURN[m]||0)/((M_SHIP_SALES[m]||0)||1)*100 : 0;
  const rrPrev = m>0 && M_SHIP_SALES[m-1] ? (M_RETURN[m-1]||0)/M_SHIP_SALES[m-1]*100 : null;
  L.push(`반품률 ${rr.toFixed(1)}%${rrPrev!=null?` (전월 ${rrPrev.toFixed(1)}%)`:''}`);

  // 인당 생산성
  const avgN = avgHeadcount(Y, m);
  if (avgN) {
    const cumNet = M_NET_SALES.slice(0,m+1).reduce((a,b)=>a+b,0);
    L.push(`인당 순매출 ${won(Math.round(cumNet/avgN))} (평균 ${avgN.toFixed(1)}명)`);
  }
  L.push('');

  // 출고 TOP
  const top = (BOOKS||[]).filter(b=>b.mShipAmt>0).sort((a,b)=>b.mShipAmt-a.mShipAmt).slice(0,3);
  if (top.length) {
    L.push('■ 당월 출고 상위');
    top.forEach((b,i)=>L.push(`${i+1}. ${b.title} ${won(b.mShipAmt)}`));
    L.push('');
  }

  // 배본 임박
  const soon = (PUB_BOOKS||[]).filter(b=>{
    const d = b.inDate || b.ship;
    return d && d >= today && (d - today)/86400000 <= 21;
  }).sort((a,b)=>(a.inDate||a.ship)-(b.inDate||b.ship));
  if (soon.length) {
    L.push('■ 입고 임박 (3주)');
    soon.slice(0,5).forEach(b=>{
      const d = b.inDate || b.ship;
      L.push(`· ${b.title} D-${Math.round((d-today)/86400000)} (${ymd(d).slice(5).replace('-','/')})`);
    });
    L.push('');
  }

  // 채널
  const chRows = (CH_PERF||[]).map(c=>({
    acct:c.acct, fol:(c.items['팔로워']||[])[m]||0, diff:(c.items['증감']||[])[m]||0,
    reach:((c.items['도달']||[])[m]||0)||((c.items['도달(조회수)']||[])[m]||0)}));
  if (chRows.length) {
    const dsum = chRows.reduce((a,r)=>a+r.diff,0), rsum = chRows.reduce((a,r)=>a+r.reach,0);
    L.push('■ 채널');
    L.push(`팔로워 순증 ${dsum>=0?'+':''}${dsum.toLocaleString()} · 도달 ${fmtAmt(rsum)}`);
    const best = (CH_CONTENT||[]).filter(c=>c.up && c.up>=from).sort((a,b)=>b.reach-a.reach)[0];
    if (best) L.push(`주간 최고 콘텐츠: ${best.title} (${best.ch}) ${best.reach.toLocaleString()}`);
    L.push('');
  }

  // 확인 필요
  const warn = [];
  FRESH_SPEC.forEach(sp=>{ const f=freshScore(sp.key); if(f && f.pct<70) warn.push(`${f.label} ${f.gap}일 지연`); });
  const gaps = rosterGapMonths(Y, m);
  if (gaps.length) warn.push('구성원 퇴사 이력 누락 — 인당 지표 과대');
  if (warn.length) { L.push('■ 확인 필요'); warn.forEach(w=>L.push(`· ${w}`)); }

  return L.join('\n').replace(/\n{3,}/g,'\n\n').trim();
}

/* ── 이상치 감지 ── */
// 최근 6개월 평균 대비 크게 벗어난 값만 짚는다. 표를 훑지 않아도 되게.
function anomalies(){
  const m = getM();
  const ym = document.getElementById('monthPicker').value.slice(0,7);
  const out = [];
  const hist = (arr, i, n) => {
    const v = [];
    for (let k = Math.max(0, i-n); k < i; k++) if (arr[k]) v.push(arr[k]);
    return v;
  };
  const chk = (label, arr, i, opt) => {
    const h = hist(arr, i, 6);
    if (h.length < 3 || !arr[i]) return;
    const avg = h.reduce((a,b)=>a+b,0)/h.length;
    if (!avg) return;
    const r = arr[i]/avg;
    if (r >= 1.6 || r <= 0.62) {
      out.push({label, cur:arr[i], avg, ratio:r, fmt:opt&&opt.fmt, good:(opt&&opt.lowerIsBetter) ? r<1 : r>1});
    }
  };
  const retRate = MONTHS.map((_,i)=> (M_SHIP_SALES[i] ? (M_RETURN[i]||0)/M_SHIP_SALES[i]*100 : 0));
  chk('반품률', retRate, m, {fmt:'pct', lowerIsBetter:true});
  chk('순매출', M_NET_SALES, m, {fmt:'won'});
  chk('총비용', MONTHS.map((_,i)=>costSplit(i).total), m, {fmt:'won', lowerIsBetter:true});

  // 채널 도달 급변
  (CH_PERF||[]).forEach(c=>{
    const a = (c.items['도달']||[]).map((v,i)=>v || (c.items['도달(조회수)']||[])[i] || 0);
    const h = hist(a, m, 4);
    if (h.length < 2 || !a[m]) return;
    const avg = h.reduce((x,y)=>x+y,0)/h.length;
    if (!avg) return;
    const r = a[m]/avg;
    if (r >= 1.8 || r <= 0.5) out.push({label:c.acct+' 도달', cur:a[m], avg, ratio:r, fmt:'num', good:r>1});
  });

  return out.sort((a,b)=>Math.abs(Math.log(b.ratio))-Math.abs(Math.log(a.ratio))).slice(0,6);
}
function anomalyCard(){
  const list = anomalies();
  if (!list.length) return '';
  const f = (v, k) => k==='pct' ? v.toFixed(1)+'%' : (k==='num' ? Math.round(v).toLocaleString() : won(Math.round(v)));
  return `<div class="card gap">

function royRounds(){
  // 지금 판매가 쌓이고 있는 회차부터 과거로 8회차.
  // 1=상반기분(그해 7월 지급) 2=하반기분(다음해 1월 지급)
  const out = [];
  const now = new Date();
  const nowYm = ymd(now).slice(0,7);
  let y = now.getFullYear(), h = (now.getMonth() + 1) >= 7 ? 2 : 1;
  for (let i = 0; i < 8; i++){
    const coverStart = h === 1 ? `${y}-01` : `${y}-07`;
    const coverEnd   = h === 1 ? `${y}-06` : `${y}-12`;
    const payYm      = h === 1 ? `${y}-07` : `${y+1}-01`;
    // 지급월이 지났으면 완료, 판매 기간이 진행 중이면 집계 중
    const state = nowYm >= payYm ? 'done' : (nowYm <= coverEnd ? 'open' : 'due');
    out.push({ key:`${y}-${h}`, y, h, coverStart, coverEnd, payYm, state,
      stateLabel: state === 'done' ? '지급 완료' : (state === 'open' ? '집계 중' : '지급 예정'),
      label:`${y}년 ${h===1?'상반기':'하반기'}분 · ${payYm.slice(0,4)}년 ${+payYm.slice(5,7)}월 지급` });
    if (h === 1) { h = 2; y -= 1; } else { h = 1; }
  }
  return out;
}
const ymAdd = (ym, n) => {
  const y = +ym.slice(0,4), m = +ym.slice(5,7) + n;
  const yy = y + Math.floor((m-1)/12), mm = ((m-1)%12+12)%12 + 1;
  return yy + '-' + String(mm).padStart(2,'0');
};
const ymDiff = (a, b) => (+a.slice(0,4) - +b.slice(0,4)) * 12 + (+a.slice(5,7) - +b.slice(5,7));

// 이 회차에서 이 도서를 정산하는가, 한다면 어느 기간인가
function roySpan(pubYm, round){
  if (!pubYm) return {ok:true, from:round.coverStart, to:round.coverEnd, carried:false};
  if (pubYm > round.coverEnd) return {ok:false, why:'출간 전'};
  // 이 도서가 처음 정산되는 회차를 찾는다 (정산월 − 출간월 > 2 인 첫 회차)
  const all = royRounds().slice().reverse();          // 오래된 순
  let first = null;
  for (const r of all){
    if (pubYm > r.coverEnd) continue;
    if (ymDiff(r.payYm, pubYm) > 2) { first = r; break; }
  }
  if (!first) return {ok:false, why:'출간 2개월 이내 — 다음 회차로 이월'};
  if (round.key === first.key) return {ok:true, from:pubYm, to:round.coverEnd, carried: pubYm < round.coverStart};
  if (round.payYm < first.payYm) return {ok:false, why:'출간 2개월 이내 — 다음 회차로 이월'};
  return {ok:true, from:round.coverStart, to:round.coverEnd, carried:false};
}

const royNorm = v => String(v||'').replace(/\s/g,'').replace(/？/g,'?');
// 누적 시작(ROY_BASE_YM)부터 before 직전월까지 팔린 부수 — 구간 인세 판정용
function roySoldBefore(title, before){
  const key = royNorm(title);
  const ok = ym => ym >= ROY_BASE_YM && ym < before;
  let n = 0;
  ROY_SCM.forEach(r => { if (royNorm(r.title) === key && ok(r.ym)) n += r.qty; });
  let ws = 0;
  ROY_STORE.forEach(r => { if (royNorm(r.title) === key && ok(r.ym) && isWholesaleStore(r.store)) ws += r.qty; });
  n += Math.round(ws * WHOLESALE_RATE);
  ROY_SHIP.forEach(r => { if (royNorm(r.title) === key && ok(r.ym)) n -= r.ret; });
  return Math.max(0, Math.round(n));
}

function royCalc(title, from, to){
  const key = royNorm(title);
  const inRange = ym => ym >= from && ym <= to;
  let scm = 0, store = 0, ret = 0, price = 0, rate = 0, shipAll = 0;
  ROY_SCM.forEach(r => { if (royNorm(r.title) === key && inRange(r.ym)) scm += r.qty; });
  ROY_SHIP.forEach(r => {
    if (royNorm(r.title) !== key) return;
    if (r.price) price = r.price;
    if (r.rate)  rate  = r.rate;
    if (inRange(r.ym)) { ret += r.ret; shipAll += r.ship; }
  });
  // 인세 대상 도매 거래처만 (쿠팡·북센·도소매)
  ROY_STORE.forEach(r => {
    if (royNorm(r.title) === key && inRange(r.ym) && isWholesaleStore(r.store)) store += r.qty;
  });
  if (rate > 1) rate = rate / 100;
  // 인세율은 지어내지 않는다. 시트에 없으면 0 으로 두고 화면에서 '미입력'으로 알린다.
  // 도매 출고는 80% 를 실판매로 환산
  const wsale = Math.round(store * WHOLESALE_RATE);
  return {scm, store, wsale, ret, price, rate, shipAll, hasStore: ROY_STORE.length > 0};
}

/* 출고 RAW 지연 로드 — 서점별 출고부수 (쿠팡·북센·도소매).
   행이 많아 인세 정산 탭을 열 때 한 번만 불러온다. */
let ROY_RAW_STATE = 'idle';   // idle | loading | ok | fail
let ROY_RAW_ERR = '';         // 실패 사유 — 화면과 콘솔에 그대로 보여준다
async function loadShipRaw(quiet){
  if (ROY_RAW_STATE === 'loading' || ROY_RAW_STATE === 'ok') return;
  ROY_RAW_STATE = 'loading';
  // 금방 끝나면 깜빡이므로 0.5초 넘게 걸릴 때만 띄운다
  const showTimer = quiet ? null
    : setTimeout(() => royLoadShow('출고·판매 기록을 불러오는 중입니다'), 500);
  // 어떤 이유로든 멈추면 25초 뒤 강제로 걷어낸다
  const killTimer = setTimeout(() => { clearTimeout(showTimer); royLoadHide(); }, 25000);
  if (!quiet) renderRoyalty();
  try {
    const base = `https://docs.google.com/spreadsheets/d/${CFG.sheetId}/`;
    const url = CFG.gids.shipRaw
      ? `${base}export?format=csv&gid=${CFG.gids.shipRaw}`
      : `${base}gviz/tq?tqx=out:csv&sheet=${encodeURIComponent('출고 RAW')}`;
    const res = await fetch(url, {cache:'no-store'});
    if (!res.ok) throw new Error(`시트를 못 받았습니다 (HTTP ${res.status}) — GID 나 공유 설정을 확인해 주세요`);
    const txt = await res.text();
    const g = parseCSVGrid(txt);
    const hi = findHeaderRow(g, ['서점','도서','출고']);
    if (hi < 0) throw new Error(`헤더(서점·도서·출고)를 못 찾았습니다 — 첫 행: ${(g[0]||[]).slice(0,8).join(' | ')}`);
    const h = g[hi].map(v => String(v||'').trim());
    const cStore = h.indexOf('서점');
    const cBook  = h.indexOf('도서');
    const cQty   = h.indexOf('출고');
    let cYm = h.indexOf('연도월(변환)');
    if (cYm < 0) cYm = h.indexOf('연도월');
    const cDate = h.indexOf('날짜');
    // 서점은 병합 셀이라 첫 행에만 있다 — 아래로 이어 채운다
    let store = '';
    const out = [];
    g.slice(hi + 1).forEach(r => {
      const st = String(r[cStore]||'').trim();
      if (st) store = st;
      const title = String(r[cBook]||'').trim();
      const qty = toNum(r[cQty]);
      if (!title || !qty) return;
      let ym = cYm >= 0 ? String(r[cYm]||'').slice(0,7) : '';
      if (!/^\d{4}-\d{2}$/.test(ym) && cDate >= 0) {
        const d = parseAnyDate(r[cDate]);
        if (d) ym = ymd(d).slice(0,7);
      }
      if (!/^\d{4}-\d{2}$/.test(ym)) return;
      out.push({title, ym, store, qty});
    });
    ROY_STORE.splice(0, ROY_STORE.length, ...out);
    await loadAuthors();
    if (!out.length) throw new Error(`읽을 행이 없습니다 (전체 ${g.length}행, 헤더 ${hi+1}행째) — 열 위치를 확인해 주세요`);
    ROY_RAW_STATE = 'ok'; ROY_RAW_ERR = '';
    console.info('[출고 RAW] 서점별 출고', out.length + '행');
  } catch(e) {
    ROY_RAW_STATE = 'fail';
    ROY_RAW_ERR = (e && e.message) ? e.message : String(e);
    console.warn('[출고 RAW] 로드 실패:', e);
  }
  clearTimeout(showTimer); clearTimeout(killTimer);
  if (!quiet) royLoadHide();
  if (!quiet || activeTab === 'royalty') renderRoyalty();
}

// 저자 정보 — 공저는 행을 여러 개 쓴다. 지분을 비우면 균등 분배.

    })).filter(x => x.name));

// 이 도서의 저자 목록. 시트에 없으면 도서 목록의 저자명 한 명으로 본다.
function royAuthorsOf(b){
  const key = royNorm(b.title), isbn = String(b.isbn||'').trim();
  let list = ROY_AUTHORS.filter(a => (isbn && a.isbn === isbn) || (a.title && royNorm(a.title) === key));
  if (!list.length) {
    const nm = String(b.author||'').trim();
    list = nm ? [{name:nm, share:0, bank:'', account:'', holder:''}] : [];
  }
  // 지분 비우면 균등 분배
  const given = list.filter(a => a.share > 0);
  const rest  = list.length - given.length;
  const used  = given.reduce((x,a) => x + a.share, 0);
  const each  = rest > 0 ? Math.max(0, 100 - used) / rest : 0;
  return list.map(a => ({...a, shareP: (a.share > 0 ? a.share : each) / 100}));
}
