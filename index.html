<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Feelm 콘텐츠사업본부 대시보드</title>
<!-- 바탕화면 설치(PWA) — 크롬 '설치' 후 주소창 없는 창으로 열린다 -->
<meta name="theme-color" content="#0F1620">
<meta name="description" content="필름 콘텐츠사업본부 실적 대시보드">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="필름 대시보드">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
:root {
  /* 쿨 뉴트럴 — 파랑 쪽으로 정렬된 무채색 */
  --bg:#F5F7FA; --surface:#FFF; --surface2:#F9FAFC; --surface3:#F0F3F7;
  --border:#E4E8EE; --border2:#CDD4DE;
  --ink:#0F1620; --ink1:#232C38; --ink2:#55606E; --ink3:#7C8794; --ink5:#E9EDF2;
  /* 액센트 — 인디고 톤 쌍. 밝은 배경과 어두운 밴드를 동시에 만족하는 단색은 없어서 두 톤을 쓴다 */
  --accent:#3A5BD9; --accent-deep:#2A44A8; --accent-dim:#EEF1FE;
  --accent-on-dark:#6B8AF0; --accent-text:#FFFFFF;
  /* 의미색 — 증감 표시에만. 카테고리 구분에는 쓰지 않는다 */
  --good:#0E6E52; --good-dim:#E8F3EF;
  --warn:#8A5A00; --warn-dim:#FBF1E3;
  --bad:#B3243C;  --bad-dim:#FCECEF;
  --info:#55606E; --info-dim:#F0F3F7;
  /* 로그인 화면 전용 — 본문은 전부 밝은 표면 한 벌로 간다 */
  --lock-bg:#131A24; --lock-surf:#1B2430; --lock-border:#2A3644;
  /* 상단 KPI 밴드 — 딥 인디고 네이비. 순검정은 채도가 없어 어두침침해 보인다 */
  --band-bg:#1C2745; --band-top:#223054; --band-border:#2E3D63;
  --band-ink:#FFFFFF; --band-ink2:#A8B4CE; --band-ink3:#8593B2;
  --r:8px; --r2:6px; --r3:4px; --r4:3px; --r5:2px; --rp:999px;
  /* 그림자는 얕고 좁게 — 번짐 대신 경계선으로 구분 */
  --sh-sm:0 1px 1px rgba(15,22,32,.04);
  --sh-md:0 1px 2px rgba(15,22,32,.06),0 4px 12px rgba(15,22,32,.05);
  --sh-lg:0 4px 14px rgba(15,22,32,.10),0 16px 36px rgba(15,22,32,.08);
  --sans:'Pretendard',-apple-system,sans-serif;
  --num:'Pretendard',-apple-system,sans-serif;
  --hdr-h:56px; --pill-h:68px; --tab-h:44px;
  /* 모션 — 감속 위주. 튕김 없이 정확하게 멈추는 곡선 */
  --ease:cubic-bezier(.16,1,.3,1);
  --ease-io:cubic-bezier(.65,0,.35,1);
  --d-fast:140ms; --d-mid:280ms; --d-slow:620ms;
}

/* ── 모션 유틸 ── */
@keyframes growW{from{width:0}to{width:var(--w,100%)}}
@keyframes growH{from{height:0}to{height:var(--h,100%)}}
@keyframes riseIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
/* 막대가 왼쪽에서 오른쪽으로 그어짐 */
.bar-grow{width:var(--w,100%);animation:growW var(--d-slow) var(--ease) both;animation-delay:var(--d,0ms)}
.rise{animation:riseIn var(--d-mid) var(--ease) both;animation-delay:var(--d,0ms)}
.section.active{animation:riseIn var(--d-mid) var(--ease) both}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh;font-size:13px;line-height:1.5;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1,'cv01' 1;letter-spacing:-.003em}

/* LOCK */
#lock{position:fixed;inset:0;z-index:999;background:var(--lock-bg);display:flex;align-items:center;justify-content:center}
#lock.hidden{display:none}
.lk-wrap{display:flex;flex-direction:column;align-items:center;gap:24px}
.lk-logo{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:#fff;letter-spacing:.1em;text-transform:uppercase}
.lk-logo-dot{width:28px;height:28px;background:var(--accent);border-radius:var(--r2);display:flex;align-items:center;justify-content:center;font-size:13px}
.lk-card{background:var(--lock-surf);border:1px solid var(--lock-border);border-radius:var(--r);padding:44px 48px;width:400px;display:flex;flex-direction:column;gap:16px;box-shadow:0 24px 80px rgba(0,0,0,.5)}
.lk-title{font-size:22px;font-weight:900;color:#fff;letter-spacing:-.03em;line-height:1.2}
.lk-sub{font-size:12px;color:#8B97A6;margin-top:-4px}
.lk-inp{background:#0F1620;border:1.5px solid #2A3644;border-radius:var(--r2);padding:13px 15px;font-size:15px;color:#fff;font-family:var(--sans);outline:none;transition:border-color .15s;letter-spacing:.06em}
.lk-inp:focus{border-color:var(--accent)}
.lk-inp::placeholder{color:#69747F;letter-spacing:0}
.lk-btn{background:var(--accent);border:none;border-radius:var(--r2);padding:12px;font-size:13px;font-weight:800;color:#FFFFFF;cursor:pointer;font-family:var(--sans)}
.lk-btn:hover{opacity:.88}
.lk-err{font-size:12px;color:#F08098;display:none;font-weight:600;text-align:center}

/* APP */
#app{display:none;flex-direction:column;min-height:100vh}
#app.show{display:flex}

/* HEADER */
header{position:sticky;top:0;z-index:100;height:var(--hdr-h);background:rgba(245,247,250,.88);backdrop-filter:blur(16px) saturate(180%);border-bottom:1px solid var(--border)}
.hdr{display:flex;align-items:center;gap:16px;height:100%;padding:0 24px}
.brand{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:900;color:var(--ink);letter-spacing:-.02em}
.brand-mark{display:flex;align-items:center;}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:12px}
.sync-st{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink3);font-weight:500}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--good);flex-shrink:0}
.sync-dot.loading{background:var(--warn);animation:blink .8s linear infinite}
.sync-dot.error{background:var(--bad)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.mpick{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2)}
.mpick input{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r3);padding:5px 9px;color:var(--ink);font-family:var(--sans);font-size:12px;outline:none;cursor:pointer}
.mpick input:focus{border-color:var(--accent)}

/* TABS */
.tabs-bar{position:sticky;top:var(--hdr-h);z-index:99;height:var(--tab-h);background:rgba(245,247,250,.88);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;overflow-x:auto;gap:0}
.tabs-bar::-webkit-scrollbar{display:none}
.tab-btn{border:none;background:none;color:var(--ink3);padding:0 16px;height:44px;font-size:13px;font-weight:700;font-family:var(--sans);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:4px;
  transition:color var(--d-fast) linear,border-color var(--d-fast) linear}
.tab-btn:hover{color:var(--ink)}
.tab-btn:hover:not(.active){color:var(--ink)}
.tab-btn.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:900}
.tab-div{width:1px;height:18px;background:var(--border);margin:0 6px;flex-shrink:0}

/* PILL BAR */
.pill-bar-wrap{background:linear-gradient(180deg,var(--band-top),var(--band-bg));border-bottom:1px solid var(--band-border);width:100%}
.pill-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:0;min-height:128px}
.pill{display:flex;flex-direction:column;justify-content:space-between;padding:19px 32px;cursor:default;position:relative;min-width:0}
/* 구분선은 안쪽 그림자로 — 테두리를 쓰면 셀이 컨테이너보다 커질 때 밖으로 흘러나온다 */
.pill:not(:last-child){box-shadow:inset -1px 0 0 var(--band-border)}
.pill-lbl{font-size:10px;color:var(--band-ink3);font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.pill-val{font-size:46px;font-weight:800;color:var(--band-ink);letter-spacing:-.05em;line-height:1;text-align:right;margin-top:auto;font-variant-numeric:tabular-nums}
/* 어두운 배경 위에서는 잉크 대신 브랜드 옐로우로 강조 */
.pill-val.up,.pill-val.ok{color:var(--accent-on-dark)}
.pill-val.dn{color:#F08098}
.pill-sub{font-size:12px;color:var(--band-ink2);text-align:right;margin-top:8px;letter-spacing:.01em}

/* 이스터에그 — 로고 5회 클릭 시 전체 화면 연출 */
.brand img{cursor:pointer;user-select:none;-webkit-user-drag:none}
#eggStage{position:fixed;inset:0;z-index:1200;pointer-events:none;display:flex;
  align-items:center;justify-content:center;overflow:hidden}
@keyframes eggVeil{0%{opacity:0}18%{opacity:1}72%{opacity:1}100%{opacity:0}}
#eggStage .veil{position:absolute;inset:0;background:radial-gradient(circle at 50% 48%,
  rgba(58,91,217,.16) 0%, rgba(15,22,32,.72) 62%, rgba(15,22,32,.88) 100%);
  backdrop-filter:blur(6px);animation:eggVeil 1.9s var(--ease) both}
@keyframes eggMark{
  0%   {transform:scale(.18) rotate(-14deg);opacity:0}
  22%  {transform:scale(1.16) rotate(4deg); opacity:1}
  34%  {transform:scale(.96) rotate(-2deg)}
  46%  {transform:scale(1.02) rotate(0deg)}
  74%  {transform:scale(1) rotate(0deg);   opacity:1}
  100% {transform:scale(1.5) rotate(0deg); opacity:0}
}
#eggStage .mark{width:min(34vh,300px);height:auto;filter:drop-shadow(0 18px 46px rgba(0,0,0,.45));
  animation:eggMark 1.9s cubic-bezier(.2,1.3,.35,1) both}
@keyframes eggRing{0%{transform:scale(.06);opacity:.9}100%{transform:scale(3.4);opacity:0}}
#eggStage .ring{position:absolute;width:60vmin;height:60vmin;border-radius:50%;
  border:2px solid var(--accent);animation:eggRing 1.5s cubic-bezier(.16,1,.3,1) both}
@keyframes eggWord{0%{opacity:0;transform:translateY(14px)}30%{opacity:1;transform:none}
  74%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
#eggStage .word{position:absolute;bottom:16vh;font-size:12px;font-weight:800;letter-spacing:.34em;
  text-transform:uppercase;color:var(--accent);animation:eggWord 1.9s var(--ease) both}
/* 대외비 뱃지 길게 누르기 */
.conf-badge{transition:background var(--d-fast) linear,border-color var(--d-fast) linear}
.conf-badge.secret{background:var(--ink);border-color:var(--ink);color:var(--accent)}

/* 보안 고지 */
.conf-badge{display:inline-flex;align-items:center;height:17px;padding:0 6px;border-radius:var(--r4);user-select:none;-webkit-user-select:none;cursor:default;
  background:var(--accent-dim);border:1px solid var(--accent);color:var(--ink);
  font-size:9px;font-weight:800;letter-spacing:.08em;white-space:nowrap;flex-shrink:0}
.conf-note{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:24px;padding:12px 2px 0;
  border-top:1px solid var(--border);font-size:11px;color:var(--ink3);line-height:1.6}
.conf-note b{color:var(--ink2);font-weight:800}
.conf-stamp{margin-left:auto;font-size:10px;color:var(--ink3);white-space:nowrap}
@media print{
  .conf-note{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #999}
  .tabs-bar,.hdr-r{display:none}
}

/* 로딩 표시 */
@keyframes syncPulse{0%,100%{opacity:1}50%{opacity:.25}}
.sync-dot.loading{animation:syncPulse 1s ease-in-out infinite;background:var(--accent)}
@keyframes skelShine{0%{background-position:-320px 0}100%{background-position:320px 0}}
.skel{border-radius:var(--r2);background:linear-gradient(90deg,var(--surface3) 25%,var(--surface2) 50%,var(--surface3) 75%);
  background-size:640px 100%;animation:skelShine 1.1s linear infinite}

/* 모바일 — 넓은 표는 가로 스크롤 컨테이너로 감싸고, 아주 좁으면 글자·여백을 줄인다 */
@media (max-width:820px){
  table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap}
  .card [style*='grid-template-columns:repeat']{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  table th,table td{padding:7px 8px;font-size:11px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .kpi-val{font-size:26px}
  .card{padding:14px}
  main{padding:14px 12px 60px}
}
@media (max-width:560px){
  table th,table td{padding:6px;font-size:10.5px}
  .card-title{font-size:13px}
  .tab-btn{font-size:12px;padding:8px 9px}
}

/* ── 출간 캘린더 ──
   본부의 1년이 한 화면에 들어와야 한다. 12개월 × 등급 3줄. */
.pc-head{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:16px}
.pc-yr select{border:none;background:none;font-family:var(--sans);font-size:26px;font-weight:800;
  letter-spacing:-.03em;color:var(--ink);cursor:pointer;padding:0;outline:none}
.pc-yr .pc-sub{font-size:13px;color:var(--ink3);margin-top:2px;letter-spacing:.01em}
.pc-gauges{display:flex;gap:8px;flex-wrap:wrap}
.pc-gauge{border:1px solid var(--border2);background:var(--surface);border-radius:var(--r2);
  padding:11px 16px 12px;cursor:pointer;text-align:left;min-width:156px;font-family:var(--sans);
  transition:all .18s var(--ease)}
.pc-gauge:hover{border-color:var(--gc);box-shadow:var(--sh-sm);transform:translateY(-1px)}
.pc-gauge.on{border-color:var(--gc);background:var(--gs);box-shadow:inset 0 0 0 1px var(--gc)}
.pc-gl{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--ink)}
.pc-gl i{width:7px;height:7px;border-radius:2px;background:var(--gc);display:block}
.pc-gl span{font-weight:500;color:var(--ink3);font-size:11.5px;margin-left:3px}
.pc-gn{display:flex;align-items:baseline;gap:4px;margin:3px 0 6px}
.pc-gn b{font-size:22px;font-weight:800;color:var(--ink);letter-spacing:-.02em}
.pc-gn span{font-size:12.5px;color:var(--ink3)}
.pc-bar{height:3px;border-radius:2px;background:var(--ink5);overflow:hidden}
.pc-bar i{display:block;height:3px;border-radius:2px;background:var(--gc);transition:width .5s var(--ease)}
.pc-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.pc-sel{border:1px solid var(--border2);background:var(--surface);color:var(--ink2);
  border-radius:var(--r3);padding:8px 13px;font-family:var(--sans);font-size:13px;outline:none;cursor:pointer}
.pc-tot{display:flex;align-items:baseline;gap:5px}
.pc-tot b{font-size:22px;font-weight:800;color:var(--ink);letter-spacing:-.02em}
.pc-tot span{font-size:13px;color:var(--ink3)}

.pc-wrap{overflow-x:auto;padding-bottom:8px}
.pc-grid{display:grid;grid-template-columns:132px repeat(12, minmax(148px,1fr));
  min-width:1908px;gap:0}
.pc-corner{border-bottom:1px solid var(--border2)}
.pc-mh{position:relative;text-align:center;font-size:15px;font-weight:700;color:var(--ink2);
  padding:0 0 11px;border-bottom:1px solid var(--border2);border-left:1px solid var(--border)}
.pc-mh small{font-size:11.5px;font-weight:500;color:var(--ink3);margin-left:1px}
.pc-mh em{position:absolute;left:50%;transform:translateX(-50%);bottom:-1px;font-style:normal;
  font-size:10px;font-weight:700;color:var(--accent-deep);background:var(--accent-dim);
  padding:2px 7px;border-radius:6px}
.pc-mh.now{color:var(--accent-deep)}
.pc-mh.half{border-left:1px solid var(--border2)}
.pc-gh{padding:14px 12px 12px 0;border-bottom:1px solid var(--border);border-left:3px solid var(--gc)}
.pc-gh b{display:block;font-size:16px;font-weight:800;color:var(--ink);letter-spacing:-.02em;
  padding-left:12px}
.pc-gh span{display:block;font-size:12px;color:var(--ink3);margin-top:3px;padding-left:12px}
.pc-gh em{display:block;font-style:normal;font-size:12.5px;font-weight:700;margin-top:4px;padding-left:12px}
.pc-cell{border-bottom:1px solid var(--border);border-left:1px solid var(--border);
  padding:10px 7px;display:flex;flex-direction:column;gap:7px;min-height:76px}
.pc-cell.now{background:rgba(58,91,217,.035)}
.pc-cell.half{border-left:1px solid var(--border2)}

.pc-slot{border-radius:var(--r3);padding:11px 12px;transition:all .16s var(--ease)}
.pc-empty{border:1px dashed var(--border2);background:var(--surface2);text-align:center;
  color:var(--ink5);font-size:13px;display:flex;align-items:center;justify-content:center;min-height:56px}
.pc-empty:hover{border-color:var(--gc);color:var(--gc);background:var(--surface)}
.pc-on{background:var(--gs);border:1px solid var(--gl);border-left:3px solid var(--gc);cursor:help}
.pc-on:hover{box-shadow:var(--sh-md);transform:translateY(-1px)}
.pc-dim{opacity:.26}
.pc-t{font-size:14px;font-weight:700;color:var(--ink);line-height:1.4;letter-spacing:-.01em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc-badge{display:inline-block;margin-top:7px;padding:3px 9px;border-radius:5px;
  background:#8A6A12;color:#FFF;font-size:11px;font-weight:800;letter-spacing:.04em;line-height:1.5}
.pc-sp{position:relative;border-left-style:double;border-left-width:5px}
.pc-sp::after{content:'';position:absolute;inset:0;border-radius:var(--r3);pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(138,106,18,.32)}
.pc-lg-sp{width:auto!important;height:auto!important;border-radius:5px!important;
  background:#8A6A12;color:#FFF;font-size:10.5px;font-weight:800;padding:3px 8px;letter-spacing:.04em}
.pc-tot-sp b{color:#8A6A12}
.pc-tot-sp{padding-left:14px;border-left:1px solid var(--border2)}
.pc-w{font-size:12px;color:var(--ink3);margin-top:6px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.pc-w.pc-none{color:var(--ink5)}
.pc-s{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink3);margin-top:7px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-s i{width:6px;height:6px;border-radius:50%;background:var(--sc);flex-shrink:0;display:block}

.pc-legend{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-top:18px;
  padding-top:15px;border-top:1px solid var(--border);font-size:12.5px;color:var(--ink3)}
.pc-legend span{display:inline-flex;align-items:center;gap:5px}
.pc-legend i{width:10px;height:10px;border-radius:2px;display:block}
.pc-legend .pc-div{width:1px;height:11px;background:var(--border2)}
@media (max-width:900px){
  .pc-head{gap:12px}
  .pc-yr select{font-size:21px}
  .pc-right{margin-left:0;width:100%}
}

/* 인세 정산 로딩 — 화면 한가운데. 기다리는 시간을 기분 좋게 만드는 자리다. */
#royLoad{position:fixed;inset:0;z-index:980;display:none;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 42%, #FFF 0%, var(--bg) 72%)}
#royLoad.on{display:flex;animation:fadeIn var(--d) var(--ease) both}
#royLoad.out{animation:royOut .34s var(--ease) both}
@keyframes royOut{to{opacity:0;transform:scale(1.03)}}
#royLoad .in{display:flex;flex-direction:column;align-items:center;gap:26px;text-align:center;padding:24px}
#royLoad .cap{font-size:20px;font-weight:800;letter-spacing:-.03em;color:var(--ink);line-height:1.5}
#royLoad .sub{font-size:13px;color:var(--ink3);line-height:1.7}
#royLoad .bar{width:190px;height:3px;border-radius:2px;background:var(--ink5);overflow:hidden}
#royLoad .bar i{display:block;height:3px;width:40%;border-radius:2px;background:var(--accent);
  animation:royBar 1.5s ease-in-out infinite}
@keyframes royBar{0%{transform:translateX(-110%)}100%{transform:translateX(360%)}}

/* 인세 정산 로딩 — 책이 한 권씩 쌓이고 동전이 톡 떨어진다 */
@keyframes bookIn{
  0%   {transform:translateY(-40px) rotate(-10deg);opacity:0}
  16%  {transform:translateY(2px)   rotate(1.5deg);opacity:1}
  24%  {transform:translateY(-4px)  rotate(0deg)}
  30%  {transform:translateY(0)     rotate(0deg)}
  86%  {transform:translateY(0)     rotate(0deg);opacity:1}
  100% {transform:translateY(0)     rotate(0deg);opacity:0}
}
@keyframes coinDrop{
  0%   {transform:translateY(-26px) scaleX(1);opacity:0}
  35%  {opacity:1}
  60%  {transform:translateY(0) scaleX(1)}
  70%  {transform:translateY(0) scaleX(.42)}
  82%  {transform:translateY(0) scaleX(1)}
  92%  {transform:translateY(0) scaleX(.72)}
  100% {transform:translateY(0) scaleX(1);opacity:1}
}
@keyframes shelfPulse{0%,100%{opacity:.22}50%{opacity:.4}}
.roy-load{display:flex;align-items:center;gap:16px}
.roy-load svg{flex-shrink:0}
.roy-load .bk{animation:bookIn 2.4s var(--ease) infinite;transform-origin:50% 100%}
.roy-load .coin{animation:coinDrop 1.5s ease-in-out infinite;transform-origin:50% 100%;transform-box:fill-box}
.roy-load .shelf{animation:shelfPulse 2s ease-in-out infinite}
.roy-load .msg{font-size:12.5px;color:var(--ink2);line-height:1.65}
.roy-load .dots::after{content:'';animation:royDots 1.4s steps(4,end) infinite}
@keyframes royDots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}

/* 인세 정산서 모달 */
#royModal{position:fixed;inset:0;z-index:1300;display:none;align-items:flex-start;justify-content:center;
  background:rgba(15,22,32,.5);backdrop-filter:blur(3px);padding:32px 20px;overflow-y:auto}
#royModal.on{display:flex;animation:fadeIn var(--d-fast) var(--ease) both}
#royModal .box{width:min(980px,100%);background:var(--surface);border:1px solid var(--border2);
  border-radius:var(--r);box-shadow:var(--sh-lg);animation:riseIn var(--d-fast) var(--ease) both;
  padding:20px 22px;margin:auto}
#royModal .x{position:absolute;top:10px;right:12px;width:28px;height:28px;border:0;background:transparent;
  color:var(--ink3);font-size:17px;cursor:pointer;border-radius:var(--r3);line-height:1}
#royModal .x:hover{background:var(--surface3);color:var(--ink)}

/* 통합 검색 (Cmd/Ctrl+K) */
#cmdk{position:fixed;inset:0;z-index:1400;display:none;align-items:flex-start;justify-content:center;
  background:rgba(15,22,32,.42);backdrop-filter:blur(3px);padding-top:12vh}
#cmdk.on{display:flex;animation:fadeIn var(--d-fast) var(--ease) both}
#cmdk .box{width:min(620px,92vw);background:var(--surface);border:1px solid var(--border2);
  border-radius:var(--r);box-shadow:var(--sh-lg);overflow:hidden;animation:riseIn var(--d-fast) var(--ease) both}
#cmdk input{width:100%;border:0;outline:0;padding:17px 20px;font-family:var(--sans);font-size:15px;
  color:var(--ink);background:transparent;box-sizing:border-box}
#cmdk .res{max-height:52vh;overflow-y:auto;border-top:1px solid var(--border)}
#cmdk .it{display:flex;align-items:center;gap:11px;padding:10px 20px;cursor:pointer}
#cmdk .it.sel{background:var(--accent-dim)}
#cmdk .kind{font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--ink3);
  width:52px;flex-shrink:0;text-transform:uppercase}
#cmdk .ttl{font-size:13px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cmdk .sub{font-size:11px;color:var(--ink3);margin-left:auto;flex-shrink:0;white-space:nowrap}
#cmdk .foot{display:flex;gap:14px;padding:9px 20px;border-top:1px solid var(--border);
  background:var(--surface2);font-size:11px;color:var(--ink3)}

/* 최상단 지표 구역 — 상단 밴드에서 이어지는 옅은 배경으로 아래 지표들과 구분 */
/* 위쪽 여백은 0 — 예전엔 화면 맨 위라 -18px 로 끌어올렸지만
   지금은 데이터 신선도 카드가 위에 있어 그 카드를 덮어버린다 */
.top-zone{margin:14px -24px 22px;padding:22px 24px 24px;
  background:linear-gradient(180deg,#E9EEF8 0%,#F1F4FA 55%,var(--bg) 100%);
  border-bottom:1px solid var(--border)}
@media (max-width:900px){.top-zone{margin:12px -14px 18px;padding:18px 14px 20px}}

/* MAIN */
main{flex:1;padding:18px 24px 80px;width:100%;box-sizing:border-box}
.section{display:none}
.section.active{display:block}
.gap{margin-top:12px}
.gap2{margin-top:16px}

/* GRID */
.g2{display:grid;grid-template-columns:1.5fr 1fr;gap:12px}
.g2e{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.g6{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}

/* CARD */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:22px 24px;box-shadow:var(--sh-sm);
  transition:border-color var(--d-fast) linear,box-shadow var(--d-mid) var(--ease),transform var(--d-mid) var(--ease)}
.card:hover{border-color:var(--border2);box-shadow:var(--sh-md)}
.card-title{font-size:14px;font-weight:800;color:var(--ink);margin-bottom:12px;display:flex;align-items:center;gap:8px;letter-spacing:-.005em}
.card-title small{font-size:11px;color:var(--ink3);font-weight:500;letter-spacing:0}

/* KPI */
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:22px 24px;box-shadow:var(--sh-sm);position:relative;overflow:hidden;
  transition:border-color var(--d-fast) linear,box-shadow var(--d-mid) var(--ease),transform var(--d-mid) var(--ease)}
/* 상단에 브랜드 옐로우 라인이 좌→우로 그어짐 */
.kpi::after{content:'';position:absolute;left:0;top:0;height:2px;width:100%;background:var(--accent);
  transform:scaleX(0);transform-origin:left;transition:transform var(--d-mid) var(--ease)}
.kpi:hover{border-color:var(--border2);box-shadow:var(--sh-md);transform:translateY(-2px)}
.kpi:hover::after{transform:scaleX(1)}
.kpi-lbl{font-size:11px;color:var(--ink3);font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.kpi-val{font-size:34px;font-weight:800;color:var(--ink);letter-spacing:-.045em;line-height:1;margin-bottom:8px;font-variant-numeric:tabular-nums}
.kpi-val.good{color:var(--good)}
.kpi-val.bad{color:var(--bad)}
.kpi-val.warn{color:var(--warn)}
.kpi-sub{font-size:12px;color:var(--ink3);line-height:1.55}
.kpi-bar-wrap{margin-top:8px;height:4px;background:var(--surface3);border-radius:var(--r5);overflow:hidden}
.kpi-bar{height:100%;border-radius:var(--r5);background:var(--accent);transition:width var(--d-slow) var(--ease)}

/* BAR CHART */
.chart-wrap{position:relative;height:200px;display:flex;align-items:flex-end;gap:4px;padding-bottom:26px;border-bottom:1px solid var(--border)}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bar-rect{width:100%;border-radius:3px 3px 0 0;min-height:3px;cursor:default;position:relative;
  transition:height var(--d-slow) var(--ease),filter var(--d-fast) linear}
.bar-rect:hover{filter:brightness(1.12)}
.bar-rect:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12px;padding:5px 10px;border-radius:var(--r3);white-space:nowrap;pointer-events:none;z-index:10;box-shadow:var(--sh-md)}
.bar-lbl{font-size:11px;color:var(--ink3);font-family:var(--sans);text-align:center;white-space:nowrap;overflow:hidden;max-width:100%}
.bar-val{font-size:10px;color:var(--ink2);font-weight:700;font-family:var(--sans);margin-bottom:4px;white-space:nowrap}
/* 카테고리 막대 — 색으로 순위만 표현 */
.b-top{background:var(--ink)}
.b-flat{background:var(--border2)}
.b-y{background:var(--accent)}
.b-g{background:var(--good)}
.b-b{background:var(--info)}
.b-w{background:var(--warn)}
.b-r{background:var(--bad)}
.b-d{background:var(--ink3)}
.b-t{background:#69747F}

/* TABLE */
table{width:100%;border-collapse:collapse}
th{font-size:10px;font-weight:700;color:var(--ink3);letter-spacing:.09em;text-transform:uppercase;padding:9px 12px;border-bottom:1px solid var(--border2);text-align:left;background:transparent;white-space:nowrap;cursor:pointer;user-select:none}
th:hover{background:var(--surface3)}
td{padding:9px 12px;border-bottom:1px solid var(--border);font-size:12px;color:var(--ink)}
tr:last-child td{border-bottom:none}
tbody tr,table tr{transition:background var(--d-fast) linear}
tr:hover td{background:var(--surface2)}
tr:hover td:first-child{box-shadow:inset 2px 0 0 var(--accent)}
.right{text-align:right;font-variant-numeric:tabular-nums}
.empty-row{padding:32px 10px;text-align:center;color:var(--ink3);font-size:13px;font-style:italic}
.sort-icon{font-size:10px;color:var(--ink3);margin-left:4px}
.sort-icon.asc::after{content:'↑';color:var(--accent)}
.sort-icon.desc::after{content:'↓';color:var(--accent)}
.sort-icon:not(.asc):not(.desc)::after{content:'↕'}

/* BADGE */
.badge{display:inline-flex;align-items:center;border-radius:var(--r4);padding:3px 9px;font-size:11px;font-weight:800;letter-spacing:.03em;white-space:nowrap}
.badge.good{background:var(--good-dim);color:var(--good)}
.badge.bad{background:var(--bad-dim);color:var(--bad)}
.badge.warn{background:var(--warn-dim);color:var(--warn)}
.badge.info{background:var(--info-dim);color:var(--info)}
.badge.neutral{background:var(--surface3);color:var(--ink2)}
.badge.acc{background:var(--accent-dim);color:var(--accent-text)}

/* PROGRESS */
.prog-item{margin-bottom:12px}
.prog-item:last-child{margin-bottom:0}
.prog-head{display:flex;justify-content:space-between;margin-bottom:4px;font-size:13px}
.prog-head b{color:var(--ink);font-weight:700}
.prog-head span{color:var(--ink3);font-variant-numeric:tabular-nums}
.prog-bg{height:6px;background:var(--surface3);border-radius:var(--r4);overflow:hidden}
.prog-fill{height:100%;border-radius:var(--r4)}

/* NOTICE */
.notice .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:6px;background:var(--ink3)}
.notice.good .dot{background:var(--ink)}
.notice.info .dot{background:var(--ink3)}
.notice.warn .dot{background:var(--accent)}
.notice.bad  .dot{background:var(--bad)}
.notice-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;height:100%}
.notice{border-radius:var(--r);padding:20px 22px;border:none;border-left:4px solid #E4E8EE;display:flex;flex-direction:column;justify-content:center;gap:8px;height:100%;box-sizing:border-box;background:#F9FAFC}
.notice .notice-icon{display:none}
.notice .n-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#96A1AE}
.notice .n-val{font-size:34px;font-weight:900;letter-spacing:-.03em;line-height:1;color:var(--ink)}
.notice .n-sub{font-size:13px;color:#96A1AE;margin-top:4px}
.notice.warn .n-val{color:#2A44A8}
.notice.bad .n-val{color:#B3243C}
.notice.good .n-val{color:#0F1620}
.notice.info .n-val{color:#55606E}
.notice.warn{border-left-color:#2A44A8}
.notice.bad{border-left-color:#B3243C}
.notice.good{border-left-color:#0F1620}
.notice.info{border-left-color:#55606E}
.notice.warn{background:#fff;border-top-color:#E4E8EE;color:var(--ink1)}
.notice.bad{background:#fff;border-top-color:#E4E8EE;color:var(--ink1)}
.notice.good{background:#fff;border-top-color:#E4E8EE;color:var(--ink1)}
.notice.info{background:#fff;border-top-color:#E4E8EE;color:var(--ink1)}
.notice .notice-icon{color:var(--ink3)}
.notice .hi-warn{color:var(--warn);font-weight:700}
.notice .hi-good{color:var(--good);font-weight:700}
.notice .hi-bad{color:var(--bad);font-weight:700}

/* TOOLBAR */
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;padding:10px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r2)}
.toolbar-l,.toolbar-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tb-lbl{font-size:11px;color:var(--ink2);font-weight:800;letter-spacing:.04em;white-space:nowrap}
.chip{border:1px solid var(--border2);background:var(--surface);color:var(--ink2);border-radius:var(--rp);padding:5px 13px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--sans);
  transition:border-color var(--d-fast) linear,color var(--d-fast) linear,transform var(--d-fast) var(--ease)}
.chip:hover{border-color:var(--ink3);color:var(--ink);transform:translateY(-1px)}
.chip:hover{border-color:var(--accent);color:var(--ink)}
.chip.active{background:var(--accent);border-color:var(--accent);color:var(--accent-text);font-weight:900}
.srch{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r3);padding:6px 11px;color:var(--ink);font-family:var(--sans);font-size:13px;outline:none;min-width:160px;transition:border-color .15s}
.srch:focus{border-color:var(--accent)}
.sel{background:var(--surface);border:1px solid var(--border2);border-radius:var(--r3);padding:6px 11px;color:var(--ink);font-family:var(--sans);font-size:13px;outline:none;cursor:pointer}

/* SECTION DIVIDER */
.sec-label{font-size:11px;font-weight:800;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase;margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.sec-label::after{content:'';flex:1;height:1px;background:var(--border)}

/* DRAWER */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:150;display:none;backdrop-filter:blur(3px)}
.overlay.open{display:block}
.drawer{position:fixed;top:0;right:-620px;width:580px;height:100vh;background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--sh-lg);z-index:160;overflow-y:auto;transition:right .28s cubic-bezier(.22,.68,0,1.2);padding:24px}
.drawer.open{right:0}
.drawer-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.drawer-close{border:none;background:var(--surface3);border-radius:50%;width:30px;height:30px;color:var(--ink2);font-size:19px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.drawer-close:hover{background:var(--bad-dim);color:var(--bad)}
.drawer-cover{height:120px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;color:rgba(255,255,255,.9);text-align:center;padding:16px;margin-bottom:12px}
.sim-lbl{font-size:10px;color:var(--ink3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.sim-inp{background:var(--surface2);border:1.5px solid var(--border2);border-radius:var(--r3);padding:7px 10px;color:var(--ink);font-family:var(--sans);font-size:13px;width:100%;outline:none;transition:border-color .15s}
.sim-inp:focus{border-color:var(--accent)}

/* STACKED BAR */
.stacked-wrap{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.stacked-row{display:flex;align-items:center;gap:8px}
.stacked-lbl{font-size:12px;color:var(--ink2);width:68px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stacked-bar{flex:1;height:20px;border-radius:var(--r3);display:flex;overflow:hidden}
.stacked-seg{height:100%;transition:width var(--d-slow) var(--ease),filter var(--d-fast) linear;min-width:0}
.stacked-seg:hover{filter:brightness(1.15)}
.stacked-tot{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums;flex-shrink:0;width:76px;text-align:right;font-weight:700}

/* LEGEND */
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}
.leg-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--ink3)}
.leg-dot{width:9px;height:9px;border-radius:var(--r5);flex-shrink:0}

/* RESPONSIVE — 태블릿 */
@media(max-width:1200px){
  .g6{grid-template-columns:repeat(3,1fr)}
  .g5{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(2,1fr)}
  .pill-bar{grid-template-columns:repeat(2,1fr);height:auto;padding:12px 20px;gap:8px}
  .pill{border-right:none;border:1px solid var(--band-border);border-radius:var(--r);padding:16px 20px}
  .pill-val{font-size:34px}
}
/* RESPONSIVE — 모바일 */
@media(max-width:768px){
  .g2,.g2e,.g3,.g5,.g6{grid-template-columns:1fr}
  .g4{grid-template-columns:repeat(2,1fr)}
  main{padding:12px 12px 60px}
  .hdr{padding:0 14px;gap:8px}
  .brand{font-size:13px}
  .brand-mark{width:22px;height:22px;font-size:11px}
  .mpick span{display:none}
  .mpick input{font-size:11px;padding:4px 7px}
  .sync-st{display:none}
  .tabs-bar{padding:0 8px}
  .tab-btn{font-size:11px;padding:0 10px}
  .pill-bar{grid-template-columns:repeat(2,1fr);height:auto;padding:10px 12px;gap:8px}
  .pill{border-right:none;border:1px solid var(--band-border);border-radius:var(--r);padding:10px 12px}
  .pill-val{font-size:22px}
  .pill-lbl{font-size:10px}
  .pill-sub{font-size:11px}
  .kpi{padding:14px 16px}
  .kpi-val{font-size:22px}
  .kpi-lbl{font-size:11px}
  .kpi-sub{font-size:12px}
  .card{padding:14px 14px;overflow-x:auto}
  .card-title{font-size:13px}
  table{min-width:520px}
  th{font-size:10px;padding:8px 8px}
  td{font-size:12px;padding:8px 8px}
  .drawer{width:100%;right:-100%}
  .sec-label{font-size:10px;margin:14px 0 8px}
  .toolbar{flex-direction:column;align-items:flex-start;gap:8px}
  .chip{font-size:11px;padding:4px 10px}
  .srch{min-width:120px;font-size:12px}
  .stacked-lbl{width:52px;font-size:11px}
  .stacked-tot{width:60px;font-size:11px}
}


/* ══════════════════════════════════════
   BOOK MARKETING TIMELINE
══════════════════════════════════════ */
.mkt-timeline-wrap{overflow-x:auto;padding-bottom:8px}
.tl-chip-wrap>div:not(.tl-tooltip){transition:filter var(--d-fast) linear}
.tl-chip-wrap:hover>div:not(.tl-tooltip){filter:brightness(.92)}
.mkt-tl-header{display:flex;align-items:flex-end;margin-bottom:4px}
.mkt-tl-row{display:flex;align-items:stretch;margin-bottom:4px}
.mkt-lane-label{width:90px;flex-shrink:0;padding:0 8px 0 10px;display:flex;align-items:center;font-size:10px;font-weight:800;color:var(--ink2);min-height:28px;background:var(--surface2);border-radius:4px 0 0 4px;margin-right:4px}
.mkt-dates-row,.mkt-acts-row{display:flex;flex:1;min-width:0}
.mkt-day-num{font-size:10px;color:var(--ink3);padding:2px 0;line-height:1}
.mkt-month-label{font-size:10px;font-weight:800;color:var(--ink2);margin-bottom:4px}
.mkt-pub-marker{font-size:10px;font-weight:900;background:var(--accent);color:var(--accent-text);border-radius:var(--r5);padding:1px 3px;margin-top:4px;white-space:nowrap}
.mkt-pubdate .mkt-day-num{color:var(--accent-text);background:var(--accent);border-radius:var(--r4);font-weight:900}
.mkt-today-col .mkt-day-num{color:var(--bad);font-weight:900}
.mkt-weekend-col{opacity:.6}
.mkt-act-cell{width:28px;min-width:28px;flex-shrink:0;height:28px}
.mkt-act-bar{height:100%;display:flex;align-items:center;overflow:hidden;padding:0 3px;position:relative}
.mkt-act-label{font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px;position:absolute;left:4px;pointer-events:none}
.mkt-act-empty{height:100%;background:transparent}
.mkt-week-even{background:rgba(26,82,138,.05)}
.mkt-week-odd{background:rgba(26,82,138,.02)}
.mkt-prepub-col{background:rgba(154,98,16,.07) !important}
.mkt-weekend-col{opacity:.75}
.mkt-week-label{font-size:10px;font-weight:900;color:var(--info);letter-spacing:.02em;line-height:1;margin-bottom:4px;height:10px;white-space:nowrap;overflow:hidden}
.mkt-date-cell2{width:28px;min-width:28px;flex-shrink:0;text-align:center}
.mkt-dow{font-size:10px;font-weight:700;color:var(--ink3);line-height:1;margin-top:4px}
.mkt-dow-sun{color:var(--bad)}
.mkt-dow-sat{color:var(--info)}
.mkt-date-cell{width:28px;min-width:28px;text-align:center;position:relative;flex-shrink:0;padding-bottom:2px}


.cal-nav-btn:hover{border-color:var(--accent);color:var(--ink)}

.cal-wday{text-align:center;font-size:11px;font-weight:800;color:var(--ink3);padding:6px 0;letter-spacing:.04em}
.cal-wday.cal-weekend{color:var(--bad)}
.cal-cell{min-height:110px;border:1px solid var(--border);border-radius:var(--r3);padding:8px;cursor:pointer;transition:all .15s;background:var(--surface);position:relative}
.cal-cell:hover{border-color:var(--accent);background:var(--accent-dim)}
.cal-cell.cal-empty{background:var(--surface2);border-color:var(--border);cursor:default;opacity:.4}
.cal-cell.cal-today{border-color:var(--accent);border-width:2px;background:var(--accent-dim)}
.cal-cell.cal-selected{border-color:var(--ink);border-width:2px;background:var(--surface2)}
.cal-date-num{font-size:13px;font-weight:900;color:var(--ink);margin-bottom:4px}
.cal-date-num.cal-weekend{color:var(--bad)}
.cal-today .cal-date-num{color:var(--accent-text);background:var(--accent);width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px}
.cal-acts{display:flex;flex-direction:column;gap:4px}
.cal-act-chip{display:flex;align-items:center;gap:4px;padding:2px 5px;border-radius:var(--r4);font-size:10px;font-weight:700;line-height:1.3}
.cal-more{font-size:10px;color:var(--ink3);font-weight:700;padding:1px 3px}
.cal-detail{background:var(--surface);border:1.5px solid var(--accent);border-radius:var(--r);padding:20px 22px;margin-top:12px;box-shadow:var(--sh-md)}
.cal-detail-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}

/* ── 타임라인 칩 툴팁 ── */
.tl-tooltip {
  /* 타임라인이 overflow:auto 라 absolute 로 두면 잘린다. 뷰포트 기준으로 띄운다 */
  position:fixed;
  left:0; top:0;
  background:var(--ink);
  color:#fff;
  font-size:11px;
  font-weight:600;
  white-space:nowrap;
  min-width:190px;
  padding:9px 12px;
  border-radius:var(--r2);
  text-align:left;
  pointer-events:none;
  opacity:0;
  transition:opacity .15s;
  z-index:999;
  box-shadow:0 2px 8px rgba(0,0,0,.25);
}

.tl-chip-wrap { position:absolute; }
</style>

/* ─────────────────────────────────────

───────────────────────────────────── */
const TABS = [
  {id:"summary",  label:"본부 종합"},
  {div:true},

  {id:"mkt",      label:"실판매"},

  {id:"royalty",  label:"인세 정산"},
  {div:true},
  {id:"data",     label:"입력 가이드"},
];
let activeTab = "summary";

/* ─────────────────────────────────────
   SAMPLE DATA
───────────────────────────────────── */
const MONTHS = ["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];
const STORES_ON  = ["교보","예스24","알라딘"];
const STORES_OFF = ["영풍","반디","기타서점"];
const STORES_ETC = ["쿠팡","네이버","자사"];
const ALL_STORES = [...STORES_ON,...STORES_OFF,...STORES_ETC];

let ANNUAL_TARGET = 0;
// 월별 실적 — 시트 연동 전 초기값 전부 0
const M_SHIP_SALES  = Array(12).fill(0); // 출고매출
const M_RETURN      = Array(12).fill(0); // 반품액
const M_NET_SALES   = Array(12).fill(0); // 순매출
const M_MKT_COST    = Array(12).fill(0); // 마케팅비
const M_PUB_COST    = Array(12).fill(0); // 출판비
const M_COM_COST    = Array(12).fill(0); // 공통비
const M_TOTAL_COST  = Array(12).fill(0);
// 계획(미지급) 비용 — 지급분과 섞지 않고 따로 담는다
// 01_월별실적 수식이 계획을 포함하도록 고쳐졌는지에 따라 계산이 달라지므로,
// 두 상태 모두에서 맞게 나오도록 여기서 판정한다.
function costSplit(i){
  const sheet = M_TOTAL_COST[i] || 0;   // 01_월별실적 값
  const plan  = M_TOTAL_PLAN[i] || 0;   // 비용원장에서 직접 센 계획
  // 시트 값이 계획보다 작으면 수식이 아직 '지급'만 걸러내고 있다는 뜻
  const planIncluded = sheet >= plan && plan > 0 ? (sheet - plan) >= 0 : false;
  if (plan === 0) return {total: sheet, fixed: sheet, plan: 0};
  if (sheet < plan) return {total: sheet + plan, fixed: sheet, plan: plan};  // 수식 미수정
  return {total: sheet, fixed: sheet - plan, plan: plan};                    // 수식 수정 완료
}
const M_MKT_PLAN    = Array(12).fill(0);
const M_PUB_PLAN    = Array(12).fill(0);
const M_COM_PLAN    = Array(12).fill(0);
const M_TOTAL_PLAN  = Array(12).fill(0);
// 도서에 붙지 않은 비용 — 사유를 구분해서 담는다
// 미상: 상반기 소급 불가 / 기타: 특정 도서에 귀속되지 않는 공통 비용
const COST_NOBOOK = {미상:0, 기타:0, 배분시작:''};
// 귀속팀 x 대구분 집계 — 예산 데이터가 없으므로 '어디에 얼마 쓰는지'를 대신 보여준다
// {팀: {대구분: {fixed, plan}}}
const COST_BY_CAT = {};
// 지급월 기준 집계 — '이번 달 실제로 나가는 돈'. 귀속월(손익)과 시점이 다르다.
// {지급월: {fixed, plan, fromPrev}}  fromPrev = 이전 달 귀속분 금액
const COST_BY_PAY = {};
// 채널 링크 매칭 — 00_설정의 채널명은 'SH' '마앤플' 같은 축약형이라
// 부분 문자가 순서대로 들어있는지로 느슨하게 맞춘다.
const CH_LINK_ALIAS = { 'SH':'김상현', 'sh':'김상현' };
function platformOf(url){
  const u = String(url||'').toLowerCase();
  if (u.indexOf('instagram') >= 0) return '인스타';
  if (u.indexOf('youtube')   >= 0) return '유튜브';
  if (u.indexOf('tiktok')    >= 0) return '틱톡';
  if (u.indexOf('threads')   >= 0) return '스레드';
  if (u.indexOf('blog.')     >= 0 || u.indexOf('naver') >= 0) return '블로그';
  return '';
}
function subseqMatch(abbr, full){
  const a = String(abbr||'').replace(/\s/g,''), f = String(full||'').replace(/\s/g,'');
  if (!a || !f) return false;
  let i = 0;
  for (const ch of f) { if (ch === a[i]) i++; if (i >= a.length) return true; }
  return false;
}
function channelLinkFor(kind, acct){
  const map = CFG.channelLinks || {};
  const keys = Object.keys(map);
  if (!keys.length) return '';
  const norm = v => String(v||'').replace(/\s/g,'');
  const same = keys.filter(k => !kind || platformOf(map[k]) === kind);
  const pool = same.length ? same : keys;
  const tryFind = arr => {
    for (const k of arr) if (norm(k) === norm(acct)) return map[k];
    for (const k of arr) { const al = CH_LINK_ALIAS[norm(k)]; if (al && norm(acct).indexOf(norm(al)) >= 0) return map[k]; }
    for (const k of arr) if (norm(acct).indexOf(norm(k)) >= 0) return map[k];
    for (const k of arr) if (subseqMatch(k, acct)) return map[k];
    return '';
  };
  return tryFind(pool) || (same.length ? tryFind(keys) : '');
}

// 그로스 — 채널
// 인세 누적 시작점 — 이 달부터의 판매만 누적해 구간 인세를 계산한다.
// 그 이전 판매분은 과거 방식으로 이미 정산이 끝났으므로 세지 않는다.
const ROY_BASE_YM = '2026-01';

// 시트 드롭다운 YES/NO. 체크박스(TRUE)·Y·O·체크도 함께 받는다.

// 구간 인세율 읽기
// 단일:  1구간 인세율 10, 나머지 비움
// 구간:  1구간 인세율 7 / 1구간 상한 10000 / 2구간 인세율 8 (마지막 구간은 상한 비움)
function readTiers(r){
  const out = [];
  for (let i = 1; i <= 4; i++){
    const rate = toNum(r[`${i}구간 인세율`]);
    const cap  = toNum(r[`${i}구간 상한`]);
    if (!rate) continue;
    out.push({ rate: rate > 1 ? rate/100 : rate, cap: cap > 0 ? cap : Infinity });
  }
  // 상한 순으로 정렬하고 마지막은 무한대로
  out.sort((a,b) => a.cap - b.cap);
  if (out.length) out[out.length-1].cap = Infinity;
  return out;
}

// 누적 시작 ~ 종료 구간에 걸친 인세액. from 은 이미 팔린 누적부수.
function tierAmount(tiers, price, already, qty){
  if (!tiers || !tiers.length) return {amount:0, parts:[]};
  const parts = [];
  let left = qty, cum = already, amount = 0;
  for (const t of tiers){
    if (left <= 0) break;
    const room = t.cap - cum;
    if (room <= 0) continue;
    const take = Math.min(left, room);
    const per = Math.round(price * t.rate);
    amount += take * per;
    parts.push({ rate: t.rate, qty: take, per, sub: take * per, from: cum + 1, to: cum + take });
    cum  += take;
    left -= take;
  }
  return {amount, parts};
}

  if(!s) return rows;
  return [...rows].sort((a,b)=>{

    if(numCols.includes(s.col)){va=Number(va);vb=Number(vb);}
    const res = va<vb?-1:va>vb?1:0;
    return s.dir==='asc'?res:-res;
  });

/* ─────────────────────────────────────
   CSV 파싱 유틸
───────────────────────────────────── */
function parseCSV(text) {
  const lines = text.trim().split("\n");
  if (lines.length < 2) return [];
  const headers = splitCSVRow(lines[0]);
  return lines.slice(1).map(line => {
    const vals = splitCSVRow(line);
    const obj = {};
    headers.forEach((h, i) => { obj[h.trim()] = (vals[i]||'').replace(/\r/g,'').trim(); });
    return obj;
  }).filter(r => Object.values(r).some(v => v !== ''));
}

function splitCSVRow(row) {
  const result = []; let cur = ''; let inQ = false;
  for (let i = 0; i < row.length; i++) {
    const c = row[i];
    if (c === '"') { inQ = !inQ; }
    else if (c === ',' && !inQ) { result.push(cur); cur = ''; }
    else { cur += c; }
  }
  result.push(cur);
  return result;
}

// 시트가 화면 표시값 그대로 내보내므로 통화·단위 서식이 섞여 들어온다.
// ₩ 같은 기호를 남기면 Number() 가 NaN 이 되어 조용히 0으로 처리된다.
function toNum(v) {
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  let t = String(v == null ? '' : v).trim();
  if (!t) return 0;
  const neg = /^\(.*\)$/.test(t);              // (1,200,000) = 음수 표기
  t = t.replace(/[()]/g, '')
       .replace(/[\u20A9\u0024\u20AC\u00A5\u00A3]/g, '')   // ₩ $ € ¥ £
       .replace(/[,\s'\"]/g, '')
       .replace(/(원|%|부|건|개|명)$/g, '');
  const n = Number(t);
  if (!isFinite(n)) return 0;
  return neg ? -n : n;
}

async function fetchSheet(gid) {
  let res = await fetch(sheetURL(gid), { cache: 'no-store' }).catch(() => null);
  if (!res || !res.ok) {
    // export 실패 시에만 구 방식으로 재시도
    res = await fetch(sheetURLLegacy(gid), { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
  }
  return parseCSV(await res.text());

// CSV를 2차원 배열 그대로 반환 (헤더 키 충돌 없이 열 위치로 접근)
function parseCSVGrid(text) {
  return text.trim().split('\n').map(line =>
    splitCSVRow(line).map(v => (v || '').replace(/\r/g, '').trim())
  );
}

// 앞쪽 빈 줄을 살려두는 파서.
// 링크 미러처럼 '좌표가 원본과 1:1로 맞아야 하는' 시트에 쓴다.
// (기본 parseCSVGrid 는 text.trim() 으로 앞 빈 줄을 지워 행이 밀린다)
function parseCSVGridKeepRows(text) {
  return String(text).replace(/\r/g, '').replace(/\n+$/, '').split('\n').map(line =>
    splitCSVRow(line).map(v => (v || '').trim())
  );
}

// 캠페인 시트는 gviz 대신 export 사용.
// gviz는 열마다 단일 데이터 타입을 강제해서, 같은 열에 날짜(기본정보)와
// 문자열(액션명)이 섞이면 타입이 다른 쪽을 빈 값으로 날려버림.
async function fetchMktSheetGrid(gid) {
  const url = `https://docs.google.com/spreadsheets/d/${CFG.mktSheetId}/export?format=csv&gid=${gid}`;
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return parseCSVGrid(await res.text());
}

async function fetchMktSheet(gid) {
  const grid = await fetchMktSheetGrid(gid);
  if (grid.length < 2) return [];
  const headers = grid[0];
  return grid.slice(1).map(vals => {
    const obj = {};
    headers.forEach((h, i) => { obj[h.trim()] = vals[i] || ''; });
    return obj;
  }).filter(r => Object.values(r).some(v => v !== ''));
}

// '26년' 같은 연도 열과 '01/14' 같은 월일 값을 조합한다.
// 출간 기획 시트는 배본일이 연도 없이 표시되는 경우가 있다.
function dateWithYear(v, yearHint){
  var d = parseAnyDate(v);
  if (d) return d;
  var t = String(v == null ? '' : v).trim();
  var m = t.match(/^(\d{1,2})\s*[\/.\-월]\s*(\d{1,2})/);
  if (!m) return null;
  var ym = String(yearHint || '').match(/(\d{2,4})/);
  if (!ym) return null;
  var y = +ym[1]; if (y < 100) y += 2000;
  var mo = +m[1], dd = +m[2];
  if (mo < 1 || mo > 12 || dd < 1 || dd > 31) return null;
  return new Date(y, mo - 1, dd);
}

// 'MM-DD' / '3월 14일' / '2019-03-14' 등에서 월·일만 뽑는다 (생년은 쓰지 않는다)
function mdOf(v){
  var t = String(v == null ? '' : v).trim();
  if (!t) return '';
  var m = t.match(/(\d{1,2})\s*[-\/.월]\s*(\d{1,2})/g);
  var last = t.match(/(?:^|[^\d])(\d{1,2})\s*[-\/.월]\s*(\d{1,2})\s*일?\s*$/);
  if (last) return ('0'+last[1]).slice(-2) + '-' + ('0'+last[2]).slice(-2);
  var d = parseAnyDate(t);
  if (d) return ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2);
  return '';
}

// ── 그로스 채널 시트 ──
async function fetchChGrid(tab, keepRows){
  const base = `https://docs.google.com/spreadsheets/d/${CFG.chSheetId}/`;
  const url  = tab.gid
    ? `${base}export?format=csv&gid=${tab.gid}`
    : `${base}gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tab.name)}`;
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const txt = await res.text();
  return keepRows ? parseCSVGridKeepRows(txt) : parseCSVGrid(txt);
}
